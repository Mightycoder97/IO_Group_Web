<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
        />
        <meta name="theme-color" content="#1B5E20" />
        <title>Mapa de Sedes - IO Group</title>

        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
        <link rel="preconnect" href="https://maps.googleapis.com" crossorigin />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <link href="../../css/global.css?v=2.5" rel="stylesheet" />

        <style>
            body {
                margin: 0;
                overflow: hidden;
            }

            body.control-app.map-tool-page {
                height: 100vh;
                max-height: 100vh;
                overflow: hidden;
            }

            .app-container {
                display: flex;
                height: 100vh;
                width: 100vw;
                overflow: hidden;
                background: #f5f7f8;
            }

            .sidebar {
                width: 250px;
                height: 100%;
                flex-shrink: 0;
                background: #fff;
                border-right: 1px solid #e5e7eb;
                z-index: 1000;
                transition: transform 0.3s ease;
            }

            .main-content {
                flex: 1;
                height: 100%;
                position: relative;
                padding: 0 !important;
                overflow: hidden;
            }

            #map-wrapper,
            #map {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            .control-app.map-tool-page #map-wrapper,
            .control-app.map-tool-page #map {
                border: 0;
                border-radius: 0;
                box-shadow: none;
                height: 100% !important;
                margin: 0;
                min-height: 100%;
                overflow: hidden;
            }

            #map-wrapper {
                z-index: 1;
            }

            .map-panel {
                position: absolute;
                top: 16px;
                left: 16px;
                z-index: 100;
                width: 420px;
                max-width: calc(100vw - 32px);
                max-height: calc(100vh - 32px);
                overflow: auto;
                background: #ffffff;
                border: 1px solid rgba(15, 23, 42, 0.12);
                border-radius: 14px;
                box-shadow: 0 14px 34px rgba(15, 23, 42, 0.16);
                contain: layout paint;
            }

            .map-panel-inner {
                padding: 16px;
            }

            .map-panel-header {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 14px;
            }

            .map-panel-title {
                margin: 0;
                font-size: 1rem;
                font-weight: 800;
                color: #111827;
            }

            .map-panel-subtitle {
                display: block;
                margin-top: 2px;
                color: #64748b;
                font-size: 0.78rem;
                font-weight: 500;
            }

            .map-icon-btn {
                width: 38px;
                height: 38px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: 1px solid #d9dee7;
                border-radius: 10px;
                color: #334155;
                background: #fff;
                transition:
                    transform 0.15s ease,
                    border-color 0.15s ease,
                    color 0.15s ease;
            }

            .map-icon-btn:hover {
                transform: translateY(-1px);
                border-color: #198754;
                color: #198754;
            }

            .map-field {
                position: relative;
                margin-bottom: 12px;
            }

            .map-field i {
                position: absolute;
                left: 13px;
                top: 50%;
                transform: translateY(-50%);
                color: #198754;
                z-index: 2;
            }

            .map-field .form-control {
                min-height: 44px;
                padding-left: 38px;
                border-radius: 12px;
                border-color: #d9dee7;
                box-shadow: none;
            }

            .map-field .form-control:focus {
                border-color: #198754;
                box-shadow: 0 0 0 0.18rem rgba(25, 135, 84, 0.12);
            }

            .map-toolbar {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
                margin-bottom: 14px;
            }

            .map-toolbar .btn {
                min-height: 38px;
                border-radius: 10px;
                font-size: 0.82rem;
                font-weight: 700;
            }

            .frequency-grid {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 7px;
            }

            .frequency-grid .btn {
                min-height: 34px;
                padding: 0 7px;
                border-radius: 999px;
                font-size: 0.76rem;
                font-weight: 700;
                white-space: nowrap;
            }

            .selected-sedes {
                min-height: 0;
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }

            .sede-chip {
                display: inline-flex;
                align-items: center;
                max-width: 100%;
                gap: 6px;
                padding: 3px 8px;
                border: 1px solid #bbf7d0;
                border-radius: 999px;
                background: #ecfdf3;
                color: #166534;
                font-size: 0.76rem;
                font-weight: 700;
            }

            .sede-chip .btn-close {
                width: 0.55rem;
                height: 0.55rem;
                padding: 0;
            }

            .suggestion-item {
                min-height: 58px;
            }

            .suggestion-item:hover,
            .nearby-item:hover {
                background: #f8fafc;
            }

            .nearby-panel {
                margin-top: 14px;
                border-top: 1px solid #e5e7eb;
                padding-top: 12px;
            }

            .nearby-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 8px;
            }

            .nearby-head strong {
                font-size: 0.83rem;
                color: #111827;
            }

            .nearby-head span {
                color: #64748b;
                font-size: 0.76rem;
                font-weight: 700;
            }

            .nearby-list {
                display: grid;
                gap: 6px;
                max-height: 260px;
                overflow: auto;
            }

            .nearby-item {
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                border: 1px solid #e5e7eb;
                border-radius: 10px;
                background: #fff;
                padding: 9px 10px;
                color: #111827;
                text-align: left;
            }

            .nearby-item strong {
                display: block;
                font-size: 0.82rem;
                line-height: 1.15;
            }

            .nearby-item small {
                display: block;
                margin-top: 2px;
                color: #64748b;
                font-size: 0.72rem;
            }

            .nearby-item b {
                flex: 0 0 auto;
                color: #198754;
                font-size: 0.78rem;
            }

            .nearby-empty {
                border: 1px dashed #cbd5e1;
                border-radius: 10px;
                padding: 12px;
                color: #64748b;
                font-size: 0.82rem;
                text-align: center;
            }

            .map-status {
                position: absolute;
                top: 16px;
                right: 16px;
                z-index: 100;
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .map-status-pill {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                min-height: 38px;
                padding: 0 12px;
                border: 1px solid rgba(15, 23, 42, 0.12);
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.94);
                box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
                color: #111827;
                font-size: 0.82rem;
                font-weight: 700;
            }

            .floating-controls {
                position: absolute;
                right: 18px;
                bottom: 24px;
                z-index: 100;
                display: grid;
                gap: 10px;
            }

            .map-btn {
                width: 48px;
                height: 48px;
                border: 1px solid rgba(15, 23, 42, 0.12);
                border-radius: 50%;
                background: #fff;
                box-shadow: 0 12px 30px rgba(15, 23, 42, 0.15);
                color: #334155;
                font-size: 1.1rem;
            }

            .map-btn:hover {
                color: #198754;
            }

            .map-btn.primary {
                background: #198754;
                color: #fff;
            }

            .sidebar-toggle-btn {
                position: absolute;
                top: 16px;
                right: 16px;
                z-index: 120;
            }

            .district-row {
                padding: 4px 2px;
            }

            .map-info-window {
                max-width: 280px;
                padding: 4px;
            }

            .pac-container {
                z-index: 2000;
                border-radius: 12px;
                box-shadow: 0 18px 45px rgba(15, 23, 42, 0.18);
            }

            @media (max-width: 992px) {
                .map-panel {
                    width: 390px;
                }

                .frequency-grid {
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                }
            }

            @media (max-width: 768px) {
                .control-app.map-tool-page .main-content {
                    max-width: 100vw;
                }

                .map-panel {
                    top: auto;
                    left: 0;
                    bottom: 0;
                    width: 100%;
                    max-width: 100%;
                    max-height: 54vh;
                    border-radius: 18px 18px 0 0;
                }

                .map-status {
                    top: 12px;
                    left: 12px;
                    right: 70px;
                    justify-content: flex-start;
                }

                .map-status-pill {
                    min-height: 34px;
                    font-size: 0.76rem;
                }

                .floating-controls {
                    right: 14px;
                    bottom: calc(54vh + 16px);
                }
            }
        </style>
    </head>

    <body class="control-app map-tool-page">
        <div class="app-container">
            <aside class="sidebar" id="sidebar"></aside>

            <main class="main-content position-relative">
                <button
                    class="btn btn-light shadow-sm sidebar-toggle-btn d-md-none"
                    onclick="toggleSidebar()"
                >
                    <i class="bi bi-list"></i>
                </button>

                <section class="map-panel" aria-label="Controles del mapa">
                    <div class="map-panel-inner">
                        <div class="map-panel-header">
                            <div>
                                <h1 class="map-panel-title">Mapa de sedes</h1>
                                <span
                                    class="map-panel-subtitle"
                                    id="mapModeLabel"
                                    >Vista actual</span
                                >
                            </div>
                            <button
                                class="map-icon-btn"
                                id="clearMapBtn"
                                type="button"
                                title="Limpiar mapa"
                            >
                                <i class="bi bi-arrow-counterclockwise"></i>
                            </button>
                        </div>

                        <div class="map-field">
                            <i class="bi bi-geo-alt-fill"></i>
                            <input
                                type="text"
                                class="form-control"
                                id="addressSearch"
                                placeholder="Buscar direccion"
                            />
                        </div>

                        <div class="map-toolbar">
                            <button
                                class="btn btn-outline-success"
                                type="button"
                                data-bs-toggle="offcanvas"
                                data-bs-target="#filtersOffcanvas"
                            >
                                <i class="bi bi-funnel"></i> Filtros
                            </button>
                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                id="fitResultsBtn"
                            >
                                <i class="bi bi-bounding-box"></i> Ajustar
                            </button>
                            <button
                                class="btn btn-outline-danger"
                                type="button"
                                id="clearNearbyBtn"
                            >
                                <i class="bi bi-x-lg"></i> Radar
                            </button>
                        </div>

                        <div class="map-field mb-2">
                            <i class="bi bi-search"></i>
                            <input
                                type="text"
                                class="form-control"
                                id="sedeSearch"
                                placeholder="Buscar sede o RUC"
                            />
                            <div
                                class="list-group position-absolute w-100 shadow-sm border-0 d-none"
                                id="sedeSearchResults"
                                style="
                                    z-index: 1200;
                                    top: 48px;
                                    max-height: 260px;
                                    overflow-y: auto;
                                "
                            ></div>
                        </div>

                        <div
                            class="selected-sedes mb-3"
                            id="selectedSedesContainer"
                        ></div>

                        <div
                            class="d-flex align-items-center justify-content-between mb-2"
                        >
                            <span
                                class="small text-muted text-uppercase fw-bold"
                                >Frecuencia</span
                            >
                            <span class="small text-muted"
                                ><span id="visibleSedesCount">0</span>
                                visibles</span
                            >
                        </div>
                        <div class="frequency-grid" id="frequencyFilters">
                            <button
                                class="btn btn-sm btn-outline-secondary filter-freq"
                                data-freq="diario"
                            >
                                Diario
                            </button>
                            <button
                                class="btn btn-sm btn-outline-secondary filter-freq"
                                data-freq="interdiario"
                            >
                                Inter.
                            </button>
                            <button
                                class="btn btn-sm btn-outline-secondary filter-freq"
                                data-freq="semanal"
                            >
                                Semanal
                            </button>
                            <button
                                class="btn btn-sm btn-outline-secondary filter-freq"
                                data-freq="quincenal"
                            >
                                Quinc.
                            </button>
                            <button
                                class="btn btn-sm btn-outline-secondary filter-freq"
                                data-freq="mensual"
                            >
                                Mensual
                            </button>
                            <button
                                class="btn btn-sm btn-outline-secondary filter-freq"
                                data-freq="bimestral"
                            >
                                Bimestral
                            </button>
                            <button
                                class="btn btn-sm btn-outline-secondary filter-freq"
                                data-freq="trimestral"
                            >
                                Trimestral
                            </button>
                            <button
                                class="btn btn-sm btn-outline-secondary filter-freq"
                                data-freq="eventual"
                            >
                                Eventual
                            </button>
                        </div>

                        <div
                            class="nearby-panel d-none"
                            id="nearbyResultsPanel"
                        >
                            <div class="nearby-head">
                                <strong>Sedes cercanas</strong>
                                <span id="nearbySummary"></span>
                            </div>
                            <div class="nearby-list" id="nearbySedesList"></div>
                        </div>
                    </div>
                </section>

                <div class="map-status">
                    <span class="map-status-pill">
                        <i class="bi bi-geo-alt-fill text-success"></i>
                        <b id="totalSedes">0</b> sedes
                    </span>
                    <span class="map-status-pill">
                        <i class="bi bi-check-circle-fill text-success"></i>
                        <b id="activeSedesCount">0</b> activas
                    </span>
                    <span class="map-status-pill">
                        <i class="bi bi-pin-map-fill text-primary"></i>
                        <span id="districtSummary">Todos</span>
                    </span>
                    <span
                        class="map-status-pill d-none"
                        id="invalidGpsPill"
                        title="Coordenadas fuera de Lima/Ica excluidas"
                    >
                        <i
                            class="bi bi-exclamation-triangle-fill text-warning"
                        ></i>
                        <b id="invalidGpsCount">0</b> GPS fuera
                    </span>
                </div>

                <div id="map-wrapper">
                    <div id="map"></div>
                </div>

                <div class="floating-controls">
                    <button
                        class="map-btn primary"
                        id="btnMyLocation"
                        title="Mi ubicacion"
                    >
                        <i class="bi bi-crosshair"></i>
                    </button>
                    <button class="map-btn" id="zoomIn" title="Acercar">
                        <i class="bi bi-plus-lg"></i>
                    </button>
                    <button class="map-btn" id="zoomOut" title="Alejar">
                        <i class="bi bi-dash-lg"></i>
                    </button>
                </div>
            </main>
        </div>

        <div
            class="offcanvas offcanvas-start"
            tabindex="-1"
            id="filtersOffcanvas"
            aria-labelledby="filtersLabel"
            style="width: 340px"
        >
            <div class="offcanvas-header bg-light">
                <h5
                    class="offcanvas-title fw-bold text-success"
                    id="filtersLabel"
                >
                    <i class="bi bi-funnel-fill me-2"></i>Filtros
                </h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="offcanvas"
                    aria-label="Close"
                ></button>
            </div>
            <div class="offcanvas-body">
                <div class="mb-4">
                    <div
                        class="d-flex align-items-center justify-content-between mb-3"
                    >
                        <label
                            class="form-label small text-muted text-uppercase fw-bold m-0"
                            >Cercania</label
                        >
                        <span class="badge bg-light text-dark border"
                            ><span id="radiusValue">10</span> km</span
                        >
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="nearbyToggle"
                        />
                        <label
                            class="form-check-label fw-medium"
                            for="nearbyToggle"
                            >Activas cercanas</label
                        >
                    </div>
                    <div class="opacity-50" id="radarControls">
                        <input
                            type="range"
                            class="form-range"
                            min="1"
                            max="50"
                            step="1"
                            value="10"
                            id="radiusRange"
                            disabled
                        />
                    </div>
                </div>

                <div>
                    <div
                        class="d-flex justify-content-between align-items-center mb-2"
                    >
                        <label
                            class="form-label small text-muted text-uppercase fw-bold m-0"
                            >Distritos</label
                        >
                        <button
                            class="btn btn-link btn-sm p-0 text-decoration-none"
                            id="clearDistrictsBtn"
                        >
                            Limpiar <span id="selectedDistrictCount">0</span>
                        </button>
                    </div>
                    <div
                        class="border rounded-3 p-2 overflow-auto bg-white"
                        style="max-height: 52vh"
                        id="districtFilters"
                    >
                        <div class="text-center text-muted small py-3">
                            <div
                                class="spinner-border spinner-border-sm"
                                role="status"
                            ></div>
                            Cargando...
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-3 border-top">
                <button
                    class="btn btn-success w-100"
                    data-bs-dismiss="offcanvas"
                >
                    Ver resultados
                </button>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
        <script src="../../js/config.js"></script>
        <script src="../../js/api.js"></script>
        <script src="../../js/app.js?v=2.5"></script>
        <script src="../../js/map-controller.js?v=2.7"></script>

        <script>
            bootControlPage("mapa");

            async function resolveGoogleMapsKey() {
                window.API_CONFIG = window.API_CONFIG || {};
                const configuredKey = String(
                    window.API_CONFIG.GOOGLE_MAPS_API_KEY || "",
                ).trim();
                if (
                    configuredKey &&
                    !configuredKey.includes("YOUR_GOOGLE_MAPS_API_KEY")
                ) {
                    return configuredKey;
                }

                try {
                    const result = await api.get("/maps-config", {
                        cache: false,
                    });
                    const serverKey = String(
                        result?.data?.googleMapsApiKey || "",
                    ).trim();
                    if (serverKey) {
                        window.API_CONFIG.GOOGLE_MAPS_API_KEY = serverKey;
                    }
                    return serverKey;
                } catch (error) {
                    console.warn(
                        "No se pudo resolver Google Maps API key desde el servidor",
                        error,
                    );
                    return "";
                }
            }

            function loadGoogleMapsApi(key) {
                if (!key || key.includes("YOUR_GOOGLE_MAPS_API_KEY")) {
                    console.error("Google Maps API Key no configurada");
                    showToast(
                        "Google Maps API Key no configurada. Contacte al administrador.",
                        "danger",
                    );
                    return Promise.reject(
                        new Error("Google Maps API Key no configurada"),
                    );
                }

                // Reset auth failure flag
                window.__mapaGmAuthFailed = false;
                window.gm_authFailure = () => {
                    console.error("Google Maps rechazo la API key");
                    window.__mapaGmAuthFailed = true;
                };

                // The Dynamic Library Import (DLI) pattern queues importLibrary
                // calls automatically, so we can resolve immediately after
                // launching the loader.
                ((g) => {
                    var h,
                        a,
                        k,
                        p = "The Google Maps JavaScript API",
                        c = "google",
                        l = "importLibrary",
                        q = "__ib__",
                        m = document,
                        b = window;
                    b = b[c] || (b[c] = {});
                    var d = b.maps || (b.maps = {}),
                        r = new Set(),
                        e = new URLSearchParams(),
                        u = () =>
                            h ||
                            (h = new Promise(async (f, n) => {
                                await (a = m.createElement("script"));
                                e.set("libraries", [...r].join(","));
                                for (k in g)
                                    e.set(
                                        k.replace(
                                            /[A-Z]/g,
                                            (t) => "_" + t[0].toLowerCase(),
                                        ),
                                        g[k],
                                    );
                                e.set("callback", c + ".maps." + q);
                                a.src =
                                    `https://maps.${c}apis.com/maps/api/js?` +
                                    e;
                                d[q] = f;
                                a.onerror = () =>
                                    (h = n(Error(p + " could not load.")));
                                a.nonce =
                                    m.querySelector("script[nonce]")?.nonce ||
                                    "";
                                m.head.append(a);
                            }));
                    d[l]
                        ? console.warn(p + " only loads once. Ignoring:", g)
                        : (d[l] = (f, ...n) =>
                              r.add(f) && u().then(() => d[l](f, ...n)));
                })({
                    key: key,
                    v: "weekly",
                    language: "es",
                    region: "PE",
                });

                return Promise.resolve();
            }

            (async () => {
                try {
                    const key = await resolveGoogleMapsKey();
                    await loadGoogleMapsApi(key);

                    // Wait a short tick for the Google Maps script to initialize
                    // the DLI stubs, then init the map controller (which uses
                    // importLibrary to load maps/marker/places on demand).
                    await new Promise((r) => setTimeout(r, 100));

                    if (window.__mapaGmAuthFailed) {
                        throw new Error("Google Maps rechazo la API key");
                    }

                    if (window.mapController) {
                        await window.mapController.init();
                    }
                } catch (error) {
                    console.error("Error initializing map:", error);
                    showToast(
                        "Error inicializando Google Maps: " + error.message,
                        "danger",
                    );
                }
            })();
        </script>
    </body>
</html>
