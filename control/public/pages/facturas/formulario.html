<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <title>Factura - IO Group</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item"><a href="listar.html">Facturas</a></li>
                            <li class="breadcrumb-item active" id="pageTitle">Nueva Factura</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-receipt"></i> <span id="formTitle">Nueva Factura</span>
                    </div>
                    <div class="card-body">
                        <form id="dataForm">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Número de Factura *</label>
                                    <input type="text" class="form-control" id="numero_factura" required
                                        placeholder="F001-00000123">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">Monto (S/) *</label>
                                    <input type="number" step="0.01" class="form-control" id="monto_total" required
                                        placeholder="0.00">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">Tipo de Pago</label>
                                    <select class="form-select" id="metodo_pago">
                                        <option value="">Seleccionar...</option>
                                        <option value="transferencia">Transferencia</option>
                                        <option value="yape">Yape</option>
                                        <option value="plin">Plin</option>
                                        <option value="efectivo">Efectivo</option>
                                        <option value="deposito">Depósito</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i>
                                    Guardar</button>
                                <a href="listar.html" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.0"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('facturas');
        const id = getUrlParam('id');

        if (id) {
            document.getElementById('pageTitle').textContent = 'Editar Factura';
            document.getElementById('formTitle').textContent = 'Editar Factura';
            loadData();
        }

        async function loadData() {
            try {
                const result = await api.get(`/facturas/${id}`);
                if (result.success) {
                    const d = result.data;
                    document.getElementById('numero_factura').value = d.numero_factura || '';
                    document.getElementById('monto_total').value = d.monto_total || '';
                    document.getElementById('metodo_pago').value = d.metodo_pago || '';
                }
            } catch (err) {
                showToast('Error cargando datos', 'danger');
            }
        }

        document.getElementById('dataForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const data = {
                numero_factura: document.getElementById('numero_factura').value,
                monto_total: document.getElementById('monto_total').value,
                metodo_pago: document.getElementById('metodo_pago').value || null
            };

            try {
                const url = id ? `/facturas/${id}` : '/facturas';
                const method = id ? 'put' : 'post';
                const result = await api[method](url, data);

                if (result.success) {
                    showToast(id ? 'Factura actualizada' : 'Factura creada');
                    window.location.href = 'listar.html';
                } else {
                    showToast(result.message || 'Error guardando', 'danger');
                }
            } catch (err) {
                showToast('Error guardando', 'danger');
            }
        });
    </script>
</body>

</html>
