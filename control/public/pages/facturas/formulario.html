<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura - IO Group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
    <style>
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: #f8f9fa;
        }

        .upload-area.dragover {
            border-color: var(--primary-color);
            background: #e8f5e9;
        }
    </style>
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item"><a href="listar.html">Facturas</a></li>
                            <li class="breadcrumb-item active" id="pageTitle">Nueva Factura</li>
                        </ol>
                    </nav>
                </div>
            </nav>
            <div class="content-area">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-receipt"></i> <span id="formTitle">Nueva Factura</span>
                    </div>
                    <div class="card-body">
                        <form id="dataForm">
                            <div class="row g-3">
                                <!-- Servicio (obligatorio) -->
                                <div class="col-md-6">
                                    <label class="form-label">Servicio *</label>
                                    <select class="form-select" id="id_servicio" required>
                                        <option value="">Seleccione un servicio...</option>
                                    </select>
                                    <div id="servicioInfo" class="small text-muted mt-1"></div>
                                </div>

                                <!-- Número de Factura -->
                                <div class="col-md-6">
                                    <label class="form-label">Número de Factura *</label>
                                    <input type="text" class="form-control" id="numero_factura" required
                                        placeholder="F001-00000123">
                                </div>

                                <!-- Documento Escaneado -->
                                <div class="col-12">
                                    <label class="form-label">Documento Escaneado (PDF)</label>
                                    <div class="upload-area" id="uploadArea">
                                        <i class="bi bi-cloud-upload fs-1 text-muted"></i>
                                        <p class="mb-0 text-muted">Arrastra un PDF aquí o haz clic para seleccionar</p>
                                        <input type="file" id="archivo_pdf" accept=".pdf" style="display: none;">
                                    </div>
                                    <div id="filePreview" class="mt-2" style="display: none;">
                                        <span class="badge bg-success"><i class="bi bi-file-pdf"></i> <span
                                                id="fileName"></span></span>
                                        <button type="button" class="btn btn-sm btn-link text-danger"
                                            onclick="removeFile()">Quitar</button>
                                    </div>
                                    <div id="existingPdf" class="mt-2" style="display: none;">
                                        <a href="#" id="pdfLink" target="_blank" class="btn btn-outline-primary btn-sm">
                                            <i class="bi bi-file-pdf"></i> Ver PDF existente
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i>
                                    Guardar</button>
                                <a href="listar.html" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.0"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('facturas');
        const id = getUrlParam('id');
        const servicioParam = getUrlParam('servicio');
        let selectedFile = null;

        // Load servicios
        async function loadServicios() {
            try {
                const result = await api.get('/servicios?limit=500');
                if (result.success) {
                    const select = document.getElementById('id_servicio');
                    select.innerHTML = '<option value="">Seleccione un servicio...</option>' +
                        result.data.map(s => `<option value="${s.id_servicio}">${s.sede_nombre} - ${s.mes_servicio || ''} (${s.fecha_servicio || ''})</option>`).join('');

                    if (servicioParam) {
                        select.value = servicioParam;
                    }
                }
            } catch (err) {
                console.error('Error loading servicios:', err);
            }
        }

        loadServicios();

        if (id) {
            document.getElementById('pageTitle').textContent = 'Editar Factura';
            document.getElementById('formTitle').textContent = 'Editar Factura';
            loadData();
        }

        async function loadData() {
            try {
                const result = await api.get(`/facturas/${id}`);
                if (result.success) {
                    const d = result.data;
                    setTimeout(() => {
                        document.getElementById('id_servicio').value = d.id_servicio || '';
                    }, 500);
                    document.getElementById('numero_factura').value = d.numero_factura || '';
                    if (d.doc_escaneado) {
                        document.getElementById('existingPdf').style.display = 'block';
                        document.getElementById('pdfLink').href = d.doc_escaneado;
                    }
                }
            } catch (err) {
                showToast('Error cargando datos', 'danger');
            }
        }

        // File upload handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('archivo_pdf');

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (file.type !== 'application/pdf') {
                showToast('Solo se permiten archivos PDF', 'warning');
                return;
            }
            selectedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('filePreview').style.display = 'block';
            uploadArea.style.display = 'none';
        }

        function removeFile() {
            selectedFile = null;
            fileInput.value = '';
            document.getElementById('filePreview').style.display = 'none';
            uploadArea.style.display = 'block';
        }

        // Submit
        document.getElementById('dataForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = new FormData();
            formData.append('id_servicio', document.getElementById('id_servicio').value);
            formData.append('numero_factura', document.getElementById('numero_factura').value);
            if (selectedFile) {
                formData.append('archivo_pdf', selectedFile);
            }

            try {
                const url = id ? `/facturas/${id}` : '/facturas';
                const response = await fetch(API_BASE + url, {
                    method: id ? 'POST' : 'POST', // Use POST for FormData
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    showToast(id ? 'Factura actualizada' : 'Factura creada');
                    window.location.href = 'listar.html';
                } else {
                    showToast(result.message || 'Error guardando', 'danger');
                }
            } catch (err) {
                showToast('Error guardando', 'danger');
            }
        });
    </script>
</body>

</html>
