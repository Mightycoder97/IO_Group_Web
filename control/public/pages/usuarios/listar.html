<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <title>Usuarios - IO Control</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/global.css?v=2.4" rel="stylesheet">
</head>
<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Usuarios</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <a href="../alertas/index.html" class="btn btn-light alert-badge">
                        <i class="bi bi-bell"></i><span class="badge bg-danger" id="alertCount">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="bi bi-key"></i> Cambiar Contraseña</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <div class="table-container">
                    <div class="table-header">
                        <div>
                            <h5 class="table-title mb-0"><i class="bi bi-people-fill"></i> Usuarios del Sistema</h5>
                        </div>
                        <div class="d-flex gap-2 desktop-filters">
                            <input type="text" class="form-control" id="searchInput" placeholder="Buscar..."
                                style="width: 200px;">
                            <a href="formulario.html" class="btn btn-primary btn-new-desktop" id="btnNew"><i
                                    class="bi bi-plus"></i>
                                Nuevo Usuario</a>
                        </div>
                        <!-- Mobile Filters -->
                        <div class="mobile-filters">
                            <div class="filter-row">
                                <input type="text" class="form-control form-control-sm" id="searchInputMobile"
                                    placeholder="Buscar usuario...">
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Usuario</th>
                                    <th>Nombre</th>
                                    <th class="hide-on-mobile">Rol</th>
                                    <th class="hide-on-mobile">Módulos</th>
                                    <th class="hide-on-mobile">Último Acceso</th>
                                    <th>Estado</th>
                                    <th width="100">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="7" class="text-center py-4">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- FAB for mobile -->
    <a href="formulario.html" class="fab" id="fabNew" aria-label="Nuevo Usuario">
        <i class="bi bi-plus"></i>
    </a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.4"></script>
    <script>
        bootControlPage('usuarios');
        const user = getUser();
        if (user?.rol !== 'admin') {
            window.location.href = '../dashboard.html';
        }
        let allData = [];
        async function loadData() {
            try {
                const result = await api.get('/usuarios');
                if (result.success) {
                    allData = result.data;
                    renderTable(allData);
                }
            } catch (err) {
                showToast('Error cargando usuarios', 'danger');
            }
        }
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No hay usuarios</td></tr>';
                return;
            }
            const rolBadge = {
                'admin': 'danger',
                'editor': 'primary',
                'viewer': 'secondary'
            };
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td><strong>@${item.username}</strong></td>
                    <td>${item.nombre_completo}</td>
                    <td><span class="badge bg-${rolBadge[item.rol] || 'secondary'}">${item.rol}</span></td>
                    <td><span class="badge bg-info">${item.modulos_permitidos || 0} módulos</span></td>
                    <td>${item.ultimo_acceso ? formatDate(item.ultimo_acceso) : '<span class="text-muted">Nunca</span>'}</td>
                    <td>${item.activo ? '<span class="badge bg-success">Activo</span>' : '<span class="badge bg-secondary">Inactivo</span>'}</td>
                    <td>
                        <a href="formulario.html?id=${item.id_usuario}" class="btn btn-sm btn-outline-primary btn-action"><i class="bi bi-pencil"></i></a>
                        ${item.id_usuario != user.id ? `<button class="btn btn-sm btn-outline-danger btn-action" onclick="deleteItem(${item.id_usuario})"><i class="bi bi-trash"></i></button>` : ''}
                    </td>
                </tr>
            `).join('');
        }
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('es-PE') + ' ' + date.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
        }
        document.getElementById('searchInput').addEventListener('input', function (e) {
            const term = e.target.value.toLowerCase();
            const filtered = allData.filter(item =>
                item.username?.toLowerCase().includes(term) ||
                item.nombre_completo?.toLowerCase().includes(term) ||
                item.email?.toLowerCase().includes(term)
            );
            renderTable(filtered);
        });
        async function deleteItem(id) {
            if (!confirm('¿Desactivar este usuario?')) return;
            try {
                const result = await api.delete(`/usuarios/${id}`);
                if (result.success) {
                    showToast('Usuario desactivado');
                    loadData();
                } else {
                    showToast(result.message, 'danger');
                }
            } catch (err) {
                showToast('Error desactivando usuario', 'danger');
            }
        }
        loadData();
    </script>
</body>
</html>
