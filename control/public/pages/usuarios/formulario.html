<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <title>Usuario - IO Control</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/global.css?v=2.2" rel="stylesheet">
    <style>
        .permisos-table {
            font-size: 0.9rem;
        }
        .permisos-table th {
            background: #f8f9fa;
            font-weight: 600;
        }
        .grupo-header {
            background: #e9ecef;
            font-weight: 600;
            color: #495057;
        }
        .check-cell {
            text-align: center;
            width: 80px;
        }
        .form-check-input {
            width: 1.2rem;
            height: 1.2rem;
        }
        .preset-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item"><a href="listar.html">Usuarios</a></li>
                            <li class="breadcrumb-item active" id="pageTitle">Nuevo Usuario</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <a href="../alertas/index.html" class="btn btn-light alert-badge">
                        <i class="bi bi-bell"></i><span class="badge bg-danger" id="alertCount">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="bi bi-key"></i> Cambiar Contraseña</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <div class="row">
                    <!-- Datos del Usuario -->
                    <div class="col-lg-5">
                        <div class="card mb-4">
                            <div class="card-header">
                                <i class="bi bi-person"></i> Datos del Usuario
                            </div>
                            <div class="card-body">
                                <form id="form">
                                    <div class="mb-3">
                                        <label class="form-label">Nombre de Usuario <span
                                                class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text">@</span>
                                            <input type="text" class="form-control" id="username" required
                                                pattern="[a-zA-Z0-9_]+" title="Solo letras, números y guión bajo">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Nombre Completo <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="nombre_completo" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Contraseña <span class="text-danger"
                                                id="passRequired">*</span></label>
                                        <input type="password" class="form-control" id="password" minlength="8">
                                        <small class="text-muted" id="passHelp">Mínimo 8 caracteres, con mayúscula, número y carácter especial</small>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Rol</label>
                                        <select class="form-select" id="rol">
                                            <option value="viewer">Viewer (Solo ver)</option>
                                            <option value="editor">Editor (Ver y editar)</option>
                                            <option value="admin">Admin (Acceso total)</option>
                                        </select>
                                        <small class="text-muted">Los admin tienen acceso a todos los módulos
                                            automáticamente</small>
                                    </div>
                                    <div class="mb-3 form-check" id="activoCheck" style="display: none;">
                                        <input type="checkbox" class="form-check-input" id="activo" checked>
                                        <label class="form-check-label" for="activo">Usuario activo</label>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-check-lg"></i> Guardar
                                        </button>
                                        <a href="listar.html" class="btn btn-outline-secondary">Cancelar</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <!-- Permisos -->
                    <div class="col-lg-7">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-shield-lock"></i> Permisos por Módulo</span>
                                <span class="badge bg-primary" id="permisosCount">0 módulos</span>
                            </div>
                            <div class="card-body">
                                <div class="preset-buttons">
                                    <button type="button" class="btn btn-sm btn-outline-success"
                                        onclick="setPreset('vendedor')">
                                        <i class="bi bi-person-badge"></i> Preset: Vendedor
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-primary"
                                        onclick="setPreset('operador')">
                                        <i class="bi bi-gear"></i> Preset: Operador
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary"
                                        onclick="setPreset('ninguno')">
                                        <i class="bi bi-x-circle"></i> Quitar todos
                                    </button>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-bordered permisos-table" id="permisosTable">
                                        <thead>
                                            <tr>
                                                <th>Módulo</th>
                                                <th class="check-cell">Ver</th>
                                                <th class="check-cell">Editar</th>
                                            </tr>
                                        </thead>
                                        <tbody id="permisosBody">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.3"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('usuarios');
        // Only admin can access
        const currentUser = getUser();
        if (currentUser?.rol !== 'admin') {
            window.location.href = '../dashboard.html';
        }
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        let modulos = [];
        let currentData = null;
        // Load on start
        loadModulos();
        async function loadModulos() {
            try {
                const result = await api.get('/usuarios?action=modulos');
                if (result.success) {
                    modulos = result.data;
                    renderPermisosTable();
                    if (id) loadUser();
                }
            } catch (err) {
                showToast('Error cargando módulos', 'danger');
            }
        }
        function renderPermisosTable() {
            const tbody = document.getElementById('permisosBody');
            let currentGrupo = '';
            let html = '';
            modulos.forEach(m => {
                if (m.grupo !== currentGrupo) {
                    currentGrupo = m.grupo;
                    html += `<tr class="grupo-header"><td colspan="3">${currentGrupo}</td></tr>`;
                }
                html += `
                    <tr>
                        <td>${m.nombre}</td>
                        <td class="check-cell">
                            <input type="checkbox" class="form-check-input perm-ver" data-modulo="${m.id}" onchange="updateCount()">
                        </td>
                        <td class="check-cell">
                            <input type="checkbox" class="form-check-input perm-editar" data-modulo="${m.id}" onchange="updateCount()">
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }
        async function loadUser() {
            try {
                const result = await api.get(`/usuarios/${id}`);
                if (result.success) {
                    currentData = result.data;
                    fillForm(result.data);
                    document.getElementById('pageTitle').textContent = result.data.username;
                    document.getElementById('activoCheck').style.display = 'block';
                    document.getElementById('passRequired').style.display = 'none';
                    document.getElementById('passHelp').textContent = 'Dejar vacío para mantener contraseña actual';
                    document.getElementById('password').removeAttribute('required');
                }
            } catch (err) {
                showToast('Error cargando usuario', 'danger');
            }
        }
        function fillForm(data) {
            document.getElementById('username').value = data.username;
            document.getElementById('username').readOnly = true;
            document.getElementById('nombre_completo').value = data.nombre_completo;
            document.getElementById('email').value = data.email || '';
            document.getElementById('rol').value = data.rol;
            document.getElementById('activo').checked = data.activo;
            // Fill permissions
            if (data.permisos) {
                Object.entries(data.permisos).forEach(([modulo, perm]) => {
                    const verCheck = document.querySelector(`.perm-ver[data-modulo="${modulo}"]`);
                    const editarCheck = document.querySelector(`.perm-editar[data-modulo="${modulo}"]`);
                    if (verCheck) verCheck.checked = perm.ver;
                    if (editarCheck) editarCheck.checked = perm.editar;
                });
            }
            updateCount();
        }
        function setPreset(tipo) {
            // Clear all
            document.querySelectorAll('.perm-ver, .perm-editar').forEach(cb => cb.checked = false);
            if (tipo === 'vendedor') {
                // Solo prospectos
                const verProspectos = document.querySelector('.perm-ver[data-modulo="prospectos"]');
                const editarProspectos = document.querySelector('.perm-editar[data-modulo="prospectos"]');
                if (verProspectos) verProspectos.checked = true;
                if (editarProspectos) editarProspectos.checked = true;
            } else if (tipo === 'operador') {
                // Operaciones + recursos
                ['clientes', 'empresas', 'sedes', 'servicios', 'rutas', 'manifiestos', 'guias', 'vehiculos', 'empleados', 'plantas'].forEach(m => {
                    const ver = document.querySelector(`.perm-ver[data-modulo="${m}"]`);
                    const editar = document.querySelector(`.perm-editar[data-modulo="${m}"]`);
                    if (ver) ver.checked = true;
                    if (editar) editar.checked = true;
                });
            }
            updateCount();
        }
        function updateCount() {
            const count = document.querySelectorAll('.perm-ver:checked').length;
            document.getElementById('permisosCount').textContent = count + ' módulos';
        }
        function getPermissions() {
            const permisos = {};
            document.querySelectorAll('.perm-ver').forEach(cb => {
                const modulo = cb.dataset.modulo;
                const ver = cb.checked;
                const editar = document.querySelector(`.perm-editar[data-modulo="${modulo}"]`).checked;
                if (ver || editar) {
                    permisos[modulo] = { ver, editar };
                }
            });
            return permisos;
        }
        // Form submit
        document.getElementById('form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const data = {
                username: document.getElementById('username').value.trim(),
                nombre_completo: document.getElementById('nombre_completo').value.trim(),
                email: document.getElementById('email').value.trim(),
                rol: document.getElementById('rol').value,
                permisos: getPermissions()
            };
            // Password
            const password = document.getElementById('password').value;
            if (password) {
                data.password = password;
            } else if (!id) {
                showToast('La contraseña es requerida', 'danger');
                return;
            }
            // Activo
            if (id) {
                data.activo = document.getElementById('activo').checked;
            }
            try {
                let result;
                if (id) {
                    result = await api.put(`/usuarios/${id}`, data);
                } else {
                    result = await api.post('/usuarios', data);
                }
                if (result.success) {
                    showToast(result.message);
                    setTimeout(() => window.location.href = 'listar.html', 1000);
                } else {
                    showToast(result.message, 'danger');
                }
            } catch (err) {
                showToast('Error guardando usuario', 'danger');
            }
        });
        // Auto-fill all permissions when admin is selected
        document.getElementById('rol').addEventListener('change', function () {
            if (this.value === 'admin') {
                document.querySelectorAll('.perm-ver, .perm-editar').forEach(cb => cb.checked = true);
                updateCount();
            }
        });
    </script>
</body>
</html>
