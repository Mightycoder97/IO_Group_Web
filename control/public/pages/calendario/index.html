<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Calendario de Recojo - IO Group</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
    <style>
        .calendar-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .calendar-nav .btn {
            padding: 6px 12px;
        }

        .month-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0;
            text-transform: capitalize;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day-header {
            text-align: center;
            font-weight: 600;
            padding: 10px 5px;
            color: #666;
            font-size: 0.85rem;
        }

        .calendar-day {
            min-height: 100px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 8px;
            background: #fafafa;
            transition: all 0.2s;
        }

        .calendar-day:hover {
            background: #f0f0f0;
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
        }

        .calendar-day.today {
            border-color: #2e7d32;
            background: #e8f5e9;
        }

        .day-number {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .day-routes {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .route-badge {
            font-size: 0.7rem;
            padding: 3px 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .route-badge.programada {
            background: #e3f2fd;
            color: #1565c0;
        }

        .route-badge.en_curso {
            background: #fff3e0;
            color: #ef6c00;
        }

        .route-badge.completada {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .route-count {
            font-size: 0.65rem;
            background: rgba(0, 0, 0, 0.1);
            padding: 1px 4px;
            border-radius: 3px;
        }

        .distrito-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .distrito-chip {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid #ddd;
            background: white;
            transition: all 0.2s;
        }

        .distrito-chip:hover {
            background: #f5f5f5;
        }

        .distrito-chip.active {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        .resumen-card {
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .resumen-stat {
            text-align: center;
        }

        .resumen-stat h3 {
            font-size: 2rem;
            margin: 0;
        }

        .resumen-stat small {
            opacity: 0.85;
        }

        @media (max-width: 768px) {
            .calendar-day {
                min-height: 60px;
                padding: 4px;
            }

            .route-badge {
                font-size: 0.6rem;
                padding: 2px 4px;
            }

            .calendar-day-header {
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Calendario de Recojo</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <a href="../alertas/index.html" class="btn btn-light alert-badge">
                        <i class="bi bi-bell"></i><span class="badge bg-danger" id="alertCount">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <!-- Resumen -->
                <div class="resumen-card">
                    <div class="row">
                        <div class="col-4 resumen-stat">
                            <h3 id="totalRutas">0</h3>
                            <small>Rutas del Mes</small>
                        </div>
                        <div class="col-4 resumen-stat">
                            <h3 id="rutasCompletadas">0</h3>
                            <small>Completadas</small>
                        </div>
                        <div class="col-4 resumen-stat">
                            <h3 id="rutasPendientes">0</h3>
                            <small>Pendientes</small>
                        </div>
                    </div>
                </div>

                <!-- Filtros por Distrito -->
                <div class="distrito-filter" id="distritoFilter">
                    <span class="distrito-chip active" data-distrito="todos">Todos</span>
                </div>

                <!-- Calendario -->
                <div class="calendar-container">
                    <div class="calendar-header">
                        <div class="calendar-nav">
                            <button class="btn btn-outline-secondary" onclick="prevMonth()">
                                <i class="bi bi-chevron-left"></i>
                            </button>
                            <h4 class="month-title" id="monthTitle">Enero 2026</h4>
                            <button class="btn btn-outline-secondary" onclick="nextMonth()">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                        </div>
                        <div>
                            <a href="../rutas/formulario.html" class="btn btn-primary">
                                <i class="bi bi-plus"></i> Nueva Ruta
                            </a>
                        </div>
                    </div>
                    <div class="calendar-grid" id="calendarGrid">
                        <!-- Calendar days will be generated here -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.0"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('rutas');

        let currentDate = new Date();
        let allRutas = [];
        let allDistritos = new Set();
        let selectedDistrito = 'todos';

        const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
            'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        // Navigation
        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
            loadRutas();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
            loadRutas();
        }

        // Load rutas for current month
        async function loadRutas() {
            try {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth() + 1;
                const result = await api.get(`/rutas?mes=${month}&anio=${year}`);
                if (result.success) {
                    allRutas = result.data;
                    updateStats();
                    extractDistritos();
                    renderCalendar();
                }
            } catch (err) {
                console.error('Error loading rutas:', err);
            }
        }

        function updateStats() {
            const total = allRutas.length;
            const completadas = allRutas.filter(r => r.estado === 'completada').length;
            const pendientes = allRutas.filter(r => r.estado === 'programada' || r.estado === 'en_curso').length;

            document.getElementById('totalRutas').textContent = total;
            document.getElementById('rutasCompletadas').textContent = completadas;
            document.getElementById('rutasPendientes').textContent = pendientes;
        }

        function extractDistritos() {
            allDistritos.clear();
            allRutas.forEach(r => {
                if (r.distrito) allDistritos.add(r.distrito);
            });
            renderDistritoFilter();
        }

        function renderDistritoFilter() {
            const container = document.getElementById('distritoFilter');
            let html = `<span class="distrito-chip ${selectedDistrito === 'todos' ? 'active' : ''}" 
                         data-distrito="todos" onclick="filterDistrito('todos')">Todos</span>`;
            allDistritos.forEach(d => {
                html += `<span class="distrito-chip ${selectedDistrito === d ? 'active' : ''}" 
                          data-distrito="${d}" onclick="filterDistrito('${d}')">${d}</span>`;
            });
            container.innerHTML = html;
        }

        function filterDistrito(distrito) {
            selectedDistrito = distrito;
            renderDistritoFilter();
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('monthTitle').textContent = `${meses[month]} ${year}`;

            const grid = document.getElementById('calendarGrid');
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            let html = '';

            // Day headers
            diasSemana.forEach(d => {
                html += `<div class="calendar-day-header">${d}</div>`;
            });

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="calendar-day empty"></div>';
            }

            // Days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;

                // Filter rutas for this day
                let dayRutas = allRutas.filter(r => r.fecha === dateStr);
                if (selectedDistrito !== 'todos') {
                    dayRutas = dayRutas.filter(r => r.distrito === selectedDistrito);
                }

                html += `
                    <div class="calendar-day ${isToday ? 'today' : ''}">
                        <div class="day-number">${day}</div>
                        <div class="day-routes">
                            ${dayRutas.slice(0, 3).map(r => `
                                <a href="../rutas/formulario.html?id=${r.id_ruta}" class="route-badge ${r.estado}">
                                    <i class="bi bi-truck"></i>
                                    ${r.vehiculo_placa || 'Ruta'}
                                    ${r.sedes_count ? `<span class="route-count">${r.sedes_count}</span>` : ''}
                                </a>
                            `).join('')}
                            ${dayRutas.length > 3 ? `<small class="text-muted">+${dayRutas.length - 3} más</small>` : ''}
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        // Initialize
        renderCalendar();
        loadRutas();
    </script>
</body>

</html>
