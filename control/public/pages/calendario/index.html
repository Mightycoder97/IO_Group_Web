<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Calendario de Recojo - IO Group</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
    <style>
        .calendar-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .calendar-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .month-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0;
            text-transform: capitalize;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day-header {
            text-align: center;
            font-weight: 600;
            padding: 10px 5px;
            color: #666;
            font-size: 0.85rem;
        }

        .calendar-day {
            min-height: 90px;
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 8px;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calendar-day:hover {
            border-color: #2e7d32;
            background: #f5f5f5;
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .calendar-day.today {
            border-color: #2e7d32;
            background: #e8f5e9;
        }

        .day-number {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-name {
            font-size: 0.7rem;
            color: #666;
        }

        .distrito-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .distrito-chip {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
            background: #e3f2fd;
            color: #1565c0;
        }

        .distrito-chip.selected {
            background: #1565c0;
            color: white;
        }

        /* Sidebar de distritos */
        .distritos-panel {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .distrito-item {
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ddd;
        }

        .distrito-item:hover {
            background: #f5f5f5;
        }

        .distrito-item.active {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        .distrito-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .instructions {
            background: #fff3cd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .calendar-day {
                min-height: 60px;
                padding: 4px;
            }

            .day-number {
                font-size: 0.75rem;
            }

            .distrito-chip {
                font-size: 0.55rem;
                padding: 1px 4px;
            }
        }
    </style>
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Calendario de Recojo</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <div class="row">
                    <!-- Panel de Distritos -->
                    <div class="col-lg-3 mb-3">
                        <div class="distritos-panel">
                            <h6><i class="bi bi-geo-alt"></i> Distritos</h6>
                            <div class="instructions">
                                <i class="bi bi-info-circle"></i>
                                Selecciona un distrito y luego haz clic en los días para asignarlo.
                            </div>
                            <div id="distritosList">
                                <div class="text-muted small">Cargando distritos...</div>
                            </div>
                            <hr>
                            <button class="btn btn-success w-100 mb-2" onclick="saveCalendario()">
                                <i class="bi bi-check"></i> Guardar Calendario
                            </button>
                            <button class="btn btn-outline-secondary w-100" onclick="copyFromPreviousMonth()">
                                <i class="bi bi-files"></i> Copiar Mes Anterior
                            </button>
                        </div>
                    </div>

                    <!-- Calendario -->
                    <div class="col-lg-9">
                        <div class="calendar-container">
                            <div class="calendar-header">
                                <div class="calendar-nav">
                                    <button class="btn btn-outline-secondary" onclick="prevMonth()">
                                        <i class="bi bi-chevron-left"></i>
                                    </button>
                                    <h4 class="month-title" id="monthTitle">Enero 2026</h4>
                                    <button class="btn btn-outline-secondary" onclick="nextMonth()">
                                        <i class="bi bi-chevron-right"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="calendar-grid" id="calendarGrid">
                                <!-- Calendar days will be generated here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.0"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('rutas');

        let currentDate = new Date();
        let selectedDistrito = null;
        let calendarioData = {}; // { "YYYY-MM-DD": ["distrito1", "distrito2"], ... }
        let allDistritos = [];

        const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
            'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        const distritoColors = {
            'Miraflores': '#e57373', 'San Isidro': '#64b5f6', 'Surco': '#81c784',
            'La Molina': '#ffb74d', 'San Borja': '#ba68c8', 'Lince': '#4dd0e1',
            'Jesús María': '#f06292', 'Magdalena': '#aed581', 'Pueblo Libre': '#ff8a65',
            'San Miguel': '#90caf9', 'Breña': '#ce93d8', 'Lima': '#ffcc80',
            'Chorrillos': '#80cbc4', 'Barranco': '#bcaaa4', 'Surquillo': '#ffe082'
        };

        // Navigation
        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            loadCalendario();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            loadCalendario();
        }

        // Load distritos from sedes
        async function loadDistritos() {
            try {
                const result = await api.get('/sedes');
                if (result.success) {
                    const distritos = new Set();
                    result.data.forEach(s => {
                        if (s.distrito) distritos.add(s.distrito);
                    });
                    allDistritos = Array.from(distritos).sort();
                    renderDistritosList();
                }
            } catch (err) {
                console.error('Error loading distritos:', err);
            }
        }

        function renderDistritosList() {
            const container = document.getElementById('distritosList');
            if (allDistritos.length === 0) {
                container.innerHTML = '<div class="text-muted small">No hay distritos configurados</div>';
                return;
            }

            container.innerHTML = allDistritos.map(d => `
                <div class="distrito-item ${selectedDistrito === d ? 'active' : ''}" 
                     onclick="selectDistrito('${d}')">
                    <span>
                        <span class="distrito-color" style="background: ${distritoColors[d] || '#999'}"></span>
                        ${d}
                    </span>
                    <span class="badge bg-secondary" id="count-${d.replace(/\s/g, '-')}">0</span>
                </div>
            `).join('');

            updateDistritoCounts();
        }

        function selectDistrito(distrito) {
            selectedDistrito = selectedDistrito === distrito ? null : distrito;
            renderDistritosList();
        }

        function updateDistritoCounts() {
            const counts = {};
            Object.values(calendarioData).forEach(distritos => {
                distritos.forEach(d => {
                    counts[d] = (counts[d] || 0) + 1;
                });
            });

            allDistritos.forEach(d => {
                const el = document.getElementById('count-' + d.replace(/\s/g, '-'));
                if (el) el.textContent = counts[d] || 0;
            });
        }

        // Load calendario for current month
        async function loadCalendario() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;

            try {
                const result = await api.get(`/calendario?mes=${month}&anio=${year}`);
                if (result.success && result.data) {
                    calendarioData = result.data.dias || {};
                } else {
                    calendarioData = {};
                }
            } catch (err) {
                calendarioData = {};
            }

            renderCalendar();
            updateDistritoCounts();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('monthTitle').textContent = `${meses[month]} ${year}`;

            const grid = document.getElementById('calendarGrid');
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            let html = '';

            // Day headers
            diasSemana.forEach(d => {
                html += `<div class="calendar-day-header">${d}</div>`;
            });

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="calendar-day empty"></div>';
            }

            // Days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
                const dayDistritos = calendarioData[dateStr] || [];
                const dayOfWeek = new Date(year, month, day).getDay();

                html += `
                    <div class="calendar-day ${isToday ? 'today' : ''}" onclick="toggleDistrito('${dateStr}')">
                        <div class="day-number">
                            <span>${day}</span>
                            <span class="day-name">${diasSemana[dayOfWeek]}</span>
                        </div>
                        <div class="distrito-chips">
                            ${dayDistritos.map(d => `
                                <span class="distrito-chip" style="background: ${distritoColors[d] || '#e3f2fd'}; color: ${distritoColors[d] ? 'white' : '#1565c0'}">
                                    ${d.substring(0, 3)}
                                </span>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        function toggleDistrito(dateStr) {
            if (!selectedDistrito) {
                showToast('Selecciona un distrito primero', 'warning');
                return;
            }

            if (!calendarioData[dateStr]) {
                calendarioData[dateStr] = [];
            }

            const idx = calendarioData[dateStr].indexOf(selectedDistrito);
            if (idx >= 0) {
                calendarioData[dateStr].splice(idx, 1);
                if (calendarioData[dateStr].length === 0) {
                    delete calendarioData[dateStr];
                }
            } else {
                calendarioData[dateStr].push(selectedDistrito);
            }

            renderCalendar();
            updateDistritoCounts();
        }

        async function saveCalendario() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;

            try {
                const result = await api.post('/calendario', {
                    mes: month,
                    anio: year,
                    dias: calendarioData
                });

                if (result.success) {
                    showToast('Calendario guardado correctamente');
                } else {
                    showToast(result.message || 'Error al guardar', 'danger');
                }
            } catch (err) {
                showToast('Error al guardar', 'danger');
            }
        }

        async function copyFromPreviousMonth() {
            const prevDate = new Date(currentDate);
            prevDate.setMonth(prevDate.getMonth() - 1);
            const prevYear = prevDate.getFullYear();
            const prevMonth = prevDate.getMonth() + 1;

            try {
                const result = await api.get(`/calendario?mes=${prevMonth}&anio=${prevYear}`);
                if (result.success && result.data && result.data.dias) {
                    // Copy structure but adjust dates to current month
                    const prevDias = result.data.dias;
                    const newDias = {};

                    const year = currentDate.getFullYear();
                    const month = currentDate.getMonth();
                    const daysInMonth = new Date(year, month + 1, 0).getDate();

                    // Copy by day of month (if day exists in both months)
                    Object.keys(prevDias).forEach(dateStr => {
                        const prevDay = parseInt(dateStr.split('-')[2]);
                        if (prevDay <= daysInMonth) {
                            const newDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(prevDay).padStart(2, '0')}`;
                            newDias[newDateStr] = [...prevDias[dateStr]];
                        }
                    });

                    calendarioData = newDias;
                    renderCalendar();
                    updateDistritoCounts();
                    showToast('Calendario copiado del mes anterior');
                } else {
                    showToast('No hay calendario en el mes anterior', 'warning');
                }
            } catch (err) {
                showToast('Error al copiar', 'danger');
            }
        }

        // Initialize
        loadDistritos();
        loadCalendario();
    </script>
</body>

</html>
