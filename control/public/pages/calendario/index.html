<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Calendario de Recojo - IO Group</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/global.css" rel="stylesheet">
    <style>
        .calendar-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .calendar-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .month-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0;
            text-transform: capitalize;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day-header {
            text-align: center;
            font-weight: 600;
            padding: 10px 5px;
            color: #666;
            font-size: 0.85rem;
        }

        .calendar-day {
            min-height: 120px;
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 8px;
            background: #fafafa;
            cursor: pointer;
        }

        .calendar-day:hover {
            border-color: #2e7d32;
            background: #f5f5f5;
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .calendar-day.today {
            border-color: #2e7d32;
            background: #e8f5e9;
        }

        .day-number {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-name {
            font-size: 0.7rem;
            color: #666;
        }

        .distrito-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .distrito-chip {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 10px;
            background: #f0f0f0;
            color: #333;
            text-transform: capitalize;
        }

        .distrito-chip.selected {
            background: #1565c0;
            color: white;
        }

        /* Sidebar de distritos */
        .distritos-panel {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .distrito-item {
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ddd;
        }

        .distrito-item:hover {
            background: #f5f5f5;
        }

        .distrito-item.active {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        .distrito-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .instructions {
            background: #fff3cd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .calendar-day {
                min-height: 60px;
                padding: 4px;
            }

            .day-number {
                font-size: 0.75rem;
            }

            .distrito-chip {
                font-size: 0.55rem;
                padding: 1px 4px;
            }
        }

        @page {
            size: landscape;
            margin: 10mm;
        }

        @media print {

            .sidebar,
            .top-nav,
            .distritos-panel,
            .btn,
            .user-menu,
            .breadcrumb-container {
                display: none !important;
            }

            .main-content {
                margin: 0 !important;
                padding: 0 !important;
            }

            .content-area {
                padding: 0 !important;
            }

            .col-lg-9 {
                width: 100% !important;
                flex: 0 0 100% !important;
                max-width: 100% !important;
            }

            .calendar-container {
                box-shadow: none !important;
            }

            .calendar-day {
                border: 1px solid #ccc !important;
            }

            .distrito-chip {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Calendario de Recojo</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" data-bs-toggle="modal"
                                    data-bs-target="#changePasswordModal"><i class="bi bi-key"></i> Cambiar
                                    Contraseña</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <div class="row">
                    <!-- Panel de Distritos -->
                    <div class="col-lg-3 mb-3">
                        <div class="distritos-panel">
                            <h6><i class="bi bi-geo-alt"></i> Opciones / Distritos</h6>
                            <div class="input-group input-group-sm mb-2">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="distritoSearch" placeholder="Buscar..."
                                    oninput="filterDistritos()">
                            </div>
                            <div class="input-group input-group-sm mb-2">
                                <input type="text" class="form-control" id="customTagInput"
                                    placeholder="Añadir nueva opción especial...">
                                <button class="btn btn-outline-secondary" onclick="addCustomTag()"><i
                                        class="bi bi-plus-lg"></i></button>
                            </div>
                            <div class="instructions">
                                <i class="bi bi-info-circle"></i>
                                Selecciona un distrito y luego haz clic en los días para asignarlo.
                            </div>
                            <div id="distritosList">
                                <div class="text-muted small">Cargando distritos...</div>
                            </div>
                            <hr>
                            <button class="btn btn-success w-100 mb-2" onclick="saveCalendario()">
                                <i class="bi bi-check"></i> Guardar Calendario
                            </button>
                            <button class="btn btn-outline-secondary w-100" onclick="copyFromPreviousMonth()">
                                <i class="bi bi-files"></i> Copiar Mes Anterior
                            </button>
                        </div>
                    </div>

                    <!-- Calendario -->
                    <div class="col-lg-9">
                        <div class="calendar-container">
                            <div class="calendar-header">
                                <div class="calendar-nav">
                                    <button class="btn btn-outline-secondary" onclick="prevMonth()">
                                        <i class="bi bi-chevron-left"></i>
                                    </button>
                                    <h4 class="month-title" id="monthTitle">Enero 2026</h4>
                                    <button class="btn btn-outline-secondary" onclick="nextMonth()">
                                        <i class="bi bi-chevron-right"></i>
                                    </button>
                                    <button class="btn btn-outline-primary ms-3" onclick="window.print()"
                                        title="Imprimir">
                                        <i class="bi bi-printer"></i> Imprimir
                                    </button>
                                </div>
                            </div>
                            <div class="calendar-grid" id="calendarGrid">
                                <!-- Calendar days will be generated here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.2"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('rutas');

        let currentDate = new Date();
        let selectedDistrito = null;
        let calendarioData = {}; // { "YYYY-MM-DD": ["distrito1", "distrito2"], ... }
        let allDistritos = [];
        let specialTags = ['QUINCENALES', 'GAMARRA', 'ONCOLOGIA', 'CHORRISALUD', 'ESCUELA EJERCITO', 'SEMANALES', 'MAPEVAS'];

        const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
            'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        const distritoColorsFixed = {
            'QUINCENALES': '#e64a19' // Dark orange
        };

        // Generate consistent color based on string hash
        function getDistritoColor(distrito) {
            // All standard districts get light grey
            if (!specialTags.includes(distrito)) return '#f0f0f0';

            if (distritoColorsFixed[distrito]) return distritoColorsFixed[distrito];

            // Hash the string to get consistent color for custom tags
            let hash = 0;
            for (let i = 0; i < distrito.length; i++) {
                hash = distrito.charCodeAt(i) + ((hash << 5) - hash);
            }

            // Generate HSL color with good saturation and DARK lightness
            const h = Math.abs(hash) % 360;
            const s = 60 + (Math.abs(hash >> 8) % 20); // 60-80% saturation
            const l = 20 + (Math.abs(hash >> 16) % 15); // 20-35% lightness (dark backgrounds)

            return `hsl(${h}, ${s}%, ${l}%)`;
        }

        // Keep distritoColors as getter for backwards compatibility
        const distritoColors = new Proxy({}, {
            get: (target, prop) => getDistritoColor(prop)
        });

        // Navigation
        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            loadCalendario();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            loadCalendario();
        }

        async function loadDistritos() {
            try {
                const result = await api.get('/calendario?action=distritos');
                if (result.success) {
                    const dbDistritos = result.data.map(d => d.distrito);
                    allDistritos = [...new Set([...specialTags, ...dbDistritos])];
                    renderDistritosList();
                }
            } catch (err) {
                console.error('Error loading distritos:', err);
            }
        }

        function renderDistritosList() {
            const container = document.getElementById('distritosList');
            const searchInput = document.getElementById('distritoSearch');
            const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';

            if (searchTerm.length < 2) {
                const fragment = document.createDocumentFragment();
                specialTags.forEach(d => {
                    const div = document.createElement('div');
                    const safeId = d.replace(/[^a-zA-Z0-9]/g, '-');
                    div.className = `distrito-item ${selectedDistrito === d ? 'active' : ''}`;
                    div.onclick = () => selectDistrito(d);
                    div.innerHTML = `
                        <span>
                            <span class="distrito-color" style="background: ${distritoColors[d] || '#999'}"></span>
                            ${d}
                        </span>
                        <span class="badge bg-secondary" id="count-${safeId}">0</span>
                    `;
                    fragment.appendChild(div);
                });
                const hr = document.createElement('hr');
                hr.className = 'my-2';
                const msg = document.createElement('div');
                msg.className = 'text-muted small text-center';
                msg.innerHTML = '<i class="bi bi-search"></i> Escribe 2 letras para buscar todos los distritos...';

                container.innerHTML = '';
                container.appendChild(fragment);
                container.appendChild(hr);
                container.appendChild(msg);
                updateDistritoCounts();
                return;
            }

            if (allDistritos.length === 0) {
                container.innerHTML = '<div class="text-muted small">No hay distritos configurados</div>';
                return;
            }

            const filteredDistritos = allDistritos.filter(d =>
                d.toLowerCase().includes(searchTerm)
            );

            if (filteredDistritos.length === 0) {
                container.innerHTML = '<div class="text-muted small">No se encontraron resultados en el sistema</div>';
                return;
            }

            // Limitar a máximo 15 resultados
            const limitedDistritos = filteredDistritos.slice(0, 15);

            // Use DocumentFragment for better performance
            const fragment = document.createDocumentFragment();
            limitedDistritos.forEach(d => {
                const div = document.createElement('div');
                const safeId = d.replace(/[^a-zA-Z0-9]/g, '-');
                div.className = `distrito-item ${selectedDistrito === d ? 'active' : ''}`;
                div.onclick = () => selectDistrito(d);
                div.innerHTML = `
                    <span>
                        <span class="distrito-color" style="background: ${distritoColors[d] || '#999'}"></span>
                        ${d}
                    </span>
                    <span class="badge bg-secondary" id="count-${safeId}">0</span>
                `;
                fragment.appendChild(div);
            });

            container.innerHTML = '';
            container.appendChild(fragment);

            // Mostrar cuántos resultados hay si hay más de 15
            if (filteredDistritos.length > 15) {
                const moreDiv = document.createElement('div');
                moreDiv.className = 'text-muted small mt-2 text-center';
                moreDiv.textContent = `+${filteredDistritos.length - 15} opciones más...`;
                container.appendChild(moreDiv);
            }

            updateDistritoCounts();
        }

        function addCustomTag() {
            const input = document.getElementById('customTagInput');
            const val = input.value.trim().toUpperCase();
            if (!val) return;

            if (!allDistritos.includes(val)) allDistritos.push(val);
            if (!specialTags.includes(val)) specialTags.push(val);

            input.value = '';
            selectedDistrito = val; // Auto select it
            showToast('Etiqueta creada y seleccionada', 'success');
            renderDistritosList();
        }

        function filterDistritos() {
            renderDistritosList();
        }

        function selectDistrito(distrito) {
            selectedDistrito = selectedDistrito === distrito ? null : distrito;
            renderDistritosList();
        }

        function updateDistritoCounts() {
            const counts = {};
            Object.values(calendarioData).forEach(distritos => {
                distritos.forEach(d => {
                    counts[d] = (counts[d] || 0) + 1;
                });
            });

            allDistritos.forEach(d => {
                const safeId = d.replace(/[^a-zA-Z0-9]/g, '-');
                const el = document.getElementById('count-' + safeId);
                if (el) el.textContent = counts[d] || 0;
            });
        }

        // Load calendario for current month
        async function loadCalendario() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;

            try {
                const result = await api.get(`/calendario?mes=${month}&anio=${year}`);
                if (result.success && result.data) {
                    calendarioData = result.data.dias || {};
                    // Extract custom tags stored in DB and inject into local runtime tags
                    Object.values(calendarioData).forEach(tags => {
                        tags.forEach(t => {
                            if (!allDistritos.includes(t)) allDistritos.push(t);
                            if (!specialTags.includes(t)) specialTags.push(t);
                        });
                    });
                } else {
                    calendarioData = {};
                }
            } catch (err) {
                calendarioData = {};
            }

            renderCalendar();
            updateDistritoCounts();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('monthTitle').textContent = `${meses[month]} ${year}`;

            const grid = document.getElementById('calendarGrid');
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
            const todayDate = today.getDate();

            // Build HTML string (faster than multiple DOM operations)
            const htmlParts = [];

            // Day headers
            for (let i = 0; i < 7; i++) {
                htmlParts.push(`<div class="calendar-day-header">${diasSemana[i]}</div>`);
            }

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                htmlParts.push('<div class="calendar-day empty"></div>');
            }

            // Pre-calculate month string once
            const monthStr = String(month + 1).padStart(2, '0');

            // Days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${monthStr}-${String(day).padStart(2, '0')}`;
                const isToday = isCurrentMonth && todayDate === day;
                const dayDistritos = calendarioData[dateStr];
                const dayOfWeek = (firstDay + day - 1) % 7;

                let chipsHtml = '';
                if (dayDistritos && dayDistritos.length > 0) {
                    chipsHtml = dayDistritos.map(d => {
                        const color = distritoColors[d];
                        const textColor = specialTags.includes(d) ? 'white' : '#333';
                        const shortName = d.length > 12 ? d.substring(0, 12) + '.' : d;
                        return `<span class="distrito-chip" style="background:${color};color:${textColor}">${shortName}</span>`;
                    }).join('');
                }

                htmlParts.push(`<div class="calendar-day${isToday ? ' today' : ''}" data-date="${dateStr}">
                    <div class="day-number"><span>${day}</span><span class="day-name">${diasSemana[dayOfWeek]}</span></div>
                    <div class="distrito-chips">${chipsHtml}</div>
                </div>`);
            }

            grid.innerHTML = htmlParts.join('');

            // Attach click handlers using event delegation
            grid.onclick = handleCalendarClick;
        }

        // Event delegation for calendar clicks
        function handleCalendarClick(e) {
            const dayEl = e.target.closest('.calendar-day:not(.empty)');
            if (dayEl) {
                const dateStr = dayEl.dataset.date;
                if (dateStr) toggleDistrito(dateStr);
            }
        }

        function toggleDistrito(dateStr) {
            if (!selectedDistrito) {
                showToast('Selecciona un distrito primero', 'warning');
                return;
            }

            if (!calendarioData[dateStr]) {
                calendarioData[dateStr] = [];
            }

            const idx = calendarioData[dateStr].indexOf(selectedDistrito);
            if (idx >= 0) {
                calendarioData[dateStr].splice(idx, 1);
                if (calendarioData[dateStr].length === 0) {
                    delete calendarioData[dateStr];
                }
            } else {
                calendarioData[dateStr].push(selectedDistrito);
            }

            renderCalendar();
            updateDistritoCounts();
        }

        async function saveCalendario() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;

            try {
                const result = await api.post('/calendario', {
                    mes: month,
                    anio: year,
                    dias: calendarioData
                });

                if (result.success) {
                    showToast('Calendario guardado correctamente');
                } else {
                    showToast(result.message || 'Error al guardar', 'danger');
                }
            } catch (err) {
                showToast('Error al guardar', 'danger');
            }
        }

        async function copyFromPreviousMonth() {
            const prevDate = new Date(currentDate);
            prevDate.setMonth(prevDate.getMonth() - 1);
            const prevYear = prevDate.getFullYear();
            const prevMonth = prevDate.getMonth() + 1;

            try {
                const result = await api.get(`/calendario?mes=${prevMonth}&anio=${prevYear}`);
                if (result.success && result.data && result.data.dias) {
                    // Copy structure but adjust dates to current month
                    const prevDias = result.data.dias;
                    const newDias = {};

                    const year = currentDate.getFullYear();
                    const month = currentDate.getMonth();
                    const daysInMonth = new Date(year, month + 1, 0).getDate();

                    // Copy by day of month (if day exists in both months)
                    Object.keys(prevDias).forEach(dateStr => {
                        const prevDay = parseInt(dateStr.split('-')[2]);
                        if (prevDay <= daysInMonth) {
                            const newDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(prevDay).padStart(2, '0')}`;
                            newDias[newDateStr] = [...prevDias[dateStr]];
                        }
                    });

                    calendarioData = newDias;
                    renderCalendar();
                    updateDistritoCounts();
                    showToast('Calendario copiado del mes anterior');
                } else {
                    showToast('No hay calendario en el mes anterior', 'warning');
                }
            } catch (err) {
                showToast('Error al copiar', 'danger');
            }
        }

        // Initialize
        loadDistritos();
        loadCalendario();
    </script>
</body>

</html>
