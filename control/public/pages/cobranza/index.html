<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <title>Control de Cobranza - IO Group</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
    <style>
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: #666;
        }

        .stat-card.pending .value {
            color: #f57c00;
        }

        .stat-card.overdue .value {
            color: #d32f2f;
        }

        .stat-card.collected .value {
            color: #388e3c;
        }

        .stat-card.total .value {
            color: #1565c0;
        }

        .service-row {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .service-info {
            flex: 1;
            min-width: 200px;
        }

        .service-info .client {
            font-weight: 600;
            font-size: 1rem;
        }

        .service-info .details {
            font-size: 0.85rem;
            color: #666;
        }

        .service-amount {
            text-align: right;
            min-width: 100px;
        }

        .service-amount .amount {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .service-actions {
            display: flex;
            gap: 8px;
        }

        .days-late {
            background: #ffebee;
            color: #c62828;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .service-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .service-amount {
                text-align: left;
            }
        }
    </style>
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Control de Cobranza</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <!-- Stats Row -->
                <div class="stats-row">
                    <div class="stat-card pending">
                        <div class="value" id="statPendiente">S/ 0</div>
                        <div class="label"><i class="bi bi-clock"></i> Pendiente</div>
                    </div>
                    <div class="stat-card overdue">
                        <div class="value" id="statVencido">S/ 0</div>
                        <div class="label"><i class="bi bi-exclamation-triangle"></i> Vencido (+30 días)</div>
                    </div>
                    <div class="stat-card collected">
                        <div class="value" id="statCobrado">S/ 0</div>
                        <div class="label"><i class="bi bi-check-circle"></i> Cobrado (mes)</div>
                    </div>
                    <div class="stat-card total">
                        <div class="value" id="statTotal">0</div>
                        <div class="label"><i class="bi bi-file-text"></i> Servicios pendientes</div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="card mb-3">
                    <div class="card-body py-2">
                        <div class="d-flex gap-2 flex-wrap align-items-center">
                            <input type="text" class="form-control form-control-sm" id="filterCliente"
                                placeholder="Buscar cliente..." style="width: 200px;">
                            <select class="form-select form-select-sm" id="filterEstado" style="width: 140px;">
                                <option value="pendiente" selected>Pendientes</option>
                                <option value="pagado">Pagados</option>
                                <option value="">Todos</option>
                            </select>
                            <button class="btn btn-outline-secondary btn-sm" onclick="clearFilters()">
                                <i class="bi bi-x-circle"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Services List -->
                <div id="servicesList">
                    <div class="text-center py-4 text-muted">Cargando...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Registrar Pago -->
    <div class="modal fade" id="pagoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-cash-coin"></i> Registrar Pago</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Cliente</label>
                        <input type="text" class="form-control" id="pagoCliente" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Monto</label>
                        <input type="text" class="form-control" id="pagoMonto" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha de Pago</label>
                        <input type="date" class="form-control" id="pagoFecha">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="confirmarPago()">
                        <i class="bi bi-check"></i> Confirmar Pago
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.0"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('cobranza');

        let allServicios = [];
        let selectedServicio = null;
        const pagoModal = new bootstrap.Modal(document.getElementById('pagoModal'));
        const today = new Date();

        document.getElementById('pagoFecha').value = today.toISOString().split('T')[0];

        async function loadData() {
            try {
                const result = await api.get('/servicios?limit=500');
                if (result.success) {
                    allServicios = result.data.filter(s => s.tarifa_servicio > 0);
                    applyFilters();
                    updateStats();
                }
            } catch (err) {
                showToast('Error cargando datos', 'danger');
            }
        }

        function applyFilters() {
            const cliente = document.getElementById('filterCliente').value.toLowerCase();
            const estado = document.getElementById('filterEstado').value;

            let filtered = allServicios;

            if (cliente) {
                filtered = filtered.filter(s =>
                    s.sede_nombre?.toLowerCase().includes(cliente) ||
                    s.empresa_razon_social?.toLowerCase().includes(cliente)
                );
            }

            if (estado) {
                filtered = filtered.filter(s => (s.estado_pago || 'pendiente') === estado);
            }

            renderList(filtered);
        }

        function updateStats() {
            const pendientes = allServicios.filter(s => (s.estado_pago || 'pendiente') === 'pendiente');
            const pagados = allServicios.filter(s => s.estado_pago === 'pagado');

            // Vencidos: más de 30 días desde fecha_programada
            const vencidos = pendientes.filter(s => {
                if (!s.fecha_programada) return false;
                const dias = Math.floor((today - new Date(s.fecha_programada)) / (1000 * 60 * 60 * 24));
                return dias > 30;
            });

            // Cobrado este mes
            const currentMonth = today.getMonth();
            const currentYear = today.getFullYear();
            const pagadosMes = pagados.filter(s => {
                if (!s.fecha_pago) return false;
                const fechaPago = new Date(s.fecha_pago);
                return fechaPago.getMonth() === currentMonth && fechaPago.getFullYear() === currentYear;
            });

            const sumPendiente = pendientes.reduce((s, srv) => s + parseFloat(srv.tarifa_servicio || 0), 0);
            const sumVencido = vencidos.reduce((s, srv) => s + parseFloat(srv.tarifa_servicio || 0), 0);
            const sumCobrado = pagadosMes.reduce((s, srv) => s + parseFloat(srv.tarifa_servicio || 0), 0);

            document.getElementById('statPendiente').textContent = `S/ ${sumPendiente.toFixed(0)}`;
            document.getElementById('statVencido').textContent = `S/ ${sumVencido.toFixed(0)}`;
            document.getElementById('statCobrado').textContent = `S/ ${sumCobrado.toFixed(0)}`;
            document.getElementById('statTotal').textContent = pendientes.length;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleDateString('es-PE');
        }

        function getDaysLate(dateStr) {
            if (!dateStr) return 0;
            return Math.floor((today - new Date(dateStr)) / (1000 * 60 * 60 * 24));
        }

        function renderList(data) {
            const container = document.getElementById('servicesList');

            if (data.length === 0) {
                container.innerHTML = '<div class="text-center py-4 text-muted">Sin servicios</div>';
                return;
            }

            // Group by sede
            const grouped = {};
            data.forEach(s => {
                const key = s.id_sede || 'sin_sede';
                if (!grouped[key]) {
                    grouped[key] = {
                        sede_nombre: s.sede_nombre || s.empresa_razon_social || 'Sin cliente',
                        contacto_telefono: s.contacto_telefono,
                        servicios: []
                    };
                }
                grouped[key].servicios.push(s);
            });

            // Render grouped
            let html = '';
            Object.values(grouped).forEach(group => {
                // Sort services by date (oldest first)
                group.servicios.sort((a, b) => new Date(a.fecha_programada) - new Date(b.fecha_programada));

                // Calculate total debt for this sede
                const totalDeuda = group.servicios
                    .filter(s => (s.estado_pago || 'pendiente') === 'pendiente')
                    .reduce((sum, s) => sum + parseFloat(s.tarifa_servicio || 0), 0);

                const pendientes = group.servicios.filter(s => (s.estado_pago || 'pendiente') === 'pendiente').length;

                html += `
                <div class="sede-group mb-3">
                    <div class="sede-header d-flex justify-content-between align-items-center p-3" style="background: #f8f9fa; border-radius: 8px 8px 0 0; border-bottom: 2px solid ${totalDeuda > 0 ? '#f57c00' : '#388e3c'};">
                        <div>
                            <strong>${group.sede_nombre}</strong>
                            ${pendientes > 0 ? `<span class="badge bg-warning text-dark ms-2">${pendientes} pendiente${pendientes > 1 ? 's' : ''}</span>` : '<span class="badge bg-success ms-2">Al día</span>'}
                        </div>
                        <div class="fw-bold" style="color: ${totalDeuda > 0 ? '#e65100' : '#2e7d32'};">
                            ${totalDeuda > 0 ? `S/ ${totalDeuda.toFixed(0)}` : '✓'}
                        </div>
                    </div>
                    <div class="sede-services" style="background: white; border-radius: 0 0 8px 8px; padding: 10px;">
                `;

                group.servicios.forEach(s => {
                    const tarifa = parseFloat(s.tarifa_servicio || 0);
                    const diasRetraso = getDaysLate(s.fecha_programada);
                    const isPendiente = (s.estado_pago || 'pendiente') === 'pendiente';

                    html += `
                        <div class="d-flex justify-content-between align-items-center py-2 border-bottom" style="font-size: 0.9rem;">
                            <div>
                                <i class="bi bi-calendar3"></i> ${formatDate(s.fecha_programada)}
                                ${isPendiente && diasRetraso > 0 ? `<span class="days-late ms-2">${diasRetraso} días</span>` : ''}
                                ${!isPendiente ? '<i class="bi bi-check-circle-fill text-success ms-2"></i>' : ''}
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="fw-bold">S/ ${tarifa.toFixed(0)}</span>
                                ${isPendiente ? `
                                    <button class="btn btn-success btn-sm py-0 px-2" onclick="abrirPago(${s.id_servicio})" title="Marcar pagado">
                                        <i class="bi bi-check"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });

                // WhatsApp button for sede
                const hasPendientes = group.servicios.some(s => (s.estado_pago || 'pendiente') === 'pendiente');
                if (hasPendientes && group.contacto_telefono) {
                    const firstServicio = group.servicios.find(s => (s.estado_pago || 'pendiente') === 'pendiente');
                    html += `
                        <div class="text-end pt-2">
                            <button class="btn btn-outline-success btn-sm" onclick="sendWhatsApp(${firstServicio.id_servicio})" title="Enviar recordatorio">
                                <i class="bi bi-whatsapp"></i> Recordar pago
                            </button>
                        </div>
                    `;
                }

                html += '</div></div>';
            });

            container.innerHTML = html;
        }

        function abrirPago(id) {
            selectedServicio = allServicios.find(s => s.id_servicio === id);
            if (!selectedServicio) return;

            document.getElementById('pagoCliente').value = selectedServicio.sede_nombre || selectedServicio.empresa_razon_social || '';
            document.getElementById('pagoMonto').value = `S/ ${parseFloat(selectedServicio.tarifa_servicio || 0).toFixed(2)}`;
            document.getElementById('pagoFecha').value = today.toISOString().split('T')[0];

            pagoModal.show();
        }

        async function confirmarPago() {
            const fecha = document.getElementById('pagoFecha').value;

            try {
                const result = await api.put(`/servicios/${selectedServicio.id_servicio}`, {
                    estado_pago: 'pagado',
                    fecha_pago: fecha
                });

                if (result.success) {
                    showToast('Pago registrado correctamente');
                    pagoModal.hide();
                    loadData();
                } else {
                    showToast(result.message || 'Error', 'danger');
                }
            } catch (err) {
                showToast('Error registrando pago', 'danger');
            }
        }

        function sendWhatsApp(id) {
            const servicio = allServicios.find(s => s.id_servicio === id);
            if (!servicio) return;

            const telefono = servicio.contacto_telefono || '';
            if (!telefono) {
                showToast('Cliente sin teléfono registrado', 'warning');
                return;
            }

            const tarifa = parseFloat(servicio.tarifa_servicio || 0).toFixed(0);
            const mensaje = `Hola, somos de IO Group. Le recordamos que tiene pendiente el pago del servicio del ${formatDate(servicio.fecha_programada)} por S/ ${tarifa}. ¿Podría indicarnos cuándo realizará el pago?`;
            const phone = telefono.replace(/\D/g, '');
            window.open(`https://wa.me/51${phone}?text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        function clearFilters() {
            document.getElementById('filterCliente').value = '';
            document.getElementById('filterEstado').value = 'pendiente';
            applyFilters();
        }

        // Event listeners
        document.getElementById('filterCliente').addEventListener('input', applyFilters);
        document.getElementById('filterEstado').addEventListener('change', applyFilters);

        loadData();
    </script>
</body>

</html>
