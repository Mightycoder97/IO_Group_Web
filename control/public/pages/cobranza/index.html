<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <title>Control de Cobranza - IO Group</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/control/css/global.css" rel="stylesheet">
    <style>
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: #666;
        }

        .stat-card.pending .value {
            color: #f57c00;
        }

        .stat-card.overdue .value {
            color: #d32f2f;
        }

        .stat-card.collected .value {
            color: #388e3c;
        }

        .stat-card.total .value {
            color: #1565c0;
        }

        .invoice-row {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .invoice-info {
            flex: 1;
            min-width: 200px;
        }

        .invoice-info .client {
            font-weight: 600;
            font-size: 1rem;
        }

        .invoice-info .details {
            font-size: 0.85rem;
            color: #666;
        }

        .invoice-amount {
            text-align: right;
            min-width: 100px;
        }

        .invoice-amount .amount {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .invoice-actions {
            display: flex;
            gap: 8px;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-emitida {
            background: #fff3e0;
            color: #ef6c00;
        }

        .status-vencida {
            background: #ffebee;
            color: #c62828;
        }

        .status-pagada {
            background: #e8f5e9;
            color: #2e7d32;
        }

        @media (max-width: 768px) {
            .invoice-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .invoice-amount {
                text-align: left;
            }
        }
    </style>
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Control de Cobranza</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <!-- Stats Row -->
                <div class="stats-row">
                    <div class="stat-card pending">
                        <div class="value" id="statPendiente">S/ 0</div>
                        <div class="label"><i class="bi bi-clock"></i> Pendiente</div>
                    </div>
                    <div class="stat-card overdue">
                        <div class="value" id="statVencido">S/ 0</div>
                        <div class="label"><i class="bi bi-exclamation-triangle"></i> Vencido</div>
                    </div>
                    <div class="stat-card collected">
                        <div class="value" id="statCobrado">S/ 0</div>
                        <div class="label"><i class="bi bi-check-circle"></i> Cobrado (mes)</div>
                    </div>
                    <div class="stat-card total">
                        <div class="value" id="statTotal">0</div>
                        <div class="label"><i class="bi bi-file-text"></i> Facturas pendientes</div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="card mb-3">
                    <div class="card-body py-2">
                        <div class="d-flex gap-2 flex-wrap align-items-center">
                            <input type="text" class="form-control form-control-sm" id="filterCliente"
                                placeholder="Buscar cliente..." style="width: 200px;">
                            <select class="form-select form-select-sm" id="filterEstado" style="width: 140px;">
                                <option value="">Todos</option>
                                <option value="emitida" selected>Pendientes</option>
                                <option value="vencida">Vencidas</option>
                                <option value="pagada">Pagadas</option>
                            </select>
                            <input type="date" class="form-control form-control-sm" id="filterDesde"
                                style="width: 140px;" title="Desde">
                            <input type="date" class="form-control form-control-sm" id="filterHasta"
                                style="width: 140px;" title="Hasta">
                            <button class="btn btn-outline-secondary btn-sm" onclick="clearFilters()">
                                <i class="bi bi-x-circle"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Invoices List -->
                <div id="invoicesList">
                    <div class="text-center py-4 text-muted">Cargando...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Registrar Pago -->
    <div class="modal fade" id="pagoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-cash-coin"></i> Registrar Pago</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Cliente</label>
                        <input type="text" class="form-control" id="pagoCliente" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Monto</label>
                        <input type="text" class="form-control" id="pagoMonto" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Método de Pago *</label>
                        <select class="form-select" id="pagoMetodo" required>
                            <option value="">Seleccionar...</option>
                            <option value="transferencia">Transferencia</option>
                            <option value="yape">Yape</option>
                            <option value="plin">Plin</option>
                            <option value="efectivo">Efectivo</option>
                            <option value="deposito">Depósito</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha de Pago</label>
                        <input type="date" class="form-control" id="pagoFecha">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="confirmarPago()">
                        <i class="bi bi-check"></i> Confirmar Pago
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.0"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('facturas');

        let allFacturas = [];
        let selectedFactura = null;
        const pagoModal = new bootstrap.Modal(document.getElementById('pagoModal'));

        // Set default date filter to current month
        const today = new Date();
        document.getElementById('filterDesde').value = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
        document.getElementById('pagoFecha').value = today.toISOString().split('T')[0];

        async function loadData() {
            try {
                const result = await api.get('/facturas');
                if (result.success) {
                    allFacturas = result.data;
                    applyFilters();
                    updateStats();
                }
            } catch (err) {
                showToast('Error cargando datos', 'danger');
            }
        }

        function applyFilters() {
            const cliente = document.getElementById('filterCliente').value.toLowerCase();
            const estado = document.getElementById('filterEstado').value;
            const desde = document.getElementById('filterDesde').value;
            const hasta = document.getElementById('filterHasta').value;

            let filtered = allFacturas;

            if (cliente) {
                filtered = filtered.filter(f =>
                    f.sede_nombre?.toLowerCase().includes(cliente) ||
                    f.empresa_razon_social?.toLowerCase().includes(cliente)
                );
            }
            if (estado) {
                filtered = filtered.filter(f => f.estado === estado);
            }
            if (desde) {
                filtered = filtered.filter(f => f.fecha_emision >= desde);
            }
            if (hasta) {
                filtered = filtered.filter(f => f.fecha_emision <= hasta);
            }

            renderList(filtered);
        }

        function updateStats() {
            const pendientes = allFacturas.filter(f => f.estado === 'emitida');
            const vencidas = allFacturas.filter(f => f.estado === 'vencida');
            const currentMonth = today.getMonth();
            const currentYear = today.getFullYear();
            const pagadasMes = allFacturas.filter(f => {
                if (f.estado !== 'pagada' || !f.fecha_pago) return false;
                const fechaPago = new Date(f.fecha_pago);
                return fechaPago.getMonth() === currentMonth && fechaPago.getFullYear() === currentYear;
            });

            const sumPendiente = pendientes.reduce((s, f) => s + parseFloat(f.monto_total || 0), 0);
            const sumVencido = vencidas.reduce((s, f) => s + parseFloat(f.monto_total || 0), 0);
            const sumCobrado = pagadasMes.reduce((s, f) => s + parseFloat(f.monto_total || 0), 0);

            document.getElementById('statPendiente').textContent = `S/ ${sumPendiente.toFixed(0)}`;
            document.getElementById('statVencido').textContent = `S/ ${sumVencido.toFixed(0)}`;
            document.getElementById('statCobrado').textContent = `S/ ${sumCobrado.toFixed(0)}`;
            document.getElementById('statTotal').textContent = pendientes.length + vencidas.length;
        }

        function getStatusClass(estado) {
            return `status-${estado}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleDateString('es-PE');
        }

        function renderList(data) {
            const container = document.getElementById('invoicesList');

            if (data.length === 0) {
                container.innerHTML = '<div class="text-center py-4 text-muted">Sin facturas</div>';
                return;
            }

            container.innerHTML = data.map(f => `
                <div class="invoice-row">
                    <div class="invoice-info">
                        <div class="client">${f.sede_nombre || f.empresa_razon_social || 'Sin cliente'}</div>
                        <div class="details">
                            <span class="status-badge ${getStatusClass(f.estado)}">${f.estado}</span>
                            <span class="ms-2">${f.serie || ''}-${f.numero_factura}</span>
                            <span class="ms-2"><i class="bi bi-calendar"></i> ${formatDate(f.fecha_emision)}</span>
                            ${f.fecha_vencimiento ? `<span class="ms-2 text-danger"><i class="bi bi-alarm"></i> Vence: ${formatDate(f.fecha_vencimiento)}</span>` : ''}
                        </div>
                    </div>
                    <div class="invoice-amount">
                        <div class="amount">S/ ${parseFloat(f.monto_total || 0).toFixed(2)}</div>
                    </div>
                    <div class="invoice-actions">
                        ${f.estado !== 'pagada' ? `
                            <button class="btn btn-success btn-sm" onclick="abrirPago(${f.id_factura})" title="Marcar pagado">
                                <i class="bi bi-check-circle"></i>
                            </button>
                            <button class="btn btn-outline-success btn-sm" onclick="sendWhatsApp(${f.id_factura})" title="WhatsApp">
                                <i class="bi bi-whatsapp"></i>
                            </button>
                        ` : `
                            <span class="text-success"><i class="bi bi-check-circle-fill"></i> Pagado</span>
                        `}
                    </div>
                </div>
            `).join('');
        }

        function abrirPago(id) {
            selectedFactura = allFacturas.find(f => f.id_factura === id);
            if (!selectedFactura) return;

            document.getElementById('pagoCliente').value = selectedFactura.sede_nombre || selectedFactura.empresa_razon_social || '';
            document.getElementById('pagoMonto').value = `S/ ${parseFloat(selectedFactura.monto_total || 0).toFixed(2)}`;
            document.getElementById('pagoMetodo').value = '';
            document.getElementById('pagoFecha').value = today.toISOString().split('T')[0];

            pagoModal.show();
        }

        async function confirmarPago() {
            const metodo = document.getElementById('pagoMetodo').value;
            const fecha = document.getElementById('pagoFecha').value;

            if (!metodo) {
                showToast('Selecciona un método de pago', 'warning');
                return;
            }

            try {
                const result = await api.put(`/facturas/${selectedFactura.id_factura}`, {
                    estado: 'pagada',
                    fecha_pago: fecha,
                    metodo_pago: metodo
                });

                if (result.success) {
                    showToast('Pago registrado correctamente');
                    pagoModal.hide();
                    loadData();
                } else {
                    showToast(result.message || 'Error', 'danger');
                }
            } catch (err) {
                showToast('Error registrando pago', 'danger');
            }
        }

        function sendWhatsApp(id) {
            const factura = allFacturas.find(f => f.id_factura === id);
            if (!factura) return;

            const telefono = factura.contacto_telefono || '';
            if (!telefono) {
                showToast('Cliente sin teléfono registrado', 'warning');
                return;
            }

            const mensaje = `Hola, somos de IO Group. Le recordamos que tiene pendiente la factura ${factura.serie || ''}-${factura.numero_factura} por S/ ${parseFloat(factura.monto_total).toFixed(2)}. ¿Podría indicarnos cuándo realizará el pago?`;
            const phone = telefono.replace(/\D/g, '');
            window.open(`https://wa.me/51${phone}?text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        function clearFilters() {
            document.getElementById('filterCliente').value = '';
            document.getElementById('filterEstado').value = 'emitida';
            document.getElementById('filterDesde').value = '';
            document.getElementById('filterHasta').value = '';
            applyFilters();
        }

        // Event listeners
        document.getElementById('filterCliente').addEventListener('input', applyFilters);
        document.getElementById('filterEstado').addEventListener('change', applyFilters);
        document.getElementById('filterDesde').addEventListener('change', applyFilters);
        document.getElementById('filterHasta').addEventListener('change', applyFilters);

        loadData();
    </script>
</body>

</html>
