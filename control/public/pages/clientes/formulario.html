<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cliente - IO Group</title>
    <!-- Preconnect para optimizar carga -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item"><a href="listar.html">Clientes</a></li>
                            <li class="breadcrumb-item active" id="pageTitle">Nuevo Cliente</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="bi bi-key"></i> Cambiar Contraseña</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-person"></i> <span id="formTitle">Nuevo Cliente</span>
                    </div>
                    <div class="card-body">
                        <form id="dataForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nombre *</label>
                                    <input type="text" class="form-control" id="nombre" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">DNI</label>
                                    <input type="text" class="form-control" id="dni" maxlength="8" pattern="\d{8}">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Teléfono</label>
                                    <input type="text" class="form-control" id="telefono">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Dirección</label>
                                    <input type="text" class="form-control" id="direccion">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Notas</label>
                                    <textarea class="form-control" id="notas" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i>
                                    Guardar</button>
                                <a href="listar.html" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Services Section -->
                <div class="card mt-4" id="servicesSection" style="display: none;">
                    <div class="card-header">
                        <i class="bi bi-truck"></i> Servicios del Cliente
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <div class="table-responsive">
                                <table class="table table-hover table-sm">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Sede</th>
                                            <th>Fecha</th>
                                            <th>Tarifa</th>
                                            <th>Estado</th>
                                            <th>Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody id="servicesTableBody">
                                        <tr>
                                            <td colspan="5" class="text-center py-4">Cargando...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <!-- Pagination -->
                        <nav aria-label="Page navigation" class="mt-3">
                            <ul class="pagination justify-content-center" id="servicePagination">
                                <!-- Pagination items will be generated here -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.0"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('clientes');
        const id = getUrlParam('id');
        if (id) {
            document.getElementById('pageTitle').textContent = 'Editar Cliente';
            document.getElementById('formTitle').textContent = 'Editar Cliente';
            document.getElementById('servicesSection').style.display = 'block';
            loadData();
            loadServices();
        }

        let servicesData = { data: [], total: 0, page: 1, limit: 5 }; // Smaller limit for embedded view

        async function loadServices(page = 1) {
            if (!id) return;
            try {
                const result = await api.get(`/servicios?cliente=${id}&page=${page}&limit=5`);
                if (result.success) {
                    servicesData = result;
                    renderServicesTable(result.data);
                    renderServicePagination(result.total, result.page, result.limit);
                }
            } catch (err) {
                console.error(err);
                showToast('Error cargando servicios', 'danger');
            }
        }

        function renderServicesTable(data) {
            const tbody = document.getElementById('servicesTableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No hay servicios registrados</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(s => {
                const tarifa = parseFloat(s.tarifa_servicio || 0);
                const isPagado = s.estado_pago === 'pagado';
                return `
                <tr>
                    <td>${s.sede_nombre || '-'}</td>
                    <td>${new Date(s.fecha_servicio).toLocaleDateString('es-PE')}</td>
                    <td><strong>S/${tarifa.toFixed(2)}</strong></td>
                    <td>
                        ${isPagado
                        ? '<span class="badge bg-success">Pagado</span>'
                        : '<span class="badge bg-warning text-dark">Pendiente</span>'}
                    </td>
                    <td>
                        <a href="../servicios/formulario.html?id=${s.id_servicio}" class="btn btn-sm btn-outline-primary" target="_blank"><i class="bi bi-eye"></i></a>
                    </td>
                </tr>
            `}).join('');
        }

        function renderServicePagination(total, page, limit) {
            const totalPages = Math.ceil(total / limit);
            const paginationEl = document.getElementById('servicePagination');
            let html = '';

            if (totalPages <= 1) {
                paginationEl.innerHTML = '';
                return;
            }

            // Previous
            html += `<li class="page-item ${page <= 1 ? 'disabled' : ''}">
                        <a class="page-link" href="#" onclick="loadServices(${page - 1}); return false;">Anterior</a>
                     </li>`;

            // Pages - Simple version for embedded view
            for (let i = 1; i <= totalPages; i++) {
                html += `<li class="page-item ${i === page ? 'active' : ''}">
                            <a class="page-link" href="#" onclick="loadServices(${i}); return false;">${i}</a>
                         </li>`;
            }

            // Next
            html += `<li class="page-item ${page >= totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="#" onclick="loadServices(${page + 1}); return false;">Siguiente</a>
                     </li>`;

            paginationEl.innerHTML = html;
        }

        async function loadData() {
            try {
                const result = await api.get(`/clientes/${id}`);
                if (result.success) {
                    document.getElementById('nombre').value = result.data.nombre || '';
                    document.getElementById('dni').value = result.data.dni || '';
                    document.getElementById('telefono').value = result.data.telefono || '';
                    document.getElementById('email').value = result.data.email || '';
                    document.getElementById('direccion').value = result.data.direccion || '';
                    document.getElementById('notas').value = result.data.notas || '';
                }
            } catch (err) {
                showToast('Error cargando datos', 'danger');
            }
        }
        document.getElementById('dataForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('nombre').value,
                dni: document.getElementById('dni').value || null,
                telefono: document.getElementById('telefono').value || null,
                email: document.getElementById('email').value || null,
                direccion: document.getElementById('direccion').value || null,
                notas: document.getElementById('notas').value || null
            };
            try {
                const result = id
                    ? await api.put(`/clientes/${id}`, data)
                    : await api.post('/clientes', data);
                if (result.success) {
                    showToast(id ? 'Cliente actualizado' : 'Cliente creado');
                    window.location.href = 'listar.html';
                } else {
                    showToast(result.message, 'danger');
                }
            } catch (err) {
                showToast('Error guardando', 'danger');
            }
        });
    </script>
</body>

</html>
