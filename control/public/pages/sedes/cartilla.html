<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cartilla Cliente - IO Control</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
    <style>
        .client-header {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-left: 4px solid var(--primary-color);
            color: #1a1a1a;
            padding: 1.5rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
        }

        .client-header h4 {
            margin-bottom: 0.5rem;
            color: #1B5E20;
            font-weight: 600;
        }

        .client-header .info-row {
            color: #333;
            font-size: 0.95rem;
        }

        .client-header .info-row i {
            color: #1B5E20;
        }

        .client-header .text-muted-light {
            color: #666 !important;
        }

        .debt-status {
            padding: 1rem 1.25rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .debt-status.al-dia {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-left: 4px solid #388e3c;
        }

        .debt-status.con-deuda {
            background: linear-gradient(135deg, #ffebee, #ffcdd2);
            border-left: 4px solid #d32f2f;
        }

        .debt-status .status-icon {
            font-size: 2rem;
        }

        .debt-status.al-dia .status-icon {
            color: #388e3c;
        }

        .debt-status.con-deuda .status-icon {
            color: #d32f2f;
        }

        .debt-status .status-text {
            flex: 1;
        }

        .debt-status .status-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .debt-status.al-dia .status-title {
            color: #2e7d32;
        }

        .debt-status.con-deuda .status-title {
            color: #c62828;
        }

        .debt-status .status-detail {
            font-size: 0.9rem;
            color: #555;
        }

        .debt-amount {
            font-size: 1.5rem;
            font-weight: 700;
            color: #c62828;
        }

        .category-card {
            text-align: center;
            padding: 2rem 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .category-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .category-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .category-count {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .category-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .category-contracts .category-icon {
            color: #1976D2;
        }

        .category-invoices .category-icon {
            color: #F57C00;
        }

        .category-manifests .category-icon {
            color: #388E3C;
        }

        .category-guides .category-icon {
            color: #7B1FA2;
        }

        .quick-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .info-row i {
            width: 20px;
        }

        .pago-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .pago-pagado {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .pago-pendiente {
            background: #fff3e0;
            color: #ef6c00;
        }

        .pago-sin-factura {
            background: #f5f5f5;
            color: #757575;
        }
    </style>
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item"><a href="listar.html">Clientes</a></li>
                            <li class="breadcrumb-item active" id="breadcrumbName">Cartilla</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <a href="../alertas/index.html" class="btn btn-light alert-badge">
                        <i class="bi bi-bell"></i><span class="badge bg-danger" id="alertCount">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <!-- Client Header -->
                <div class="client-header" id="clientHeader">
                    <h4 id="clientName">Cargando...</h4>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <div class="info-row"><i class="bi bi-building"></i> <span id="empresaInfo">-</span></div>
                            <div class="info-row"><i class="bi bi-geo-alt"></i> <span id="direccionInfo">-</span></div>
                        </div>
                        <div class="col-md-6">
                            <div class="info-row"><i class="bi bi-person"></i> <span id="contactoInfo">-</span></div>
                            <div class="info-row"><i class="bi bi-telephone"></i> <span id="telefonoInfo">-</span></div>
                        </div>
                    </div>
                    <div class="quick-actions">
                        <a href="#" id="btnWhatsApp" class="btn btn-success btn-sm" target="_blank"><i
                                class="bi bi-whatsapp"></i> WhatsApp</a>
                        <a href="#" id="btnEdit" class="btn btn-outline-primary btn-sm"><i class="bi bi-pencil"></i>
                            Editar</a>
                    </div>
                </div>

                <!-- Debt Status Banner -->
                <div class="debt-status al-dia" id="debtStatus">
                    <div class="status-icon"><i class="bi bi-check-circle-fill"></i></div>
                    <div class="status-text">
                        <div class="status-title" id="debtTitle">Al día</div>
                        <div class="status-detail" id="debtDetail">Sin deudas pendientes</div>
                    </div>
                    <div class="debt-amount" id="debtAmount" style="display:none;">S/ 0</div>
                </div>

                <!-- Document Categories -->
                <h5 class="mb-3"><i class="bi bi-folder2-open"></i> Archivo Documentario</h5>
                <div class="row g-4 mb-4">
                    <div class="col-lg-3 col-md-6 col-6">
                        <div class="card category-card category-contracts" onclick="goToCategory('contratos')">
                            <div class="category-icon"><i class="bi bi-file-earmark-text"></i></div>
                            <div class="category-count" id="countContratos">0</div>
                            <div class="category-label">Contratos</div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 col-6">
                        <div class="card category-card category-invoices" onclick="goToCategory('facturas')">
                            <div class="category-icon"><i class="bi bi-receipt"></i></div>
                            <div class="category-count" id="countFacturas">0</div>
                            <div class="category-label">Facturas</div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 col-6">
                        <div class="card category-card category-manifests" onclick="goToCategory('manifiestos')">
                            <div class="category-icon"><i class="bi bi-journal-text"></i></div>
                            <div class="category-count" id="countManifiestos">0</div>
                            <div class="category-label">Manifiestos</div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 col-6">
                        <div class="card category-card category-guides" onclick="goToCategory('guias')">
                            <div class="category-icon"><i class="bi bi-file-earmark"></i></div>
                            <div class="category-count" id="countGuias">0</div>
                            <div class="category-label">Guías</div>
                        </div>
                    </div>
                </div>

                <!-- Services with Payment Status -->
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-clock-history"></i> Historial de Servicios
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Fecha Servicio</th>
                                        <th>Estado Pago</th>
                                        <th>Tarifa</th>
                                    </tr>
                                </thead>
                                <tbody id="serviciosBody">
                                    <tr>
                                        <td colspan="3" class="text-center py-3">Cargando...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.0"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('sedes');

        const sedeId = getUrlParam('id');
        let sedeData = null;
        let allServicios = [];

        if (!sedeId) {
            window.location.href = 'listar.html';
        }

        async function loadData() {
            try {
                // Load sede details
                const sedeResult = await api.get(`/sedes/${sedeId}`);
                if (sedeResult.success) {
                    sedeData = sedeResult.data;
                    renderHeader(sedeData);
                }

                // Load document counts
                const [contratosRes, facturasRes, manifiestosRes, guiasRes] = await Promise.all([
                    api.get(`/contratos?sede=${sedeId}`),
                    api.get(`/facturas?sede=${sedeId}`),
                    api.get(`/manifiestos?sede=${sedeId}`),
                    api.get(`/guias?sede=${sedeId}`)
                ]);

                document.getElementById('countContratos').textContent = contratosRes.data?.length || 0;
                document.getElementById('countFacturas').textContent = facturasRes.data?.length || 0;
                document.getElementById('countManifiestos').textContent = manifiestosRes.data?.length || 0;
                document.getElementById('countGuias').textContent = guiasRes.data?.length || 0;

                // Load all services for this sede
                const serviciosRes = await api.get(`/servicios?sede=${sedeId}&limit=100`);
                allServicios = serviciosRes.data || [];
                renderServicios(allServicios);
                calculateDebt(allServicios);

            } catch (err) {
                console.error('Error loading data:', err);
                showToast('Error cargando datos', 'danger');
            }
        }

        function renderHeader(data) {
            document.getElementById('clientName').textContent = data.nombre_comercial;
            document.getElementById('breadcrumbName').textContent = data.nombre_comercial;

            // Better formatted empresa info
            let empresaText = data.empresa_razon_social || '-';
            if (data.empresa_ruc) {
                empresaText += ` <span class="text-muted-light">(RUC: ${data.empresa_ruc})</span>`;
            }
            document.getElementById('empresaInfo').innerHTML = empresaText;

            document.getElementById('direccionInfo').textContent =
                `${data.direccion || '-'}${data.distrito ? ', ' + data.distrito : ''}`;
            document.getElementById('contactoInfo').textContent = data.contacto_nombre || '-';
            document.getElementById('telefonoInfo').textContent = data.contacto_telefono || '-';

            document.getElementById('btnEdit').href = `formulario.html?id=${sedeId}`;

            if (data.contacto_telefono) {
                const phone = data.contacto_telefono.replace(/\D/g, '');
                document.getElementById('btnWhatsApp').href = `https://wa.me/51${phone}`;
            } else {
                document.getElementById('btnWhatsApp').style.display = 'none';
            }
        }

        function calculateDebt(servicios) {
            const debtStatus = document.getElementById('debtStatus');
            const debtTitle = document.getElementById('debtTitle');
            const debtDetail = document.getElementById('debtDetail');
            const debtAmount = document.getElementById('debtAmount');

            let totalDeuda = 0;
            let serviciosPendientes = 0;
            let diasMaxRetraso = 0;
            const today = new Date();

            servicios.forEach(s => {
                // Check if service is paid
                const tarifa = parseFloat(s.tarifa_servicio) || 0;
                const pagado = s.estado_pago === 'pagado';
                const fechaServicio = s.fecha_servicio || s.fecha_ejecucion;

                if (tarifa > 0 && !pagado && fechaServicio) {
                    totalDeuda += tarifa;
                    serviciosPendientes++;

                    // Calculate days late from service date
                    const fecha = new Date(fechaServicio);
                    const diasRetraso = Math.floor((today - fecha) / (1000 * 60 * 60 * 24));
                    if (diasRetraso > diasMaxRetraso) {
                        diasMaxRetraso = diasRetraso;
                    }
                }
            });

            if (totalDeuda > 0) {
                debtStatus.className = 'debt-status con-deuda';
                debtStatus.querySelector('.status-icon i').className = 'bi bi-exclamation-triangle-fill';
                debtTitle.textContent = 'Tiene deudas pendientes';
                debtDetail.textContent = `${serviciosPendientes} servicio${serviciosPendientes > 1 ? 's' : ''} sin pagar • ${diasMaxRetraso} días de retraso`;
                debtAmount.textContent = `S/ ${totalDeuda.toFixed(0)}`;
                debtAmount.style.display = 'block';
            } else {
                debtStatus.className = 'debt-status al-dia';
                debtStatus.querySelector('.status-icon i').className = 'bi bi-check-circle-fill';
                debtTitle.textContent = 'Al día';
                debtDetail.textContent = 'Todos los servicios están pagados';
                debtAmount.style.display = 'none';
            }
        }

        function renderServicios(servicios) {
            const tbody = document.getElementById('serviciosBody');
            if (servicios.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-3 text-muted">Sin servicios registrados</td></tr>';
                return;
            }

            // Sort by date descending - use fecha_servicio or fecha_ejecucion
            servicios.sort((a, b) => {
                const dateA = new Date(a.fecha_servicio || a.fecha_ejecucion || 0);
                const dateB = new Date(b.fecha_servicio || b.fecha_ejecucion || 0);
                return dateB - dateA;
            });

            tbody.innerHTML = servicios.map(s => {
                const tarifa = parseFloat(s.tarifa_servicio) || 0;
                const fechaServicio = s.fecha_servicio || s.fecha_ejecucion;
                let estadoPago = '';

                if (s.estado_pago === 'pagado') {
                    estadoPago = '<span class="pago-badge pago-pagado"><i class="bi bi-check-circle"></i> Pagado</span>';
                } else {
                    estadoPago = '<span class="pago-badge pago-pendiente"><i class="bi bi-clock"></i> Pendiente</span>';
                }

                return `
                <tr>
                    <td><strong>${formatDate(fechaServicio)}</strong>${s.mes_servicio ? `<br><small class="text-muted">${s.mes_servicio}</small>` : ''}</td>
                    <td>${estadoPago}</td>
                    <td>${tarifa > 0 ? `<strong>S/ ${tarifa.toFixed(0)}</strong>` : '-'}</td>
                </tr>
            `}).join('');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function goToCategory(category) {
            window.location.href = `../${category}/listar.html?sede=${sedeId}`;
        }

        loadData();
    </script>
</body>

</html>
