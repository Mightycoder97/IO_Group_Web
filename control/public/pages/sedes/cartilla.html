<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cartilla Cliente - IO Control</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
    <style>
        .client-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 1.5rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
        }

        .client-header h4 {
            margin-bottom: 0.25rem;
        }

        .client-header small {
            opacity: 0.9;
        }

        .category-card {
            text-align: center;
            padding: 2rem 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .category-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .category-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .category-count {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .category-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .category-contracts .category-icon {
            color: #1976D2;
        }

        .category-invoices .category-icon {
            color: #F57C00;
        }

        .category-manifests .category-icon {
            color: #388E3C;
        }

        .category-guides .category-icon {
            color: #7B1FA2;
        }

        .quick-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .info-row i {
            width: 20px;
        }
    </style>
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item"><a href="listar.html">Clientes</a></li>
                            <li class="breadcrumb-item active" id="breadcrumbName">Cartilla</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <a href="../alertas/index.html" class="btn btn-light alert-badge">
                        <i class="bi bi-bell"></i><span class="badge bg-danger" id="alertCount">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <!-- Client Header -->
                <div class="client-header" id="clientHeader">
                    <h4 id="clientName">Cargando...</h4>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <div class="info-row"><i class="bi bi-building"></i> <span id="empresaInfo">-</span></div>
                            <div class="info-row"><i class="bi bi-geo-alt"></i> <span id="direccionInfo">-</span></div>
                        </div>
                        <div class="col-md-6">
                            <div class="info-row"><i class="bi bi-person"></i> <span id="contactoInfo">-</span></div>
                            <div class="info-row"><i class="bi bi-telephone"></i> <span id="telefonoInfo">-</span></div>
                        </div>
                    </div>
                    <div class="quick-actions">
                        <a href="#" id="btnWhatsApp" class="btn btn-light btn-sm" target="_blank"><i
                                class="bi bi-whatsapp"></i> WhatsApp</a>
                        <a href="#" id="btnEdit" class="btn btn-outline-light btn-sm"><i class="bi bi-pencil"></i>
                            Editar</a>
                    </div>
                </div>

                <!-- Document Categories -->
                <h5 class="mb-3"><i class="bi bi-folder2-open"></i> Archivo Documentario</h5>
                <div class="row g-4 mb-4">
                    <div class="col-lg-3 col-md-6 col-6">
                        <div class="card category-card category-contracts" onclick="goToCategory('contratos')">
                            <div class="category-icon"><i class="bi bi-file-earmark-text"></i></div>
                            <div class="category-count" id="countContratos">0</div>
                            <div class="category-label">Contratos</div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 col-6">
                        <div class="card category-card category-invoices" onclick="goToCategory('facturas')">
                            <div class="category-icon"><i class="bi bi-receipt"></i></div>
                            <div class="category-count" id="countFacturas">0</div>
                            <div class="category-label">Facturas</div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 col-6">
                        <div class="card category-card category-manifests" onclick="goToCategory('manifiestos')">
                            <div class="category-icon"><i class="bi bi-journal-text"></i></div>
                            <div class="category-count" id="countManifiestos">0</div>
                            <div class="category-label">Manifiestos</div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 col-6">
                        <div class="card category-card category-guides" onclick="goToCategory('guias')">
                            <div class="category-icon"><i class="bi bi-file-earmark"></i></div>
                            <div class="category-count" id="countGuias">0</div>
                            <div class="category-label">Guías</div>
                        </div>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-clock-history"></i> Últimos Servicios
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Estado</th>
                                        <th class="hide-on-mobile">Peso (kg)</th>
                                        <th>Factura</th>
                                    </tr>
                                </thead>
                                <tbody id="serviciosBody">
                                    <tr>
                                        <td colspan="4" class="text-center py-3">Cargando...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.0"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('sedes');

        const sedeId = getUrlParam('id');
        let sedeData = null;

        if (!sedeId) {
            window.location.href = 'listar.html';
        }

        async function loadData() {
            try {
                // Load sede details
                const sedeResult = await api.get(`/sedes/${sedeId}`);
                if (sedeResult.success) {
                    sedeData = sedeResult.data;
                    renderHeader(sedeData);
                }

                // Load document counts
                const [contratosRes, facturasRes, manifiestosRes, guiasRes] = await Promise.all([
                    api.get(`/contratos?sede=${sedeId}`),
                    api.get(`/facturas?sede=${sedeId}`),
                    api.get(`/manifiestos?sede=${sedeId}`),
                    api.get(`/guias?sede=${sedeId}`)
                ]);

                document.getElementById('countContratos').textContent = contratosRes.data?.length || 0;
                document.getElementById('countFacturas').textContent = facturasRes.data?.length || 0;
                document.getElementById('countManifiestos').textContent = manifiestosRes.data?.length || 0;
                document.getElementById('countGuias').textContent = guiasRes.data?.length || 0;

                // Load recent services
                const serviciosRes = await api.get(`/servicios?sede=${sedeId}&limit=5`);
                renderServicios(serviciosRes.data || []);

            } catch (err) {
                console.error('Error loading data:', err);
                showToast('Error cargando datos', 'danger');
            }
        }

        function renderHeader(data) {
            document.getElementById('clientName').textContent = data.nombre_comercial;
            document.getElementById('breadcrumbName').textContent = data.nombre_comercial;
            document.getElementById('empresaInfo').innerHTML =
                `${data.empresa_razon_social} <small class="text-white-50">RUC: ${data.empresa_ruc || '-'}</small>`;
            document.getElementById('direccionInfo').textContent =
                `${data.direccion || '-'} ${data.distrito ? ', ' + data.distrito : ''}`;
            document.getElementById('contactoInfo').textContent = data.contacto_nombre || '-';
            document.getElementById('telefonoInfo').textContent = data.contacto_telefono || '-';

            document.getElementById('btnEdit').href = `formulario.html?id=${sedeId}`;

            if (data.contacto_telefono) {
                const phone = data.contacto_telefono.replace(/\D/g, '');
                document.getElementById('btnWhatsApp').href = `https://wa.me/51${phone}`;
            } else {
                document.getElementById('btnWhatsApp').style.display = 'none';
            }
        }

        function renderServicios(servicios) {
            const tbody = document.getElementById('serviciosBody');
            if (servicios.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-muted">Sin servicios registrados</td></tr>';
                return;
            }
            tbody.innerHTML = servicios.map(s => `
                <tr>
                    <td>${s.fecha_programada || '-'}</td>
                    <td>${getEstadoBadge(s.estado)}</td>
                    <td class="hide-on-mobile">${s.peso_kg || '-'}</td>
                    <td>${s.numero_factura || '<span class="text-muted">-</span>'}</td>
                </tr>
            `).join('');
        }

        function getEstadoBadge(estado) {
            const badges = {
                'completado': '<span class="badge bg-success">Completado</span>',
                'en_curso': '<span class="badge bg-primary">En curso</span>',
                'programado': '<span class="badge bg-info">Programado</span>',
                'cancelado': '<span class="badge bg-danger">Cancelado</span>'
            };
            return badges[estado] || `<span class="badge bg-secondary">${estado}</span>`;
        }

        function goToCategory(category) {
            window.location.href = `../${category}/listar.html?sede=${sedeId}`;
        }

        loadData();
    </script>
</body>

</html>
