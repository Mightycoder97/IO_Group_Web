<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sedes - IO Control</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/global.css?v=2.4" rel="stylesheet">
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Sedes</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <a href="../alertas/index.html" class="btn btn-light alert-badge">
                        <i class="bi bi-bell"></i><span class="badge bg-danger" id="alertCount">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" data-bs-toggle="modal"
                                    data-bs-target="#changePasswordModal"><i class="bi bi-key"></i> Cambiar
                                    Contraseña</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <div class="table-container">
                    <div class="table-header">
                        <div>
                            <h5 class="table-title mb-0"><i class="bi bi-geo-alt"></i> Sedes</h5>
                            <small class="text-muted" id="empresaFilter"></small>
                        </div>
                        <div class="d-flex gap-2 desktop-filters">
                            <input type="text" class="form-control" id="searchInput"
                                placeholder="Buscar por nombre o RUC..." style="width: 220px;">
                            <select class="form-select" id="distritoFilter" style="width: 180px;">
                                <option value="">Todos los distritos</option>
                            </select>
                        </div>
                        <!-- Mobile Filters -->
                        <div class="mobile-filters">
                            <div class="filter-row">
                                <input type="text" class="form-control form-control-sm" id="searchInputMobile"
                                    placeholder="Buscar por nombre o RUC...">
                            </div>
                            <div class="filter-row mt-2">
                                <select class="form-select form-select-sm" id="distritoFilterMobile">
                                    <option value="">Todos los distritos</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Cliente</th>
                                    <th class="hide-on-mobile">Empresa / RUC</th>
                                    <th class="hide-on-mobile">Dirección</th>
                                    <th class="hide-on-mobile">Contacto</th>
                                    <th>Estado</th>
                                    <th width="180">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="6" class="text-center py-4">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/table-sort.js"></script>
    <script src="../../js/app.js?v=2.4"></script>
    <script>
        bootControlPage('sedes');
        const canEditCurrentModule = canEditModule('sedes');
        const empresaId = getUrlParam('empresa');
        let allData = [];
        let tableSorter = null;

        // Load districts for filter
        async function loadDistritos() {
            try {
                const result = await api.get('/calendario?action=distritos');
                if (result.success) {
                    const select = document.getElementById('distritoFilter');
                    const selectMobile = document.getElementById('distritoFilterMobile');
                    result.data.forEach(d => {
                        const option = `<option value="${d.distrito}">${d.distrito} (${d.cantidad})</option>`;
                        select.innerHTML += option;
                        selectMobile.innerHTML += option;
                    });
                }
            } catch (err) {
                console.error('Error cargando distritos:', err);
            }
        }

        // Combined filter function
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const distrito = document.getElementById('distritoFilter').value;

            const filtered = allData.filter(item => {
                const matchesSearch = !searchTerm ||
                    item.nombre_comercial?.toLowerCase().includes(searchTerm) ||
                    item.direccion?.toLowerCase().includes(searchTerm) ||
                    item.empresa_razon_social?.toLowerCase().includes(searchTerm) ||
                    item.empresa_ruc?.toLowerCase().includes(searchTerm);
                const matchesDistrito = !distrito ||
                    (item.distrito && item.distrito.trim().toUpperCase() === distrito.trim().toUpperCase());
                return matchesSearch && matchesDistrito;
            });

            renderTable(filtered);
            if (tableSorter) tableSorter.setData(filtered);
        }

        async function loadData() {
            try {
                let url = '/sedes?limit=5000';
                if (empresaId) url += `&empresa=${empresaId}`;
                const result = await api.get(url);
                if (result.success) {
                    allData = result.data;
                    renderTable(allData);
                    if (empresaId && allData.length > 0) {
                        document.getElementById('empresaFilter').textContent =
                            `Filtrando por empresa: ${allData[0].empresa_razon_social}`;
                    }
                    // Inicializar ordenamiento de columnas
                    if (!tableSorter) {
                        tableSorter = new TableSort('tableBody', {
                            columns: ['nombre_comercial', 'empresa_razon_social', 'direccion', 'contacto_nombre', 'activo', null],
                            onSort: (sortedData) => renderTable(sortedData)
                        });
                    }
                    tableSorter.setData(allData);
                }
            } catch (err) {
                showToast('Error cargando datos', 'danger');
            }
        }
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No hay registros</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>
                        <strong>${item.nombre_comercial}</strong>
                        <br><small class="text-muted">${item.distrito || ''}</small>
                    </td>
                    <td class="hide-on-mobile">
                        ${item.empresa_razon_social || '-'}
                        ${item.empresa_ruc ? `<br><small class="text-muted">RUC: ${item.empresa_ruc}</small>` : ''}
                    </td>
                    <td class="hide-on-mobile">
                        <small>${item.direccion || '-'}</small>
                    </td>
                    <td class="hide-on-mobile">
                        <small>${item.contacto_nombre || '-'}</small>
                        ${item.contacto_telefono ? `<br><small class="text-muted">${item.contacto_telefono}</small>` : ''}
                    </td>
                    <td>${item.activo ? '<span class="badge bg-success">Activo</span>' : '<span class="badge bg-secondary">Inactivo</span>'}</td>
                    <td>
                        <a href="cartilla.html?id=${item.id_sede}" class="btn btn-sm btn-primary btn-action" title="Ver Cartilla"><i class="bi bi-folder2-open"></i></a>
                        ${canEditCurrentModule ? `<a href="formulario.html?id=${item.id_sede}" class="btn btn-sm btn-outline-secondary btn-action" title="Editar"><i class="bi bi-pencil"></i></a>` : ''}
                        ${item.contacto_telefono ? `<a href="https://wa.me/51${item.contacto_telefono.replace(/\\D/g, '')}" target="_blank" class="btn btn-sm btn-outline-success btn-action" title="WhatsApp"><i class="bi bi-whatsapp"></i></a>` : ''}
                    </td>
                </tr>
            `).join('');
        }
        document.getElementById('searchInput').addEventListener('input', function (e) {
            document.getElementById('searchInputMobile').value = this.value;
            applyFilters();
        });

        // District filter change handlers
        document.getElementById('distritoFilter').addEventListener('change', function () {
            document.getElementById('distritoFilterMobile').value = this.value;
            applyFilters();
        });

        document.getElementById('distritoFilterMobile').addEventListener('change', function () {
            document.getElementById('distritoFilter').value = this.value;
            applyFilters();
        });

        async function deleteItem(id) {
            if (!confirmDelete()) return;
            try {
                const result = await api.delete(`/sedes/${id}`);
                if (result.success) {
                    showToast('Sede eliminada');
                    loadData();
                } else {
                    showToast(result.message, 'danger');
                }
            } catch (err) {
                showToast('Error eliminando', 'danger');
            }
        }

        // Initialize page
        loadData();
        loadDistritos();

        // Mobile search filter sync
        document.getElementById('searchInputMobile').addEventListener('input', function (e) {
            document.getElementById('searchInput').value = this.value;
            applyFilters();
        });
    </script>
</body>

</html>
