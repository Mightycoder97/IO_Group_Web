<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6MBEGPZ5TK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-6MBEGPZ5TK');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dashboard - IO Control</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

</head>

<body class="control-app">
    <div class="app-container">
        <!-- Sidebar (populated dynamically) -->
        <aside class="sidebar" id="sidebar"></aside>
        <!-- Main Content -->
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()">
                        <i class="bi bi-list"></i>
                    </button>
                    <h4 class="mb-0 ms-2">Dashboard</h4>
                </div>
                <div class="user-menu">
                    <a href="alertas/index.html" class="btn btn-light alert-badge">
                        <i class="bi bi-bell"></i>
                        <span class="badge bg-danger" id="alertCount">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i>
                            <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <!-- KPI Row 1 -->
                <div class="row g-3 mb-4">
                    <div class="col-lg-2 col-md-4 col-6">
                        <div class="card kpi-card h-100">
                            <div class="card-body d-flex align-items-center">
                                <div class="kpi-icon bg-primary bg-opacity-10 text-primary me-3">
                                    <i class="bi bi-geo-alt-fill"></i>
                                </div>
                                <div>
                                    <div class="kpi-value text-primary" id="kpiSedesActivas">--</div>
                                    <div class="kpi-label">Clientes Activos</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-2 col-md-4 col-6">
                        <div class="card kpi-card h-100">
                            <div class="card-body d-flex align-items-center">
                                <div class="kpi-icon bg-success bg-opacity-10 text-success me-3">
                                    <i class="bi bi-check-circle-fill"></i>
                                </div>
                                <div>
                                    <div class="kpi-value text-success" id="kpiPorcentajeServicio">--%</div>
                                    <div class="kpi-label">Servicios del Mes</div>
                                    <small class="text-muted" id="kpiSedesServicio"></small>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-2 col-md-4 col-6">
                        <div class="card kpi-card h-100">
                            <div class="card-body d-flex align-items-center">
                                <div class="kpi-icon bg-info bg-opacity-10 text-info me-3">
                                    <i class="bi bi-currency-dollar"></i>
                                </div>
                                <div>
                                    <div class="kpi-value text-info" id="kpiIngresosMes">S/ --</div>
                                    <div class="kpi-label">Ingresos del Mes</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-2 col-md-4 col-6">
                        <div class="card kpi-card h-100">
                            <div class="card-body d-flex align-items-center">
                                <div class="kpi-icon bg-warning bg-opacity-10 text-warning me-3">
                                    <i class="bi bi-exclamation-triangle-fill"></i>
                                </div>
                                <div>
                                    <div class="kpi-value text-warning" id="kpiClientesPendientes">--</div>
                                    <div class="kpi-label">Pagos Pendientes</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-2 col-md-4 col-6">
                        <div class="card kpi-card h-100">
                            <div class="card-body d-flex align-items-center">
                                <div class="kpi-icon bg-danger bg-opacity-10 text-danger me-3">
                                    <i class="bi bi-cash-stack"></i>
                                </div>
                                <div>
                                    <div class="kpi-value text-danger" id="kpiMontoPendiente">S/ --</div>
                                    <div class="kpi-label">Monto Pendiente</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-2 col-md-4 col-6">
                        <div class="card kpi-card h-100">
                            <div class="card-body d-flex align-items-center">
                                <div class="kpi-icon bg-secondary bg-opacity-10 text-secondary me-3">
                                    <i class="bi bi-truck"></i>
                                </div>
                                <div>
                                    <div class="kpi-value text-secondary" id="kpiRutasMes">--</div>
                                    <div class="kpi-label">Rutas del Mes</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Chart Row -->
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-bar-chart-fill text-primary"></i> Facturación Últimos 12
                                    Meses</span>
                                <span class="badge bg-success" id="totalAnual">S/ 0.00</span>
                            </div>
                            <div class="card-body">
                                <div class="chart-container">
                                    <canvas id="chartFacturacion"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js?v=2.0"></script>
    <script>
        // Populate sidebar dynamically based on permissions
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('dashboard');
        let facturaChart = null;
        async function loadDashboard() {
            try {
                const result = await api.get('/reportes?action=dashboard');
                if (result.success) {
                    const data = result.data;
                    // KPIs
                    document.getElementById('kpiSedesActivas').textContent = data.sedes_activas;
                    document.getElementById('kpiPorcentajeServicio').textContent = data.porcentaje_servicio + '%';
                    document.getElementById('kpiSedesServicio').textContent =
                        `${data.sedes_con_servicio} de ${data.sedes_activas} sedes`;
                    document.getElementById('kpiIngresosMes').textContent =
                        'S/ ' + (data.ingresos_mes || 0).toLocaleString('es-PE', { minimumFractionDigits: 2 });
                    document.getElementById('kpiClientesPendientes').textContent = data.empresas_pendientes;
                    document.getElementById('kpiMontoPendiente').textContent =
                        'S/ ' + data.monto_pendiente.toLocaleString('es-PE', { minimumFractionDigits: 2 });
                    document.getElementById('kpiRutasMes').textContent = data.rutas_mes || 0;
                    // Chart
                    renderChart(data.facturacion_12_meses);
                }
            } catch (err) {
                console.error('Error loading dashboard:', err);
            }
        }
        function renderChart(facturacionData) {
            const ctx = document.getElementById('chartFacturacion').getContext('2d');
            // Preparar datos
            const labels = facturacionData.map(d => d.mes_label || d.mes);
            const valores = facturacionData.map(d => parseFloat(d.total));
            const total = valores.reduce((a, b) => a + b, 0);
            document.getElementById('totalAnual').textContent =
                'Total: S/ ' + total.toLocaleString('es-PE', { minimumFractionDigits: 2 });
            if (facturaChart) facturaChart.destroy();
            facturaChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Facturación (S/)',
                        data: valores,
                        backgroundColor: 'rgba(27, 94, 32, 0.7)',
                        borderColor: 'rgba(27, 94, 32, 1)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => 'S/ ' + ctx.raw.toLocaleString('es-PE', { minimumFractionDigits: 2 })
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: (value) => 'S/ ' + value.toLocaleString()
                            }
                        }
                    }
                }
            });
        }
        // Load on start
        loadDashboard();
    </script>
</body>

</html>
