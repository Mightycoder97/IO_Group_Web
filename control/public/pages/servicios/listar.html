<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Servicios - IO Control</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
    <style>
        .table th {
            white-space: nowrap;
            font-size: 0.75rem;
            padding: 0.4rem 0.3rem;
        }

        .table td {
            font-size: 0.8rem;
            vertical-align: middle;
            white-space: nowrap;
            padding: 0.35rem 0.3rem;
        }

        /* Sortable headers */
        .sortable {
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        .sortable:hover {
            background-color: #e9ecef;
        }

        .sortable .sort-icon {
            opacity: 0.3;
            margin-left: 4px;
            font-size: 0.7rem;
        }

        .sortable.active .sort-icon {
            opacity: 1;
            color: #1B5E20;
        }

        .sortable.asc .sort-icon::before {
            content: "▲";
        }

        .sortable.desc .sort-icon::before {
            content: "▼";
        }

        .sortable:not(.asc):not(.desc) .sort-icon::before {
            content: "▲▼";
            font-size: 0.55rem;
            letter-spacing: -2px;
        }

        /* Compact column widths */
        .col-cliente {
            min-width: 140px;
            max-width: 180px;
        }

        .col-mes {
            width: 70px;
        }

        .col-fecha {
            width: 85px;
        }

        .col-tarifa {
            width: 70px;
        }

        .col-pago {
            width: 70px;
        }

        .col-factura {
            width: 80px;
        }

        .col-manifiesto {
            width: 80px;
        }

        .col-guia {
            width: 80px;
        }

        .col-peso {
            width: 55px;
        }

        .col-accion {
            width: 60px;
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #6c757d #e9ecef;
        }

        .table-responsive::-webkit-scrollbar {
            height: 8px;
        }

        .table-responsive::-webkit-scrollbar-track {
            background: #e9ecef;
            border-radius: 4px;
        }

        .table-responsive::-webkit-scrollbar-thumb {
            background: #6c757d;
            border-radius: 4px;
        }

        .table-responsive::-webkit-scrollbar-thumb:hover {
            background: #495057;
        }

        .badge-pago {
            font-size: 0.7rem;
        }

        .scroll-hint {
            display: block;
            text-align: center;
            padding: 8px;
            background: linear-gradient(90deg, #fff3cd 0%, #ffe69c 50%, #fff3cd 100%);
            font-size: 0.8rem;
            color: #664d03;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        @media (min-width: 1400px) {
            .scroll-hint {
                display: none;
            }
        }
    </style>
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Servicios</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <a href="../alertas/index.html" class="btn btn-light alert-badge">
                        <i class="bi bi-bell"></i><span class="badge bg-danger" id="alertCount">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" data-bs-toggle="modal"
                                    data-bs-target="#changePasswordModal"><i class="bi bi-key"></i> Cambiar
                                    Contraseña</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <!-- Filters -->
                <div class="card mb-3">
                    <div class="card-body py-2">
                        <div class="row g-2 align-items-end">
                            <div class="col-auto">
                                <input type="text" class="form-control form-control-sm" id="searchInput"
                                    placeholder="Buscar por nombre o RUC..." style="width: 200px;">
                            </div>
                            <div class="col-auto">
                                <select class="form-select form-select-sm" id="filterEstadoPago" style="width: 130px;">
                                    <option value="">Estado pago</option>
                                    <option value="pendiente">Pendiente</option>
                                    <option value="pagado">Pagado</option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <input type="month" class="form-control form-control-sm" id="filterMes"
                                    style="width: 150px;">
                            </div>
                            <div class="col-auto">
                                <button class="btn btn-sm btn-primary" onclick="loadData()"><i
                                        class="bi bi-search"></i></button>
                                <button class="btn btn-sm btn-secondary" onclick="clearFilters()"><i
                                        class="bi bi-x"></i></button>
                            </div>
                            <div class="col-auto ms-auto">
                                <a href="formulario.html" class="btn btn-primary btn-sm" id="btnNew"><i
                                        class="bi bi-plus"></i> Nuevo</a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="scroll-hint"><i class="bi bi-arrows-expand"></i> Desliza horizontalmente para ver más
                    columnas</div>

                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm">
                            <thead class="table-light">
                                <tr>
                                    <th class="col-cliente sortable" data-sort="sede_nombre"
                                        onclick="sortColumn('sede_nombre')">
                                        Cliente <span class="sort-icon"></span>
                                    </th>
                                    <th class="col-mes sortable" data-sort="mes_servicio"
                                        onclick="sortColumn('mes_servicio')">
                                        Mes <span class="sort-icon"></span>
                                    </th>
                                    <th class="col-fecha sortable active desc" data-sort="fecha_servicio"
                                        onclick="sortColumn('fecha_servicio')">
                                        Fecha <span class="sort-icon"></span>
                                    </th>
                                    <th class="col-tarifa sortable" data-sort="tarifa_servicio"
                                        onclick="sortColumn('tarifa_servicio')">
                                        Tarifa <span class="sort-icon"></span>
                                    </th>
                                    <th class="col-pago sortable" data-sort="estado_pago"
                                        onclick="sortColumn('estado_pago')">
                                        Pago <span class="sort-icon"></span>
                                    </th>
                                    <th class="col-factura">Factura</th>
                                    <th class="col-manifiesto">Manifiesto</th>
                                    <th class="col-guia">Guía</th>
                                    <th class="col-peso sortable" data-sort="peso_residuo"
                                        onclick="sortColumn('peso_residuo')">
                                        Peso <span class="sort-icon"></span>
                                    </th>
                                    <th class="col-accion">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="10" class="text-center py-4">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <nav aria-label="Page navigation" class="mt-3">
                <ul class="pagination justify-content-center" id="pagination">
                    <!-- Pagination items will be generated here -->
                </ul>
            </nav>
    </div>
    </main>
    </div>
    <!-- FAB for mobile -->
    <a href="formulario.html" class="fab" id="fabNew" aria-label="Nuevo Servicio">
        <i class="bi bi-plus"></i>
    </a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.0"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('servicios');
        if (!canEdit()) document.getElementById('btnNew').style.display = 'none';
        let allData = { data: [], total: 0, page: 1, limit: 10 };
        let currentPage = 1;
        let currentSort = { column: 'fecha_servicio', direction: 'desc' };

        async function loadData(page = 1) {
            currentPage = page;
            const search = document.getElementById('searchInput').value.toLowerCase();
            const estadoPago = document.getElementById('filterEstadoPago').value;
            const mes = document.getElementById('filterMes').value;

            try {
                let url = `/servicios?page=${page}&limit=10`;
                url += `&sort=${currentSort.column}&order=${currentSort.direction}`;
                if (search) url += `&busqueda=${encodeURIComponent(search)}`;
                if (estadoPago) url += `&estado_pago=${estadoPago}`;
                if (mes) {
                    const [year, month] = mes.split('-');
                    const firstDay = `${year}-${month}-01`;
                    const lastDayDate = new Date(year, month, 0);
                    const lastDay = `${year}-${month}-${lastDayDate.getDate()}`;
                    url += `&fecha_desde=${firstDay}&fecha_hasta=${lastDay}`;
                }

                const result = await api.get(url);
                if (result.success) {
                    allData = result;

                    // Client-side search as additional filtering
                    let filteredData = result.data;
                    if (search) {
                        filteredData = filteredData.filter(item =>
                            (item.sede_nombre || '').toLowerCase().includes(search) ||
                            (item.empresa_razon_social || '').toLowerCase().includes(search)
                        );
                    }

                    // Client-side sorting as fallback if API doesn't support it
                    let sortedData = sortDataArray(filteredData, currentSort.column, currentSort.direction);

                    renderTable(sortedData);
                }
            } catch (err) {
                console.error(err);
                showToast('Error cargando datos', 'danger');
            }
        }

        // Sort data array
        function sortDataArray(data, column, direction) {
            return data.sort((a, b) => {
                let valA = a[column];
                let valB = b[column];

                // Handle nulls
                if (valA === null || valA === undefined) valA = '';
                if (valB === null || valB === undefined) valB = '';

                // Handle dates
                if (column === 'fecha_servicio' || column === 'mes_servicio') {
                    valA = valA ? new Date(valA) : new Date(0);
                    valB = valB ? new Date(valB) : new Date(0);
                }
                // Handle numbers
                else if (column === 'tarifa_servicio' || column === 'peso_residuo') {
                    valA = parseFloat(valA) || 0;
                    valB = parseFloat(valB) || 0;
                }
                // Handle strings
                else {
                    valA = String(valA).toLowerCase();
                    valB = String(valB).toLowerCase();
                }

                let comparison = 0;
                if (valA > valB) comparison = 1;
                else if (valA < valB) comparison = -1;

                return direction === 'desc' ? -comparison : comparison;
            });
        }

        // Handle column sort click
        function sortColumn(column) {
            const headers = document.querySelectorAll('.sortable');

            // Toggle direction if same column, otherwise default to desc for dates/numbers
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                // Default direction based on column type
                if (column === 'sede_nombre' || column === 'estado_pago') {
                    currentSort.direction = 'asc';
                } else {
                    currentSort.direction = 'desc';
                }
            }

            // Update header classes
            headers.forEach(h => {
                h.classList.remove('active', 'asc', 'desc');
                if (h.dataset.sort === column) {
                    h.classList.add('active', currentSort.direction);
                }
            });

            // Reload data with new sort
            loadData(currentPage);
        }

        function renderPagination(total, page, limit) {
            const totalPages = Math.ceil(total / limit);
            const paginationEl = document.getElementById('pagination');
            let html = '';

            // Previous
            html += `<li class="page-item ${page <= 1 ? 'disabled' : ''}">
                        <a class="page-link" href="#" onclick="loadData(${page - 1}); return false;">Anterior</a>
                     </li>`;

            // Pages
            // Show limited range of pages
            const startPage = Math.max(1, page - 2);
            const endPage = Math.min(totalPages, page + 2);

            if (startPage > 1) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="loadData(1); return false;">1</a></li>`;
                if (startPage > 2) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<li class="page-item ${i === page ? 'active' : ''}">
                            <a class="page-link" href="#" onclick="loadData(${i}); return false;">${i}</a>
                         </li>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                html += `<li class="page-item"><a class="page-link" href="#" onclick="loadData(${totalPages}); return false;">${totalPages}</a></li>`;
            }

            // Next
            html += `<li class="page-item ${page >= totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="#" onclick="loadData(${page + 1}); return false;">Siguiente</a>
                     </li>`;

            paginationEl.innerHTML = html;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleDateString('es-PE');
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center py-4 text-muted">No hay registros</td></tr>';
                renderPagination(0, 1, 10);
                return;
            }

            // Paginación
            renderPagination(allData.total, allData.page, allData.limit);

            tbody.innerHTML = data.map(s => {
                const tarifa = parseFloat(s.tarifa_servicio || 0);
                const isPagado = s.estado_pago === 'pagado';

                return `
                <tr>
                    <td class="col-cliente" title="${s.sede_nombre || ''}"><strong>${s.sede_nombre || '-'}</strong></td>
                    <td class="col-mes">${s.mes_servicio || '-'}</td>
                    <td class="col-fecha">${formatDate(s.fecha_servicio)}</td>
                    <td class="col-tarifa"><strong>S/${tarifa.toFixed(0)}</strong></td>
                    <td class="col-pago">
                        ${isPagado
                        ? '<span class="badge bg-success badge-pago">Pagado</span>'
                        : '<span class="badge bg-warning text-dark badge-pago">Pend.</span>'}
                    </td>
                    <td class="col-factura">${s.numero_factura || '-'}</td>
                    <td class="col-manifiesto">${s.numero_manifiesto || '-'}</td>
                    <td class="col-guia">${s.numero_guia || '-'}</td>
                    <td class="col-peso">${s.peso_residuo ? s.peso_residuo + 'kg' : '-'}</td>
                    <td class="col-accion">
                        <a href="formulario.html?id=${s.id_servicio}" class="btn btn-sm btn-outline-primary p-1" title="Editar"><i class="bi bi-pencil"></i></a>
                        ${!isPagado && canEdit() ? `<button class="btn btn-sm btn-success p-1" onclick="marcarPagado(${s.id_servicio})" title="Marcar pagado"><i class="bi bi-check"></i></button>` : ''}
                    </td>
                </tr>
            `}).join('');
        }

        async function marcarPagado(id) {
            const fecha = new Date().toISOString().split('T')[0];
            try {
                const result = await api.put(`/servicios/${id}`, {
                    estado_pago: 'pagado',
                    fecha_pago: fecha
                });
                if (result.success) {
                    showToast('Marcado como pagado');
                    loadData();
                } else {
                    showToast(result.message || 'Error', 'danger');
                }
            } catch (err) {
                showToast('Error', 'danger');
            }
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterEstadoPago').value = '';
            document.getElementById('filterMes').value = '';
            // Reset to default sort
            currentSort = { column: 'fecha_servicio', direction: 'desc' };
            const headers = document.querySelectorAll('.sortable');
            headers.forEach(h => {
                h.classList.remove('active', 'asc', 'desc');
                if (h.dataset.sort === 'fecha_servicio') {
                    h.classList.add('active', 'desc');
                }
            });
            loadData();
        }

        loadData();
    </script>
</body>

</html>
