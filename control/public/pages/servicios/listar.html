<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Servicios - IO Control</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
    <style>
        .table th {
            white-space: nowrap;
            font-size: 0.8rem;
        }

        .table td {
            font-size: 0.85rem;
            vertical-align: middle;
        }

        .badge-pago {
            font-size: 0.7rem;
        }

        .scroll-hint {
            display: none;
        }

        @media (max-width: 768px) {
            .scroll-hint {
                display: block;
                text-align: center;
                padding: 5px;
                background: #fff3cd;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Servicios</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <a href="../alertas/index.html" class="btn btn-light alert-badge">
                        <i class="bi bi-bell"></i><span class="badge bg-danger" id="alertCount">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <!-- Filters -->
                <div class="card mb-3">
                    <div class="card-body py-2">
                        <div class="row g-2 align-items-end">
                            <div class="col-auto">
                                <input type="text" class="form-control form-control-sm" id="searchInput"
                                    placeholder="Buscar cliente..." style="width: 180px;">
                            </div>
                            <div class="col-auto">
                                <select class="form-select form-select-sm" id="filterEstadoPago" style="width: 130px;">
                                    <option value="">Estado pago</option>
                                    <option value="pendiente">Pendiente</option>
                                    <option value="pagado">Pagado</option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <input type="month" class="form-control form-control-sm" id="filterMes"
                                    style="width: 150px;">
                            </div>
                            <div class="col-auto">
                                <button class="btn btn-sm btn-primary" onclick="loadData()"><i
                                        class="bi bi-search"></i></button>
                                <button class="btn btn-sm btn-secondary" onclick="clearFilters()"><i
                                        class="bi bi-x"></i></button>
                            </div>
                            <div class="col-auto ms-auto">
                                <a href="formulario.html" class="btn btn-primary btn-sm" id="btnNew"><i
                                        class="bi bi-plus"></i> Nuevo</a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="scroll-hint"><i class="bi bi-arrows-expand"></i> Desliza horizontalmente para ver más
                    columnas</div>

                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Cliente</th>
                                    <th>Mes</th>
                                    <th>Fecha Servicio</th>
                                    <th>Tarifa</th>
                                    <th>Estado Pago</th>
                                    <th>Fecha Pago</th>
                                    <th>Forma Pago</th>
                                    <th>Nº Factura</th>
                                    <th>Nº Contrato</th>
                                    <th>Nº Manifiesto</th>
                                    <th>Nº Guía</th>
                                    <th>Peso (Kg)</th>
                                    <th>Desc. Residuo</th>
                                    <th>Observación</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="15" class="text-center py-4">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- FAB for mobile -->
    <a href="formulario.html" class="fab" id="fabNew" aria-label="Nuevo Servicio">
        <i class="bi bi-plus"></i>
    </a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.0"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('servicios');
        if (!canEdit()) document.getElementById('btnNew').style.display = 'none';
        let allData = [];

        async function loadData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const estadoPago = document.getElementById('filterEstadoPago').value;
            const mes = document.getElementById('filterMes').value;

            try {
                const result = await api.get('/servicios?limit=500');
                if (result.success) {
                    allData = result.data;

                    // Client-side filtering
                    let data = allData;
                    if (search) {
                        data = data.filter(s =>
                            s.sede_nombre?.toLowerCase().includes(search) ||
                            s.empresa_razon_social?.toLowerCase().includes(search)
                        );
                    }
                    if (estadoPago) {
                        data = data.filter(s => (s.estado_pago || 'pendiente') === estadoPago);
                    }
                    if (mes) {
                        data = data.filter(s => s.fecha_servicio?.startsWith(mes));
                    }

                    renderTable(data);
                }
            } catch (err) {
                showToast('Error cargando datos', 'danger');
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleDateString('es-PE');
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="15" class="text-center py-4 text-muted">No hay registros</td></tr>';
                return;
            }

            // Sort by date descending
            data.sort((a, b) => new Date(b.fecha_servicio) - new Date(a.fecha_servicio));

            tbody.innerHTML = data.map(s => {
                const tarifa = parseFloat(s.tarifa_servicio || 0);
                const isPagado = s.estado_pago === 'pagado';

                return `
                <tr>
                    <td><strong>${s.sede_nombre || '-'}</strong></td>
                    <td>${s.mes_servicio || '-'}</td>
                    <td>${formatDate(s.fecha_servicio)}</td>
                    <td><strong>S/ ${tarifa.toFixed(0)}</strong></td>
                    <td>
                        ${isPagado
                        ? '<span class="badge bg-success badge-pago">Pagado</span>'
                        : '<span class="badge bg-warning text-dark badge-pago">Pendiente</span>'}
                    </td>
                    <td>${s.fecha_pago ? formatDate(s.fecha_pago) : '-'}</td>
                    <td>${s.forma_pago || '-'}</td>
                    <td>${s.numero_factura || '-'}</td>
                    <td>${s.numero_contrato || '-'}</td>
                    <td>${s.numero_manifiesto || '-'}</td>
                    <td>${s.numero_guia || '-'}</td>
                    <td>${s.peso_residuo ? s.peso_residuo + ' kg' : '-'}</td>
                    <td>${s.descripcion_residuo || '-'}</td>
                    <td title="${s.observaciones || ''}">${s.observaciones ? s.observaciones.substring(0, 20) + '...' : '-'}</td>
                    <td>
                        <a href="formulario.html?id=${s.id_servicio}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil"></i></a>
                        ${!isPagado && canEdit() ? `<button class="btn btn-sm btn-success" onclick="marcarPagado(${s.id_servicio})" title="Marcar pagado"><i class="bi bi-check"></i></button>` : ''}
                    </td>
                </tr>
            `}).join('');
        }

        async function marcarPagado(id) {
            const fecha = new Date().toISOString().split('T')[0];
            try {
                const result = await api.put(`/servicios/${id}`, {
                    estado_pago: 'pagado',
                    fecha_pago: fecha
                });
                if (result.success) {
                    showToast('Marcado como pagado');
                    loadData();
                } else {
                    showToast(result.message || 'Error', 'danger');
                }
            } catch (err) {
                showToast('Error', 'danger');
            }
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterEstadoPago').value = '';
            document.getElementById('filterMes').value = '';
            loadData();
        }

        loadData();
    </script>
</body>

</html>
