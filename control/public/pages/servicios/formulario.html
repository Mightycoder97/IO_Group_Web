<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <title>Servicio - IO Group</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/global.css?v=2.5" rel="stylesheet">
</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item"><a href="listar.html">Servicios</a></li>
                            <li class="breadcrumb-item active" id="pageTitle">Nuevo Servicio</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" data-bs-toggle="modal"
                                    data-bs-target="#changePasswordModal"><i class="bi bi-key"></i> Cambiar
                                    Contraseña</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>

            <div class="content-area">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-tools"></i> <span id="formTitle">Nuevo Servicio</span>
                    </div>
                    <div class="card-body">
                        <form id="dataForm">
                            <div class="row g-3">

                                <!-- Sección: Información General -->
                                <div class="col-12">
                                    <h6 class="text-primary border-bottom pb-2"><i
                                            class="bi bi-info-circle me-1"></i>Información General</h6>
                                </div>

                                <!-- Sede search -->
                                <div class="col-md-6">
                                    <label class="form-label">Sede / Cliente <span class="text-danger">*</span></label>
                                    <div class="position-relative">
                                        <input type="text" class="form-control" id="sedeSearch"
                                            placeholder="Buscar por nombre comercial, RUC..." autocomplete="off">
                                        <div id="sedeDropdown"
                                            style="display:none; position:absolute; top:100%; left:0; right:0; z-index:1000; background:white; border:1px solid #dee2e6; border-radius:4px; max-height:200px; overflow-y:auto; box-shadow:0 4px 6px rgba(0,0,0,.1);">
                                        </div>
                                    </div>
                                    <input type="hidden" id="id_sede" required>
                                    <div id="sedeSelected" class="mt-1 small text-success fw-bold"></div>
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label">Planta <span class="text-danger">*</span></label>
                                    <select class="form-select" id="id_planta" required>
                                        <option value="">Seleccione Planta...</option>
                                    </select>
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label">Mes Servicio</label>
                                    <input type="month" class="form-control" id="mes_servicio">
                                </div>

                                <!-- Fechas y horas -->
                                <div class="col-12 mt-2">
                                    <h6 class="text-primary border-bottom pb-2"><i
                                            class="bi bi-calendar3 me-1"></i>Fechas y Horario</h6>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">Fecha Ejecución <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="fecha_ejecucion" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Ruta Asignada</label>
                                    <select class="form-select" id="id_ruta">
                                        <option value="">Sin Ruta</option>
                                    </select>
                                </div>

                                <!-- Estados -->
                                <div class="col-12 mt-2">
                                    <h6 class="text-primary border-bottom pb-2"><i class="bi bi-toggles me-1"></i>Estado
                                        y Pago</h6>
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label">Estado Servicio</label>
                                    <select class="form-select" id="estado">
                                        <option value="programado">Programado</option>
                                        <option value="en_curso">En Curso</option>
                                        <option value="completado">Completado</option>
                                        <option value="cancelado">Cancelado</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Estado Pago</label>
                                    <select class="form-select" id="estado_pago">
                                        <option value="pendiente">Pendiente</option>
                                        <option value="pagado">Pagado</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Forma de Pago</label>
                                    <select class="form-select" id="forma_pago">
                                        <option value="">-</option>
                                        <option value="efectivo">Efectivo</option>
                                        <option value="transferencia">Transferencia</option>
                                        <option value="cheque">Cheque</option>
                                        <option value="credito">Crédito</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Fecha Pago</label>
                                    <input type="date" class="form-control" id="fecha_pago">
                                </div>

                                <!-- Empleados -->
                                <div class="col-12 mt-2">
                                    <h6 class="text-primary border-bottom pb-2"><i
                                            class="bi bi-people me-1"></i>Personal Asignado</h6>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">Chofer</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                        <select class="form-select" id="id_chofer">
                                            <option value="">Sin asignar</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Ayudante</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <select class="form-select" id="id_ayudante">
                                            <option value="">Sin asignar</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Residuos -->
                                <div class="col-12 mt-2">
                                    <h6 class="text-primary border-bottom pb-2"><i
                                            class="bi bi-recycle me-1"></i>Detalle de Residuos</h6>
                                </div>

                                <div class="col-md-9">
                                    <label class="form-label">Descripción del Residuo</label>
                                    <select class="form-select" id="residuo">
                                        <option value="">Selecciones...</option>
                                        <option value="BIOCONTAMINADO">BIOCONTAMINADO</option>
                                        <option value="ESPECIAL">ESPECIAL</option>
                                        <option value="ANIMAL CONTAMINADO">ANIMAL CONTAMINADO</option>
                                        <option value="MERMA Y/O DESMEDRO">MERMA Y/O DESMEDRO</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Peso (Kg)</label>
                                    <input type="number" step="0.01" class="form-control" id="peso_kg"
                                        placeholder="0.00">
                                </div>

                                <div class="col-12 mt-2">
                                    <label class="form-label">Observaciones</label>
                                    <textarea class="form-control" id="observaciones" rows="2"
                                        placeholder="Observaciones adicionales..."></textarea>
                                </div>

                                <!-- Documentos (solo en edición) -->
                                <div class="col-12 mt-2" id="seccionDocumentos" style="display:none;">
                                    <h6 class="text-primary border-bottom pb-2"><i
                                            class="bi bi-file-earmark-text me-1"></i>Documentos Asociados</h6>
                                </div>

                                <div class="col-md-4" id="campoManifiesto" style="display:none;">
                                    <label class="form-label">Manifiesto</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="numero_manifiesto"
                                            placeholder="N° Manifiesto">
                                        <button class="btn btn-outline-secondary" type="button"
                                            onclick="goToManifiesto()"><i class="bi bi-eye"></i></button>
                                    </div>
                                    <input type="hidden" id="id_manifiesto">
                                    <input type="file" class="form-control form-control-sm mt-2" id="pdf_manifiesto"
                                        accept=".pdf,application/pdf">
                                    <div class="small mt-1" id="pdfStatus_manifiesto"></div>
                                </div>
                                <div class="col-md-4" id="campoGuia" style="display:none;">
                                    <label class="form-label">Guía Remisión</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="numero_guia" placeholder="N° Guía">
                                        <button class="btn btn-outline-secondary" type="button" onclick="goToGuia()"><i
                                                class="bi bi-eye"></i></button>
                                    </div>
                                    <input type="hidden" id="id_guia">
                                    <input type="file" class="form-control form-control-sm mt-2" id="pdf_guia"
                                        accept=".pdf,application/pdf">
                                    <div class="small mt-1" id="pdfStatus_guia"></div>
                                </div>
                                <div class="col-md-4" id="campoFactura" style="display:none;">
                                    <label class="form-label">Factura</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="numero_factura"
                                            placeholder="N° Factura">
                                        <button class="btn btn-outline-secondary" type="button"
                                            onclick="goToFactura()"><i class="bi bi-eye"></i></button>
                                    </div>
                                    <input type="hidden" id="id_factura">
                                    <input type="file" class="form-control form-control-sm mt-2" id="pdf_factura"
                                        accept=".pdf,application/pdf">
                                    <div class="small mt-1" id="pdfStatus_factura"></div>
                                </div>

                            </div>

                            <div class="mt-4 d-flex gap-2">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i>
                                    Guardar</button>
                                <a href="listar.html" class="btn btn-secondary" id="btnCancel">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.5"></script>
    <script>
        bootControlPage('rutas');

        const id = getUrlParam('id');
        let allSedes = [];
        const documentTypes = ['manifiesto', 'guia', 'factura'];

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function setSelectValue(selectId, value, fallbackLabel) {
            if (!value) return;
            const select = document.getElementById(selectId);
            const valueStr = String(value);
            if (![...select.options].some(opt => String(opt.value) === valueStr)) {
                const label = fallbackLabel || `Empleado #${valueStr}`;
                select.innerHTML += `<option value="${escapeHtml(valueStr)}">${escapeHtml(label)}</option>`;
            }
            select.value = valueStr;
        }

        function employeeLabel(emp, fallbackLabel) {
            return emp?.nombre_completo ||
                [emp?.nombres, emp?.apellidos].filter(Boolean).join(' ') ||
                fallbackLabel || '';
        }

        function pdfUrl(path) {
            if (!path) return '#';
            if (/^(https?:)?\/\//i.test(path) || path.startsWith('/')) return path;
            return `${getBasePath().replace(/\/public$/, '')}/${path.replace(/^\/+/, '')}`;
        }

        function renderPdfStatus(tipo, path) {
            const status = document.getElementById(`pdfStatus_${tipo}`);
            if (!status) return;
            if (path) {
                status.innerHTML = `<a href="${escapeHtml(pdfUrl(path))}" target="_blank" class="text-success">
                    <i class="bi bi-file-earmark-pdf"></i> Ver PDF actual
                </a>`;
            } else {
                status.innerHTML = '<span class="text-muted">Sin PDF</span>';
            }
        }

        if (id) {
            document.getElementById('pageTitle').textContent = 'Editar Servicio';
            document.getElementById('formTitle').textContent = 'Editar Servicio #' + id;
            // Show document section in edit mode
            document.getElementById('seccionDocumentos').style.display = '';
            document.getElementById('campoManifiesto').style.display = '';
            document.getElementById('campoGuia').style.display = '';
            document.getElementById('campoFactura').style.display = '';
            // No permitir editar la ruta desde el formulario de servicio
            document.getElementById('id_ruta').disabled = true;
        } else {
            document.getElementById('fecha_ejecucion').valueAsDate = new Date();
            // Default mes_servicio to current month
            const now = new Date();
            document.getElementById('mes_servicio').value =
                `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        }

        // ── Sede search ──────────────────────────────
        const sedeSearch = document.getElementById('sedeSearch');
        const sedeDropdown = document.getElementById('sedeDropdown');

        sedeSearch.addEventListener('input', debounce(async function () {
            const term = this.value.trim();
            if (term.length < 2) { sedeDropdown.style.display = 'none'; return; }
            try {
                const res = await api.get(`/sedes?search=${encodeURIComponent(term)}&limit=20`, { cache: false });
                if (res.success) {
                    renderSedeDropdown(res.data);
                }
            } catch (e) { }
        }, 300));

        function renderSedeDropdown(sedes) {
            if (!sedes.length) {
                sedeDropdown.innerHTML = '<div class="p-2 text-muted small">Sin resultados</div>';
            } else {
                sedeDropdown.innerHTML = sedes.map(s => `
                    <div style="padding:8px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0;"
                        onmousedown="selectSede(${s.id_sede}, '${(s.nombre_comercial || '').replace(/'/g, "&#39;")}', '${(s.empresa_razon_social || '').replace(/'/g, "&#39;")}')"
                        onmouseover="this.style.background='#f0f8f0'" onmouseout="this.style.background=''">
                        <strong>${s.nombre_comercial}</strong><br>
                        <small class="text-muted">${s.empresa_razon_social || ''} · ${s.distrito || ''}</small>
                        ${s.tarifa_servicio ? `<span class="badge bg-success ms-1">S/ ${parseFloat(s.tarifa_servicio).toFixed(2)}</span>` : ''}
                    </div>
                `).join('');
            }
            sedeDropdown.style.display = 'block';
        }

        function selectSede(id, nombre, empresa) {
            document.getElementById('id_sede').value = id;
            sedeSearch.value = nombre;
            document.getElementById('sedeSelected').textContent = `✓ ${empresa}`;
            sedeDropdown.style.display = 'none';
        }

        document.addEventListener('click', e => {
            if (!e.target.closest('#sedeSearch') && !e.target.closest('#sedeDropdown')) {
                sedeDropdown.style.display = 'none';
            }
        });

        // ── Load selects ─────────────────────────────
        async function loadSelects() {
            try {
                // Plantas
                const plantasRes = await api.get('/plantas');
                if (plantasRes.success) {
                    const sel = document.getElementById('id_planta');
                    plantasRes.data.forEach(p => {
                        sel.innerHTML += `<option value="${p.id_planta}">${p.nombre_comercial}</option>`;
                    });
                }

                // Rutas recientes
                const rutasRes = await api.get('/rutas?limit=50');
                if (rutasRes.success) {
                    const sel = document.getElementById('id_ruta');
                    rutasRes.data.forEach(r => {
                        const fecha = new Date(r.fecha + 'T12:00:00').toLocaleDateString('es-PE');
                        sel.innerHTML += `<option value="${r.id_ruta}">${fecha} — ${r.vehiculo_placa || ''}</option>`;
                    });
                }

                // Empleados
                const empRes = await api.get('/empleados?activo=true');
                if (empRes.success) {
                    const options = empRes.data.map(e =>
                        `<option value="${e.id_empleado}">${e.nombres} ${e.apellidos}</option>`
                    ).join('');
                    document.getElementById('id_chofer').innerHTML += options;
                    document.getElementById('id_ayudante').innerHTML += options;
                }
            } catch (err) {
                console.error(err);
                showToast('Error cargando listas', 'warning');
            }
        }

        // ── Load existing data (edit mode) ───────────
        async function loadData() {
            try {
                const result = await api.get(`/servicios/${id}`);
                if (!result.success) { showToast('Error cargando servicio', 'danger'); return; }
                const d = result.data;

                // Sede
                document.getElementById('id_sede').value = d.id_sede || '';
                sedeSearch.value = d.sede_nombre || '';
                document.getElementById('sedeSelected').textContent = d.empresa_razon_social
                    ? `✓ ${d.empresa_razon_social}` : '';

                document.getElementById('id_planta').value = d.id_planta || '';
                const rutaLabel = [d.codigo_ruta, d.vehiculo_placa].filter(Boolean).join(' — ') ||
                    (d.id_ruta ? `Ruta #${d.id_ruta}` : '');
                setSelectValue('id_ruta', d.id_ruta, rutaLabel);

                // mes_servicio: comes as 'YYYY-MM' or 'YYYY-MM-DD'
                if (d.mes_servicio) {
                    document.getElementById('mes_servicio').value = d.mes_servicio.substring(0, 7);
                }

                document.getElementById('fecha_ejecucion').value = d.fecha_ejecucion || d.fecha_servicio || '';

                document.getElementById('estado').value = d.estado || 'programado';
                document.getElementById('estado_pago').value = d.estado_pago || 'pendiente';
                document.getElementById('forma_pago').value = d.forma_pago || '';
                document.getElementById('fecha_pago').value = d.fecha_pago || '';

                document.getElementById('residuo').value = d.residuo || '';
                document.getElementById('observaciones').value = d.observaciones || '';

                // Empleados
                if (d.empleados) {
                    const chofer = d.empleados.find(e => e.rol === 'chofer');
                    const ayudante = d.empleados.find(e => e.rol === 'ayudante');
                    const choferId = chofer?.id_empleado || d.ruta_id_chofer;
                    const ayudanteId = ayudante?.id_empleado || d.ruta_id_ayudante;
                    setSelectValue('id_chofer', choferId, employeeLabel(chofer, d.ruta_chofer_nombre));
                    setSelectValue('id_ayudante', ayudanteId, employeeLabel(ayudante, d.ruta_ayudante_nombre));
                } else {
                    setSelectValue('id_chofer', d.ruta_id_chofer, d.ruta_chofer_nombre);
                    setSelectValue('id_ayudante', d.ruta_id_ayudante, d.ruta_ayudante_nombre);
                }

                // Documents
                if (d.manifiesto) {
                    document.getElementById('numero_manifiesto').value = d.manifiesto.numero_manifiesto || '';
                    document.getElementById('id_manifiesto').value = d.manifiesto.id_manifiesto;
                    document.getElementById('peso_kg').value = d.manifiesto.peso_kg || '';
                    renderPdfStatus('manifiesto', d.manifiesto.doc_escaneado);
                } else {
                    document.getElementById('numero_manifiesto').value = '';
                    document.getElementById('id_manifiesto').value = '';
                    renderPdfStatus('manifiesto', null);
                }

                document.getElementById('numero_guia').value = d.guia ? (d.guia.numero_guia || '') : '';
                document.getElementById('id_guia').value = d.guia ? (d.guia.id_guia || '') : '';
                renderPdfStatus('guia', d.guia?.doc_escaneado);

                document.getElementById('numero_factura').value = d.factura ? (d.factura.numero_factura || '') : '';
                document.getElementById('id_factura').value = d.factura ? (d.factura.id_factura || '') : '';
                renderPdfStatus('factura', d.factura?.doc_escaneado);

            } catch (err) {
                console.error(err);
                showToast('Error cargando servicio', 'danger');
            }
        }

        // ── Submit ────────────────────────────────────
        function validatePdfFile(file) {
            if (!file) return null;
            const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
            if (!isPdf) {
                return 'Solo se permiten archivos PDF';
            }
            if (file.size > 20 * 1024 * 1024) {
                return 'El PDF no debe superar 20 MB';
            }
            return null;
        }

        function appendDocumentoFields(formData) {
            formData.append('numero_manifiesto', document.getElementById('numero_manifiesto').value || '');
            formData.append('numero_guia', document.getElementById('numero_guia').value || '');
            formData.append('numero_factura', document.getElementById('numero_factura').value || '');
            formData.append('peso_kg', document.getElementById('peso_kg').value || '');
            formData.append('residuo', document.getElementById('residuo').value || '');
        }

        async function uploadSelectedDocuments(serviceId) {
            for (const tipo of documentTypes) {
                const fileInput = document.getElementById(`pdf_${tipo}`);
                const file = fileInput?.files?.[0];
                if (!file) continue;
                const pdfError = validatePdfFile(file);
                if (pdfError) throw new Error(pdfError);

                const formData = new FormData();
                formData.append('tipo', tipo);
                formData.append('archivo_pdf', file);
                appendDocumentoFields(formData);

                const headers = {};
                const token = api.getToken();
                if (token) headers.Authorization = `Bearer ${token}`;

                const response = await fetch(api.buildUrl(`/servicios?action=upload_documento&id=${serviceId}`), {
                    method: 'POST',
                    headers,
                    body: formData
                });
                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.message || `Error subiendo PDF de ${tipo}`);
                }

                fileInput.value = '';
                renderPdfStatus(tipo, result.doc_escaneado);
                if (tipo === 'manifiesto') document.getElementById('id_manifiesto').value = result.id_documento || '';
                if (tipo === 'guia') document.getElementById('id_guia').value = result.id_documento || '';
                if (tipo === 'factura') document.getElementById('id_factura').value = result.id_documento || '';
            }
        }

        document.getElementById('dataForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id_sede = document.getElementById('id_sede').value;
            if (!id_sede) { showToast('Seleciona una sede', 'warning'); return; }

            // Build empleados array
            const empleados = [];
            const chofVal = document.getElementById('id_chofer').value;
            const ayuVal = document.getElementById('id_ayudante').value;
            if (chofVal) empleados.push({ id_empleado: chofVal, rol: 'chofer' });
            if (ayuVal) empleados.push({ id_empleado: ayuVal, rol: 'ayudante' });

            const data = {
                id_sede,
                id_planta: document.getElementById('id_planta').value || null,
                id_ruta: document.getElementById('id_ruta').value || null,
                mes_servicio: document.getElementById('mes_servicio').value || null,
                fecha_ejecucion: document.getElementById('fecha_ejecucion').value || null,
                estado: document.getElementById('estado').value,
                estado_pago: document.getElementById('estado_pago').value,
                forma_pago: document.getElementById('forma_pago').value || null,
                fecha_pago: document.getElementById('fecha_pago').value || null,
                residuo: document.getElementById('residuo').value || null,
                observaciones: document.getElementById('observaciones').value || null,
                peso_kg: document.getElementById('peso_kg').value || null,
                numero_manifiesto: document.getElementById('numero_manifiesto').value || null,
                numero_guia: document.getElementById('numero_guia').value || null,
                numero_factura: document.getElementById('numero_factura').value || null,
                empleados
            };

            try {
                const result = id
                    ? await api.put(`/servicios/${id}`, data)
                    : await api.post('/servicios', data);

                if (result.success) {
                    if (id) {
                        await uploadSelectedDocuments(id);
                    }
                    showToast('Servicio guardado exitosamente');
                    setTimeout(() => window.location.href = getRedirectUrl(), 1500);
                } else {
                    showToast(result.message || 'Error al guardar', 'danger');
                }
            } catch (err) {
                console.error(err);
                showToast(err.message || 'Error guardando servicio', 'danger');
            }
        });

        function goToManifiesto() {
            const manId = document.getElementById('id_manifiesto').value;
            if (manId) window.open(`../manifiestos/formulario.html?id=${manId}`, '_blank');
            else showToast('No hay manifiesto asociado', 'info');
        }
        function goToGuia() {
            const guiaId = document.getElementById('id_guia').value;
            if (guiaId) window.open(`../guias/formulario.html?id=${guiaId}`, '_blank');
            else showToast('No hay guía asociada', 'info');
        }
        function goToFactura() {
            const facturaId = document.getElementById('id_factura').value;
            if (facturaId) window.open(`../facturas/formulario.html?id=${facturaId}`, '_blank');
            else showToast('No hay factura asociada', 'info');
        }

        function getRedirectUrl() {
            const backParam = getUrlParam('back');
            const referrer = document.referrer || '';
            const id_sede = document.getElementById('id_sede').value;

            if (backParam === 'cartilla' && id_sede) {
                return `../sedes/cartilla.html?id=${id_sede}`;
            }
            if (referrer.includes('cartilla.html')) {
                return referrer;
            }
            if (referrer.includes('clientes/formulario.html')) {
                return referrer;
            }
            return 'listar.html';
        }

        function updateNavigationTargets() {
            const redirectUrl = getRedirectUrl();
            if (redirectUrl !== 'listar.html') {
                const cancelBtn = document.getElementById('btnCancel');
                if (cancelBtn) {
                    cancelBtn.href = redirectUrl;
                }
            }
        }

        // Init — cargar selects primero, luego rellenar datos en modo edición o pre-cargar sede
        const idSedeParam = getUrlParam('id_sede');
        loadSelects().then(async () => {
            if (id) {
                await loadData();
            } else if (idSedeParam) {
                try {
                    const res = await api.get(`/sedes/${idSedeParam}`);
                    if (res.success && res.data) {
                        selectSede(res.data.id_sede, res.data.nombre_comercial, res.data.empresa_razon_social);
                    }
                } catch (e) {
                    console.error('Error al cargar la sede pre-seleccionada:', e);
                }
            }
            updateNavigationTargets();
        });
    </script>
</body>

</html>
