<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <title>Prospecto - IO Control</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/global.css?v=2.5" rel="stylesheet">

</head>

<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item"><a href="listar.html">Prospectos</a></li>
                            <li class="breadcrumb-item active" id="pageTitle">Nuevo Prospecto</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <a href="../alertas/index.html" class="btn btn-light alert-badge">
                        <i class="bi bi-bell"></i><span class="badge bg-danger" id="alertCount">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" data-bs-toggle="modal"
                                    data-bs-target="#changePasswordModal"><i class="bi bi-key"></i> Cambiar
                                    Contraseña</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <div class="row">
                    <!-- Left Column: Form -->
                    <div class="col-lg-8">
                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-person-hearts"></i> Datos del Prospecto</span>
                                <span class="estado-badge" id="estadoBadge">Nuevo</span>
                            </div>
                            <div class="card-body">
                                <form id="form">
                                    <h6 class="section-title text-primary mb-3 mt-2"><i
                                            class="bi bi-person-lines-fill"></i> Datos Principales</h6>
                                    <div class="bg-light p-3 rounded mb-4 border">
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <div class="form-floating">
                                                    <input type="text" class="form-control" id="nombre_contacto"
                                                        placeholder="Nombre del Contacto" required>
                                                    <label for="nombre_contacto">Nombre del Contacto <span
                                                            class="text-danger">*</span></label>
                                                </div>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <div class="form-floating">
                                                    <input type="text" class="form-control" id="razon_social"
                                                        placeholder="Razón Social / Empresa">
                                                    <label for="razon_social">Razón Social / Empresa</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-4 mb-3">
                                                <label class="form-label">RUC <small
                                                        class="text-muted">(Opcional)</small></label>
                                                <div class="input-group">
                                                    <input type="text" class="form-control" id="ruc" maxlength="11"
                                                        placeholder="Ingrese RUC">
                                                    <button class="btn btn-primary" type="button" onclick="searchRuc()"
                                                        id="btnSearchRuc" title="Buscar en SUNAT">
                                                        <i class="bi bi-search"></i>
                                                    </button>
                                                </div>
                                                <div class="form-text text-warning" id="rucWarning"
                                                    style="display: none;">
                                                    <i class="bi bi-exclamation-triangle"></i>
                                                    <span id="rucWarningText"></span>
                                                </div>
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <div class="form-floating mt-md-4 mt-0 pt-md-1">
                                                    <input type="tel" class="form-control" id="telefono"
                                                        placeholder="Teléfono" required>
                                                    <label for="telefono">Teléfono <span
                                                            class="text-danger">*</span></label>
                                                </div>
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <div class="form-floating mt-md-4 mt-0 pt-md-1">
                                                    <input type="email" class="form-control" id="email"
                                                        placeholder="Email">
                                                    <label for="email">Email</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <div class="form-floating">
                                                    <select class="form-select" id="tipo_negocio"
                                                        aria-label="Tipo de Negocio">
                                                        <option value="Odontólogo">Odontólogo / Clínica Dental</option>
                                                        <option value="Veterinario">Veterinario / Clínica Veterinaria
                                                        </option>
                                                        <option value="Laboratorio">Laboratorio Clínico</option>
                                                        <option value="Centro Médico">Centro Médico / Policlínico
                                                        </option>
                                                        <option value="Hospital">Hospital / Clínica</option>
                                                        <option value="Farmacia">Farmacia / Botica</option>
                                                        <option value="Spa/Estética">Spa / Centro Estético</option>
                                                        <option value="Tatuajes">Estudio de Tatuajes</option>
                                                        <option value="Industrial">Empresa Industrial</option>
                                                        <option value="Otro">Otro</option>
                                                    </select>
                                                    <label for="tipo_negocio">Tipo de Negocio</label>
                                                </div>
                                            </div>
                                            <div class="col-md-6 mb-3" id="vendedorContainer" style="display: none;">
                                                <div class="form-floating">
                                                    <select class="form-select" id="vendedor"
                                                        aria-label="Vendedor Asignado">
                                                        <option value="">Seleccione vendedor asignado...</option>
                                                    </select>
                                                    <label for="vendedor">Vendedor Asignado</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <h6 class="section-title text-primary mt-4 mb-3"><i class="bi bi-geo-alt"></i>
                                        Ubicación</h6>
                                    <div class="bg-light p-3 rounded mb-4 border">
                                        <div class="row">
                                            <div class="col-md-8 mb-3">
                                                <label class="form-label">Dirección</label>
                                                <div class="address-container">
                                                    <div class="input-group">
                                                        <input type="text" class="form-control" id="direccion"
                                                            placeholder="Buscar dirección..." autocomplete="off">
                                                        <button type="button" class="btn btn-primary btn-location"
                                                            id="btnMyLocation" title="Usar mi ubicación actual">
                                                            <i class="bi bi-geo-alt-fill"></i>
                                                            <span class="d-none d-sm-inline">Mi ubicación</span>
                                                        </button>
                                                    </div>
                                                    <div class="address-suggestions" id="addressSuggestions"></div>
                                                </div>
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <div class="form-floating mt-md-4 mt-0 pt-md-1">
                                                    <input type="text" class="form-control" id="distrito"
                                                        placeholder="Distrito">
                                                    <label for="distrito">Distrito</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div id="map" class="shadow-sm border"
                                            style="height: 400px; border-radius: 8px;"></div>
                                        <div class="row coords-row mt-3">
                                            <div class="col-6 mb-3">
                                                <div class="form-floating">
                                                    <input type="text" class="form-control" id="latitud"
                                                        placeholder="Latitud" readonly>
                                                    <label for="latitud">Latitud</label>
                                                </div>
                                            </div>
                                            <div class="col-6 mb-3">
                                                <div class="form-floating">
                                                    <input type="text" class="form-control" id="longitud"
                                                        placeholder="Longitud" readonly>
                                                    <label for="longitud">Longitud</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <h6 class="section-title text-primary mt-4 mb-3"><i
                                            class="bi bi-chat-left-text"></i> Notas y Seguimiento</h6>
                                    <div class="bg-light p-3 rounded mb-4 border">
                                        <div class="mb-3">
                                            <div class="form-floating">
                                                <textarea class="form-control" id="observaciones"
                                                    placeholder="Observaciones" style="height: 80px;"></textarea>
                                                <label for="observaciones">Observaciones</label>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <div class="form-floating">
                                                    <input type="date" class="form-control"
                                                        id="fecha_siguiente_contacto"
                                                        placeholder="Fecha Próximo Contacto">
                                                    <label for="fecha_siguiente_contacto">Fecha Próximo Contacto</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <div class="form-floating">
                                                <textarea class="form-control" id="notas_seguimiento"
                                                    placeholder="Notas de Seguimiento"
                                                    style="height: 100px;"></textarea>
                                                <label for="notas_seguimiento">Notas de Seguimiento (Ej: 15/01 -
                                                    Llamado...)</label>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="d-flex gap-2 mt-4 form-action-buttons border-top pt-4">
                                        <button type="submit" class="btn btn-primary px-4 py-2">
                                            <i class="bi bi-check-lg"></i> Guardar Prospecto
                                        </button>
                                        <a href="listar.html" class="btn btn-light border px-4 py-2">Cancelar</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <!-- Right Column: Estado & Actions -->
                    <div class="col-lg-4">
                        <div class="card mb-4 shadow-sm border-0" id="estadoCard"
                            style="display: none; border-radius: 12px; overflow: hidden;">
                            <div class="card-header bg-primary text-white border-0 py-3">
                                <h6 class="mb-0"><i class="bi bi-bar-chart-steps"></i> Estado del Prospecto</h6>
                            </div>
                            <div class="card-body bg-light">
                                <select class="form-select form-select-lg mb-3 shadow-sm border-0" id="estadoSelect"
                                    style="border-radius: 8px;">
                                    <option value="nuevo">🔵 Nuevo</option>
                                    <option value="contactado">📞 Contactado</option>
                                    <option value="interesado">⭐ Interesado</option>
                                    <option value="negociando">💬 Negociando</option>
                                    <option value="ganado">🏆 Ganado</option>
                                    <option value="perdido">❌ Perdido</option>
                                </select>
                                <button class="btn btn-primary w-100 py-2 shadow-sm" style="border-radius: 8px;"
                                    onclick="updateEstado()">
                                    <i class="bi bi-arrow-repeat"></i> Actualizar Estado
                                </button>
                            </div>
                        </div>
                        <div class="card mb-4 shadow-sm border-0" id="infoCard"
                            style="display: none; border-radius: 12px; overflow: hidden;">
                            <div class="card-header bg-white border-bottom py-3">
                                <h6 class="mb-0 text-muted"><i class="bi bi-info-circle"></i> Información Detallada</h6>
                            </div>
                            <div class="card-body">
                                <div class="info-row d-flex justify-content-between mb-2 pb-2 border-bottom">
                                    <span class="info-label text-muted small">Fecha Creación:</span>
                                    <span class="info-value text-dark fw-medium small" id="infoCreado">-</span>
                                </div>
                                <div class="info-row d-flex justify-content-between">
                                    <span class="info-label text-muted small">Última Modificación:</span>
                                    <span class="info-value text-dark fw-medium small" id="infoModificado">-</span>
                                </div>
                            </div>
                        </div>
                        <div class="card shadow-sm border-0" id="actionsCard"
                            style="display: none; border-radius: 12px; overflow: hidden;">
                            <div class="card-header bg-white border-bottom py-3">
                                <h6 class="mb-0 text-muted"><i class="bi bi-lightning"></i> Acciones Rápidas</h6>
                            </div>
                            <div class="card-body d-grid gap-3">
                                <a href="#"
                                    class="btn btn-outline-success py-2 d-flex align-items-center justify-content-center gap-2"
                                    id="btnWhatsApp" target="_blank" style="border-radius: 8px;">
                                    <i class="bi bi-whatsapp"></i> Chat WhatsApp
                                </a>
                                <button
                                    class="btn btn-outline-danger py-2 d-flex align-items-center justify-content-center gap-2"
                                    style="border-radius: 8px;" onclick="deleteProspecto()">
                                    <i class="bi bi-trash"></i> Eliminar Prospecto
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- Mobile Sticky Action Bar -->
    <div class="mobile-action-bar">
        <a href="listar.html" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Cancelar
        </a>
        <button type="button" class="btn btn-primary" onclick="document.getElementById('form').requestSubmit()">
            <i class="bi bi-check-lg"></i> Guardar
        </button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/app.js?v=2.5"></script>
    <script>
        bootControlPage('prospectos');
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        let map, marker;
        let MapClass, MarkerClass, AutocompleteClass;
        let currentData = null;

        async function resolveGoogleMapsKey() {
            window.API_CONFIG = window.API_CONFIG || {};
            let configuredKey = String(window.API_CONFIG.GOOGLE_MAPS_API_KEY || '').trim();
            if (configuredKey && !configuredKey.includes('YOUR_GOOGLE_MAPS_API_KEY')) {
                return configuredKey;
            }

            // If running locally, try to load config.js dynamically first
            const isLocal = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' || 
                            window.location.hostname.startsWith('192.168.');
            if (isLocal) {
                try {
                    await new Promise((resolve) => {
                        const script = document.createElement('script');
                        script.src = '../../js/config.js';
                        script.onload = () => resolve();
                        script.onerror = () => resolve();
                        document.head.appendChild(script);
                    });
                    configuredKey = String(window.API_CONFIG.GOOGLE_MAPS_API_KEY || '').trim();
                    if (configuredKey && !configuredKey.includes('YOUR_GOOGLE_MAPS_API_KEY')) {
                        return configuredKey;
                    }
                } catch (e) {
                    // ignore
                }
            }

            try {
                const result = await api.get('/maps-config', { cache: false });
                const serverKey = String(result?.data?.googleMapsApiKey || '').trim();
                if (serverKey) {
                    window.API_CONFIG.GOOGLE_MAPS_API_KEY = serverKey;
                }
                return serverKey;
            } catch (error) {
                console.warn('No se pudo resolver Google Maps API key desde el servidor', error);
                return '';
            }
        }

        function loadGoogleMapsApi(key) {
            if (window.google?.maps?.importLibrary) return Promise.resolve();
            if (window.__googleMapsLoadingPromise) return window.__googleMapsLoadingPromise;

            window.__googleMapsLoadingPromise = new Promise((resolve, reject) => {
                (g => { var h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary", q = "__ib__", m = document, b = window; b = b[c] || (b[c] = {}); var d = b.maps || (b.maps = {}), r = new Set, e = new URLSearchParams, u = () => h || (h = new Promise(async (f, n) => { await (a = m.createElement("script")); e.set("libraries", [...r] + ""); for (k in g) e.set(k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()), g[k]); e.set("callback", c + ".maps." + q); a.src = `https://maps.${c}apis.com/maps/api/js?` + e; d[q] = () => { f(); resolve(); }; a.onerror = () => { h = n(Error(p + " could not load.")); reject(Error(p + " could not load.")); }; a.nonce = m.querySelector("script[nonce]")?.nonce || ""; m.head.append(a) })); d[l] ? console.warn(p + " only loads once. Ignoring:", g) : d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)) })({
                    key: key,
                    v: "weekly",
                    language: "es",
                    region: "PE"
                });

                google.maps.importLibrary("maps").catch(reject);
            });

            return window.__googleMapsLoadingPromise;
        }

        // Initialize Google Maps
        async function initMap(lat = -12.0464, lng = -77.0428) {
            if (!window.google || !window.google.maps) {
                console.error("Google Maps SDK not loaded");
                const mapEl = document.getElementById('map');
                if (mapEl) {
                    mapEl.innerHTML = '<div style="padding:20px;text-align:center;color:#666;">No se pudo cargar el mapa. Verifique la API Key de Google Maps.</div>';
                }
                return;
            }
            try {
                MapClass = (await google.maps.importLibrary("maps")).Map;
                MarkerClass = (await google.maps.importLibrary("marker")).Marker;
                AutocompleteClass = (await google.maps.importLibrary("places")).Autocomplete;

                map = new MapClass(document.getElementById('map'), {
                    center: { lat, lng },
                    zoom: 15,
                    mapTypeControl: true,
                    streetViewControl: false,
                    fullscreenControl: true
                });

                marker = new MarkerClass({
                    position: { lat, lng },
                    map: map,
                    draggable: true,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 10,
                        fillColor: '#1B5E20',
                        fillOpacity: 1,
                        strokeColor: '#fff',
                        strokeWeight: 2
                    }
                });

                marker.addListener('dragend', function () {
                    const pos = marker.getPosition();
                    document.getElementById('latitud').value = pos.lat().toFixed(6);
                    document.getElementById('longitud').value = pos.lng().toFixed(6);
                });

                map.addListener('click', function (e) {
                    marker.setPosition(e.latLng);
                    document.getElementById('latitud').value = e.latLng.lat().toFixed(6);
                    document.getElementById('longitud').value = e.latLng.lng().toFixed(6);
                });

                document.getElementById('latitud').value = lat.toFixed(6);
                document.getElementById('longitud').value = lng.toFixed(6);

                // Initialize autocomplete if available
                if (typeof initAutocomplete === 'function') {
                    initAutocomplete();
                }
            } catch (err) {
                console.error('Error initializing map:', err);
            }
        }
        // Load data if editing
        async function loadData() {
            const user = getUser();
            if (user && user.rol === 'admin') {
                try {
                    const uRes = await api.get('/usuarios');
                    if (uRes.success) {
                        const vSelect = document.getElementById('vendedor');
                        uRes.data.forEach(u => {
                            if (u.activo) {
                                const option = document.createElement('option');
                                option.value = u.nombre_completo || u.username;
                                option.textContent = u.nombre_completo || u.username;
                                vSelect.appendChild(option);
                            }
                        });
                        document.getElementById('vendedorContainer').style.display = 'block';
                    }
                } catch (e) { console.error("Error loading users", e); }
            }

            if (!id) {
                initMap();
                return;
            }
            try {
                const result = await api.get(`/prospectos/${id}`);
                if (result.success) {
                    currentData = result.data;
                    const esOwner = result.data.es_propietario;

                    fillForm(result.data);
                    document.getElementById('pageTitle').textContent = result.data.nombre_contacto;

                    // Show edit-only elements only for owner
                    if (esOwner) {
                        document.getElementById('estadoCard').style.display = 'block';
                        document.getElementById('actionsCard').style.display = 'block';
                    } else {
                        // Disable form for non-owners
                        disableForm();
                        showToast('Solo puede ver este prospecto. Solo el creador puede editarlo.', 'warning');
                    }
                    document.getElementById('infoCard').style.display = 'block';
                }
            } catch (err) {
                showToast('Error cargando datos', 'danger');
            }
        }

        // Disable all form inputs for non-owners
        function disableForm() {
            const form = document.getElementById('form');
            const inputs = form.querySelectorAll('input, select, textarea, button');
            inputs.forEach(input => {
                input.disabled = true;
            });
            // Hide save buttons
            document.querySelector('.form-action-buttons').style.display = 'none';
            document.querySelector('.mobile-action-bar').style.display = 'none';
            // Add read-only badge to header
            const header = document.querySelector('.card-header span');
            if (header) {
                header.innerHTML = '<i class="bi bi-eye"></i> Vista de Prospecto (Solo lectura)';
            }
        }
        function fillForm(data) {
            document.getElementById('nombre_contacto').value = data.nombre_contacto || '';
            document.getElementById('razon_social').value = data.razon_social || '';
            document.getElementById('ruc').value = data.ruc || '';
            document.getElementById('telefono').value = data.telefono || '';
            document.getElementById('email').value = data.email || '';
            document.getElementById('direccion').value = data.direccion || '';
            document.getElementById('distrito').value = data.distrito || '';
            document.getElementById('tipo_negocio').value = data.tipo_negocio || 'Otro';
            if (document.getElementById('vendedor')) {
                // To safely target options that might take a moment to inject 
                setTimeout(() => { document.getElementById('vendedor').value = data.vendedor || ''; }, 100);
            }
            document.getElementById('observaciones').value = data.observaciones || '';
            document.getElementById('fecha_siguiente_contacto').value = data.fecha_siguiente_contacto || '';
            document.getElementById('notas_seguimiento').value = data.notas_seguimiento || '';
            // Estado
            document.getElementById('estadoSelect').value = data.estado;
            updateEstadoBadge(data.estado);
            // Info
            document.getElementById('infoCreado').textContent = formatDateTime(data.fecha_creacion);
            document.getElementById('infoModificado').textContent = formatDateTime(data.fecha_modificacion);
            // WhatsApp link
            if (data.telefono) {
                const phone = data.telefono.replace(/\D/g, '');
                document.getElementById('btnWhatsApp').href = `https://wa.me/51${phone}`;
            }
            // Map
            const lat = parseFloat(data.latitud) || -12.0464;
            const lng = parseFloat(data.longitud) || -77.0428;
            initMap(lat, lng);
        }
        function updateEstadoBadge(estado) {
            const badge = document.getElementById('estadoBadge');
            badge.textContent = estado.charAt(0).toUpperCase() + estado.slice(1);
            badge.className = 'estado-badge estado-' + estado;
        }
        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('es-PE') + ' ' + date.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
        }
        // Form submit
        document.getElementById('form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const data = {
                nombre_contacto: document.getElementById('nombre_contacto').value,
                razon_social: document.getElementById('razon_social').value,
                ruc: document.getElementById('ruc').value,
                telefono: document.getElementById('telefono').value,
                email: document.getElementById('email').value,
                direccion: document.getElementById('direccion').value,
                distrito: document.getElementById('distrito').value,
                latitud: document.getElementById('latitud').value,
                longitud: document.getElementById('longitud').value,
                tipo_negocio: document.getElementById('tipo_negocio').value,
                vendedor: (() => {
                    const adminSel = document.getElementById('vendedor');
                    return (adminSel && adminSel.offsetParent !== null && adminSel.value) ? adminSel.value : '';
                })(),
                observaciones: document.getElementById('observaciones').value,
                fecha_siguiente_contacto: document.getElementById('fecha_siguiente_contacto').value,
                notas_seguimiento: document.getElementById('notas_seguimiento').value
            };
            try {
                let result;
                if (id) {
                    result = await api.put(`/prospectos/${id}`, data);
                } else {
                    result = await api.post('/prospectos', data);
                }
                if (result.success) {
                    showToast(id ? 'Prospecto actualizado' : 'Prospecto creado');
                    setTimeout(() => {
                        window.location.href = 'listar.html';
                    }, 1000);
                } else {
                    showToast(result.message, 'danger');
                }
            } catch (err) {
                showToast('Error guardando', 'danger');
            }
        });
        async function updateEstado() {
            const estado = document.getElementById('estadoSelect').value;
            try {
                const result = await api.put(`/prospectos/${id}?action=estado`, { estado });
                if (result.success) {
                    showToast(result.message);
                    updateEstadoBadge(estado);
                } else {
                    showToast(result.message, 'danger');
                }
            } catch (err) {
                showToast('Error actualizando estado', 'danger');
            }
        }
        async function deleteProspecto() {
            if (!confirmDelete()) return;
            try {
                const result = await api.delete(`/prospectos/${id}`);
                if (result.success) {
                    showToast('Prospecto eliminado');
                    window.location.href = 'listar.html';
                } else {
                    showToast(result.message, 'danger');
                }
            } catch (err) {
                showToast('Error eliminando', 'danger');
            }
        }
        // ==================== RUC DUPLICATE CHECK & SUNAT SEARCH ====================
        const rucInput = document.getElementById('ruc');
        const rucWarning = document.getElementById('rucWarning');
        const rucWarningText = document.getElementById('rucWarningText');
        let rucCheckTimeout = null;
        // Configuration for SUNAT API (via local proxy)
        // Token is configured in environment variables and used by /api/sunat-ruc.php
        async function searchRuc() {
            const ruc = rucInput.value.trim();
            if (!ruc || ruc.length !== 11 || !/^\d{11}$/.test(ruc)) {
                showToast('El RUC debe tener exactamente 11 dígitos numéricos', 'warning');
                return;
            }
            const btn = document.getElementById('btnSearchRuc');
            const icon = btn.querySelector('i');
            const originalClass = icon.className;
            // Show loading
            icon.className = 'spinner-border spinner-border-sm';
            btn.disabled = true;
            try {
                // Use local PHP proxy to avoid CORS issues
                const response = await fetch(`/api/sunat-ruc.php?ruc=${ruc}`);
                const result = await response.json();
                console.log('SUNAT Proxy Response:', result);
                if (result.success && result.data) {
                    const data = result.data;
                    if (data.razonSocial) {
                        document.getElementById('razon_social').value = data.razonSocial;
                    }
                    if (data.direccion) {
                        let fullAddress = data.direccion;
                        if (data.distrito && !data.direccion.toLowerCase().includes(data.distrito.toLowerCase())) {
                            fullAddress += ', ' + data.distrito;
                        }
                        document.getElementById('direccion').value = fullAddress;
                        searchAddress(fullAddress);
                    }
                    if (data.distrito) document.getElementById('distrito').value = data.distrito;
                    if (data.departamento) document.getElementById('departamento').value = data.departamento;
                    showToast('Datos encontrados en SUNAT', 'success');
                } else {
                    showToast(result.error || 'No se encontraron datos para este RUC', 'warning');
                }
            } catch (err) {
                console.error('Error searching RUC:', err);
                showToast('Error al consultar SUNAT. Verifique su conexión.', 'warning');
            } finally {
                icon.className = originalClass;
                btn.disabled = false;
            }
        }
        async function checkRucDuplicate(ruc) {
            if (!ruc || ruc.length < 11) {
                rucWarning.style.display = 'none';
                return;
            }
            try {
                const result = await api.get(`/prospectos?ruc=${encodeURIComponent(ruc)}`);
                if (result.success && result.data && result.data.length > 0) {
                    const duplicates = result.data.filter(p => !id || p.id_prospecto != id);
                    if (duplicates.length > 0) {
                        rucWarningText.textContent = 'Este RUC ya existe: ' + duplicates.map(p => p.nombre_contacto).join(', ');
                        rucWarning.style.display = 'block';
                        return;
                    }
                }
                rucWarning.style.display = 'none';
            } catch (err) { console.error('Error checking RUC:', err); }
        }
        rucInput.addEventListener('input', function () {
            if (rucCheckTimeout) clearTimeout(rucCheckTimeout);
            rucCheckTimeout = setTimeout(() => checkRucDuplicate(this.value), 500);
        });
        // ==================== ADDRESS AUTOCOMPLETE & GEOLOCATION ====================
        const direccionInput = document.getElementById('direccion');
        const suggestionsBox = document.getElementById('addressSuggestions');
        const btnMyLocation = document.getElementById('btnMyLocation');
        let searchTimeout = null;

        // Initialize Google Places Autocomplete on direccion field
        let autocomplete;
        function initAutocomplete() {
            autocomplete = new google.maps.places.Autocomplete(direccionInput, {
                componentRestrictions: { country: 'PE' },
                fields: ['address_components', 'geometry', 'formatted_address', 'name'],
                types: ['address']
            });

            autocomplete.addListener('place_changed', function () {
                const place = autocomplete.getPlace();
                if (!place.geometry || !place.geometry.location) return;

                const lat = place.geometry.location.lat();
                const lng = place.geometry.location.lng();

                // Extract district from address components
                let distrito = '';
                if (place.address_components) {
                    for (const component of place.address_components) {
                        if (component.types.includes('locality')) {
                            distrito = component.long_name;
                            break;
                        } else if (component.types.includes('sublocality_level_1') && !distrito) {
                            distrito = component.long_name;
                        }
                    }
                }

                document.getElementById('distrito').value = distrito;

                // Update map and coordinates
                marker.setPosition({ lat, lng });
                map.panTo({ lat, lng });
                map.setZoom(17);
                document.getElementById('latitud').value = lat.toFixed(6);
                document.getElementById('longitud').value = lng.toFixed(6);
            });
        }
        // ==================== GEOLOCATION (Use my location) ====================
        btnMyLocation.addEventListener('click', function () {
            if (!navigator.geolocation) {
                showToast('Tu navegador no soporta geolocalización', 'warning');
                return;
            }
            // Show loading state
            this.classList.add('loading');
            this.querySelector('i').className = 'bi bi-arrow-repeat';
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    // Update map and marker
                    marker.setPosition({ lat, lng });
                    map.panTo({ lat, lng });
                    map.setZoom(17);
                    document.getElementById('latitud').value = lat.toFixed(6);
                    document.getElementById('longitud').value = lng.toFixed(6);
                    // Reverse geocode to get address
                    await reverseGeocode(lat, lng);
                    // Reset button
                    this.classList.remove('loading');
                    this.querySelector('i').className = 'bi bi-geo-alt-fill';
                    showToast('Ubicación obtenida', 'success');
                },
                (error) => {
                    this.classList.remove('loading');
                    this.querySelector('i').className = 'bi bi-geo-alt-fill';
                    let message = 'Error obteniendo ubicación';
                    if (error.code === 1) message = 'Permiso de ubicación denegado';
                    else if (error.code === 2) message = 'Ubicación no disponible';
                    else if (error.code === 3) message = 'Tiempo de espera agotado';
                    showToast(message, 'danger');
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        });
        // Reverse geocode using Google Maps
        async function reverseGeocode(lat, lng) {
            if (!window.google || !window.google.maps) return;
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ location: { lat, lng } }, (results, status) => {
                if (status === 'OK' && results[0]) {
                    // Get the most specific address
                    direccionInput.value = results[0].formatted_address.split(',')[0] || '';
                    // Extract district from address components
                    const components = results[0].address_components || [];
                    const locality = components.find(c => c.types.includes('locality'));
                    const sublocality = components.find(c => c.types.includes('sublocality_level_1'));
                    if (locality || sublocality) {
                        document.getElementById('distrito').value = (locality || sublocality).long_name;
                    }
                }
            });
        }
        
        async function initGoogleMapsAndLoadData() {
            try {
                const key = await resolveGoogleMapsKey();
                if (key) {
                    await loadGoogleMapsApi(key);
                } else {
                    console.error('Google Maps API key could not be resolved');
                }
            } catch (err) {
                console.error('Error loading Google Maps:', err);
            } finally {
                await loadData();
            }
        }

        // Initialize page
        initGoogleMapsAndLoadData();
    </script>
</body>

</html>
