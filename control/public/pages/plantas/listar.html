<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1B5E20">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Plantas - IO Group</title>
    <!-- Preconnect para optimizar carga -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/global.css" rel="stylesheet">
</head>
<body class="control-app">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <nav class="top-nav">
                <div class="breadcrumb-container">
                    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="../dashboard.html">Dashboard</a></li>
                            <li class="breadcrumb-item active">Plantas de Tratamiento</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <a href="../alertas/index.html" class="btn btn-light alert-badge">
                        <i class="bi bi-bell"></i><span class="badge bg-danger" id="alertCount">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span id="userName">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="bi bi-key"></i> Cambiar Contraseña</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                        class="bi bi-box-arrow-right"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="content-area">
                <div class="table-container">
                    <div class="table-header">
                        <div>
                            <h5 class="table-title mb-0"><i class="bi bi-hospital"></i> Plantas de Tratamiento</h5>
                        </div>
                        <div class="d-flex gap-2 desktop-filters">
                            <input type="text" class="form-control" id="searchInput" placeholder="Buscar..."
                                style="width: 200px;">
                            <a href="formulario.html" class="btn btn-primary btn-new-desktop" id="btnNew"><i
                                    class="bi bi-plus"></i>
                                Nueva</a>
                        </div>
                        <!-- Mobile Filters -->
                        <div class="mobile-filters">
                            <div class="filter-row">
                                <input type="text" class="form-control form-control-sm" id="searchInputMobile"
                                    placeholder="Buscar planta...">
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Razón Social</th>
                                    <th class="hide-on-mobile">RUC</th>
                                    <th class="hide-on-mobile">Tipo Tratamiento</th>
                                    <th class="hide-on-mobile">Código EPS</th>
                                    <th class="hide-on-mobile">Ubicación</th>
                                    <th>Estado</th>
                                    <th width="100">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="7" class="text-center py-4">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- FAB for mobile -->
    <a href="formulario.html" class="fab" id="fabNew" aria-label="Nueva Planta">
        <i class="bi bi-plus"></i>
    </a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/table-sort.js"></script>
    <script src="../../js/app.js?v=2.2"></script>
    <script>
        document.getElementById('sidebar').innerHTML = getSidebarHTML();
        initPage('plantas');
        const canEditCurrentModule = canEditModule('plantas');
        if (!canEditCurrentModule) {
            document.getElementById('btnNew').style.display = 'none';
            document.getElementById('fabNew').style.display = 'none';
        }
        let allData = [];
        let tableSorter = null;
        async function loadData() {
            try {
                const result = await api.get('/plantas');
                if (result.success) {
                    allData = result.data;
                    renderTable(allData);
                    // Inicializar ordenamiento de columnas
                    if (!tableSorter) {
                        tableSorter = new TableSort('tableBody', {
                            columns: ['razon_social', 'ruc', 'tipo_tratamiento', 'codigo_eps', 'distrito', 'activo', null],
                            onSort: (sortedData) => renderTable(sortedData)
                        });
                    }
                    tableSorter.setData(allData);
                }
            } catch (err) {
                showToast('Error cargando datos', 'danger');
            }
        }
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No hay registros</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>
                        <strong>${item.razon_social}</strong>
                        ${item.nombre_comercial ? `<br><small class="text-muted">${item.nombre_comercial}</small>` : ''}
                    </td>
                    <td>${item.ruc}</td>
                    <td>${item.tipo_tratamiento || '-'}</td>
                    <td><span class="badge bg-info">${item.codigo_eps || '-'}</span></td>
                    <td><small>${item.distrito || ''} ${item.provincia ? ', ' + item.provincia : ''}</small></td>
                    <td>${item.activo ? '<span class="badge bg-success">Activo</span>' : '<span class="badge bg-secondary">Inactivo</span>'}</td>
                    <td>
                        <a href="formulario.html?id=${item.id_planta}" class="btn btn-sm btn-outline-primary btn-action"><i class="bi bi-pencil"></i></a>
                        ${canEditCurrentModule ? `<button class="btn btn-sm btn-outline-danger btn-action" onclick="deleteItem(${item.id_planta})"><i class="bi bi-trash"></i></button>` : ''}
                    </td>
                </tr>
            `).join('');
        }
        document.getElementById('searchInput').addEventListener('input', function (e) {
            const term = e.target.value.toLowerCase();
            const filtered = allData.filter(item =>
                item.razon_social?.toLowerCase().includes(term) ||
                item.ruc?.includes(term) ||
                item.tipo_tratamiento?.toLowerCase().includes(term)
            );
            renderTable(filtered);
            if (tableSorter) tableSorter.setData(filtered);
        });
        async function deleteItem(id) {
            if (!confirmDelete()) return;
            try {
                const result = await api.delete(`/plantas/${id}`);
                if (result.success) {
                    showToast('Planta eliminada');
                    loadData();
                } else {
                    showToast(result.message, 'danger');
                }
            } catch (err) {
                showToast('Error eliminando', 'danger');
            }
        }
        loadData();
    </script>
</body>
</html>
